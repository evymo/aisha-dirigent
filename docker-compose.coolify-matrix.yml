    <<: *bridge-common
    profiles: ["bridge-discord"]
    image: ${IMAGE_MAUTRIX_DISCORD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-bridge-discord
    volumes:
