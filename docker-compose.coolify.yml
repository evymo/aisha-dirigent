    <<: *v2-common
    build:
      context: .
      dockerfile: services/svc-web-artifact/Dockerfile
      args:
        AISHA_WEB_DESIGN_GIT_URL: ${AISHA_WEB_DESIGN_GIT_URL:-}
        AISHA_WEB_DESIGN_SUBDIR: ${AISHA_WEB_DESIGN_SUBDIR:-}
        AISHA_WEB_DESIGN_CACHEBUST: ${AISHA_WEB_DESIGN_CACHEBUST:-}
        AISHA_SEED_DOMAIN: ${AISHA_SEED_DOMAIN:-}
      secrets:
        - forgejo_token
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-web-artifact
    expose:
      - "3030"
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3030
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AISHA_GATEWAY_URL: http://${APP_NAME_PREFIX:?identita instance}-gateway:3001
      AISHA_SERVICE_KEY: ${POSTGREST_SERVICE_TOKEN:?required}
      AISHA_LLM_MOCK: ${AISHA_LLM_MOCK:-0}
      DOMAINS_DIR: /app/domains
      AISHA_SEED_DOMAIN: ${AISHA_SEED_DOMAIN:-}
      DEFAULT_PAGE_SLUG: ${DEFAULT_PAGE_SLUG:-index}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      MAX_ZIP_ENTRIES: ${MAX_ZIP_ENTRIES:-200}
      MAX_ZIP_UNCOMPRESSED_BYTES: ${MAX_ZIP_UNCOMPRESSED_BYTES:-104857600}
