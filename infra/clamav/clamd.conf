# clamd.conf — AISHA shared antivirus sidecar (flow-through scanner for uploads + mail)
# Baked into the image (Coolify v4 does not honour the top-level `configs:` directive;
# see docker-compose.coolify.yml PR #187 note) — NOT bind-mounted.
#
# Hardened for a flow-through scanner exposed to UNTRUSTED input: explicit scan limits
# bound zip-bomb / nested-archive CPU+memory blowups, and encrypted archives (which clamd
# cannot open) are ALERTED rather than passed as CLEAN (fail-closed at the engine).

# Listen on TCP for INSTREAM scans from the av-scan client lib (sibling containers only;
# never published to a host port — reachability is via the docker network alias `clamd`).
TCPSocket 3310
TCPAddr 0.0.0.0

# LocalSocket is REQUIRED by the clamav/clamav image's /init entrypoint, which polls
# `[ -S /run/clamav/clamd.sock ]` (or /tmp/clamd.sock) to confirm clamd is up. With a
# TCP-only config the socket file never appears, so /init times out after its 1800s
# (CLAMD_STARTUP_TIMEOUT) wait, prints "Failed to start clamd", and EXITS — restarting
# the container on an EXACT 30-minute cycle (verified live via captured `die` events
# 12:19→12:49→13:19→…). clamd serves both sockets simultaneously: /init + clamdscan
# health checks use the LocalSocket, the av-scan clients keep using TCP 3310.
LocalSocket /run/clamav/clamd.sock

# Foreground (container manages lifecycle).
Foreground yes
LogTime yes

# ── Reload reliability ──────────────────────────────────────────────────────
# Serve the OLD signature DB while a freshclam-triggered reload parses the NEW one,
# instead of blocking every scan (and the healthcheck PING) for the 2-3 min it takes
# to load 3.6M signatures. Costs ~2x DB memory during the reload window (~2 GB, well
# within the host budget); without it, each reload would flap the container unhealthy.
ConcurrentDatabaseReload yes

# ── Scan limits (anti zip-bomb / resource-exhaustion) ───────────────────────
# MaxFileSize must exceed the largest per-tier attachment cap (partner = 100 MB) + headroom.
MaxFileSize 128M
MaxScanSize 512M
MaxRecursion 16
MaxFiles 10000
MaxScanTime 180000
MaxEmbeddedPE 64M

# ── Fail-closed on what clamd cannot fully inspect ──────────────────────────
ScanArchive yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertBrokenExecutables yes
HeuristicAlerts yes
