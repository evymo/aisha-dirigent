server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ──────────────────────────────────────
  # NOTE: nginx `add_header` does NOT inherit into a location{} that declares
  # its OWN add_header — the moment a location sets any add_header, ALL inherited
  # server-level add_headers are dropped for responses served from that location.
  # Therefore the full security-header set below MUST be repeated verbatim inside
  # every location{} that sets a Cache-Control (or any) add_header. Keep the five
  # locations (~ \.mjs$, ~ \.wasm$, /assets/, = /index.html, /) in sync with this
  # block. The Content-Security-Policy is tuned for the SPA:
  #   - default-src 'self'                       : lock everything down by default
  #   - connect-src 'self' https: wss:           : gateway XHR/fetch, WS /realtime, Sentry (scheme-scoped, no infra hostnames in repo)
  #   - img-src 'self' data: blob: https:        : imgproxy/remote images, inline data/blob previews
  #   - style-src 'self' 'unsafe-inline'         : Tailwind + GrapesJS inject inline styles
  #   - script-src 'self' 'wasm-unsafe-eval'     : pdfjs/GrapesJS wasm needs wasm eval
  #   - worker-src 'self' blob:                  : pdfjs / GrapesJS web workers
  #   - frame-src 'self' + frame-ancestors 'self': OIDC silent-renew iframe is SAME-ORIGIN (NOT 'none')
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

  # Explicit MIME type handling for Modern JS and WASM
  # Regex location matches take precedence over prefix /assets/
  location ~ \.mjs$ {
    types { } default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Repeat security headers — see the server-scope note above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri =404;
  }

  location ~ \.wasm$ {
    types { } default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Repeat security headers — see the server-scope note above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri =404;
  }

  # Hashed build assets are safe to cache aggressively.
  # This reduces repeat downloads for visitors/members.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Repeat security headers — see the server-scope note above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri =404;
  }

  # Do not cache HTML entrypoints (deploys should be picked up immediately).
  location = /index.html {
    add_header Cache-Control "no-store" always;
    # Repeat security headers — see the server-scope note above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri =404;
  }

  # Kořen řešíme zvlášť: pro `/` by se $uri složilo na `/_static//index.html`
  # a spoléhat na normalizaci dvojitého lomítka je zbytečná nejistota.
  location = / {
    # ⛔ add_header ve vnořeném bloku RODIČOVSKOU SADU NAHRAZUJE, nedoplňuje.
    # Bez zopakování by kořen webu přišel o CSP, X-Frame-Options a spol. —
    # tichá bezpečnostní regrese, kterou by nic nenahlásilo, protože stránka
    # by se dál servírovala správně.
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files /_static/index.html /index.html;
  }

  location / {
    add_header Cache-Control "no-store" always;
    # Repeat security headers — see the server-scope note above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # ⛔ STATICKÉ STRÁNKY MAJÍ PŘEDNOST PŘED SPA SKOŘÁPKOU.
    #
    # Bez tohohle pravidla dostane návštěvník prázdný `/index.html` a obsah
    # se dokresluje až po stažení celého balíku JS. `_static` plní generátor
    # (svc-web-render) z publikovaných stránek, takže PRVNÍ vykreslení je
    # hotový design.
    #
    # Pořadí je podstatné: nejdřív vygenerovaná stránka, pak skutečný soubor
    # (assety), teprve nakonec SPA fallback. Cesty, které generátor nezná
    # (administrace, extranet), tím pádem fungují beze změny.
    try_files /_static$uri/index.html /_static$uri $uri $uri/ /index.html;
  }
}
