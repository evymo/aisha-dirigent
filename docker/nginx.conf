# ── Předrender po síti (varianta d-ii) — http úroveň ────────────────────────
# Upstream web-renderu zapisuje start kontejneru (docker/web-start.sh) z derivace
# WEB_RENDER_UPSTREAM_MESH: `server <mesh jméno>:<port> resolve` + keepalive. `resolve`
# drží jméno živé — nginx naběhne, i když mesh jméno ještě neexistuje (fáze F), a
# předrender se rozjede sám, jakmile vznikne. Bez web-renderu soubor nese jen
# vypnutý upstream a stránky jdou rovnou na SPA.
include /etc/nginx/web-render-upstream.conf;

# Krátká cache předrenderu v Edge (stav umění: stale-while-revalidate/if-error).
# Cache žije v kontejneru webu, takže nový build (nová skořápka) začíná prázdný.
proxy_cache_path /var/cache/nginx/predrender levels=1:2 keys_zone=predrender:10m max_size=256m inactive=10m use_temp_path=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ──────────────────────────────────────
  # NOTE: nginx `add_header` does NOT inherit into a location{} that declares
  # its OWN add_header — the moment a location sets any add_header, ALL inherited
  # server-level add_headers are dropped for responses served from that location.
  # Therefore the full security-header set below MUST be repeated verbatim inside
  # every location{} that sets a Cache-Control (or any) add_header. Keep the
  # locations (~ \.mjs$, ~ \.wasm$, /assets/, = /index.html, /) in sync with this
  # block (plus `= /`, `@predrender`, `@spa`; `^~ /_img/` repeats the set with its
  # own STRICTER CSP). The Content-Security-Policy is tuned for the SPA:
  #   - default-src 'self'                       : lock everything down by default
  #   - connect-src 'self' https: wss:           : gateway XHR/fetch, WS /realtime, Sentry (scheme-scoped, no infra hostnames in repo)
  #   - img-src 'self' data: blob: https:        : imgproxy/remote images, inline data/blob previews
  #   - style-src 'self' 'unsafe-inline'         : Tailwind + GrapesJS inject inline styles
  #   - script-src 'self' 'wasm-unsafe-eval'     : pdfjs/GrapesJS wasm needs wasm eval
  #   - worker-src 'self' blob:                  : pdfjs / GrapesJS web workers
  #   - frame-src 'self' + frame-ancestors 'self': OIDC silent-renew iframe is SAME-ORIGIN (NOT 'none')
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

  gzip_vary on;

  # ── Předrender po síti (varianta d-ii, rozhodnutí majitele 2026-10-02) ──────
  # web a svc-web-render jsou DVĚ Coolify aplikace; disk sdílet neumějí (Coolify
  # holý `${VAR}` ve zdroji svazku převede na svazek KAŽDÉ aplikace zvlášť —
  # rozbor 2026-09-28), takže `_static` byl vždy prázdný. Stránky si proto
  # TÁHNEME přímo MESHEM (web má vlastní routu do rozsahu peerů, jako edge-proxy).
  #
  # ⛔ ŽÁDNÝ RELAY NA SDÍLENÉ SÍTI (nález nezávislé revize 2026-10-02): první tvar
  # šel přes posluchač edge-proxy :8091, jenže edge-proxy je i na síti `coolify`
  # s ostatními nájemníky hostitele — cizí kontejner tak měl neověřený vstup do
  # meshe a jméno `<prefix>-edge-proxy` šlo na sdílené síti přivlastnit (token
  # skořápky i podvržené HTML stránek). Mesh jméno řeší resolver vlastní mesh.
  #
  # Start kontejneru zapíše: `$web_render_zapnuto` (0/1), `$web_render_host`
  # (Host pro mesh-ingress, který rozlišuje jménem) a `$skorapka_otisk`
  # (otisk index.html tohoto buildu — web-render nevydá stránku z jiné skořápky).
  include /etc/nginx/web-render-cil.conf;

  # Explicit MIME type handling for Modern JS and WASM
  # Regex location matches take precedence over prefix /assets/
  location ~ \.mjs$ {
    types { } default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Repeat security headers — see the server-scope note above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri =404;
  }

  location ~ \.wasm$ {
    types { } default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Repeat security headers — see the server-scope note above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri =404;
  }

  # Hashed build assets are safe to cache aggressively.
  # This reduces repeat downloads for visitors/members.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Repeat security headers — see the server-scope note above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri =404;
  }

  # Do not cache HTML entrypoints (deploys should be picked up immediately).
  location = /index.html {
    add_header Cache-Control "no-store" always;
    # Repeat security headers — see the server-scope note above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri =404;
  }

  # Kořen jde rovnou na předrender (skutečný soubor `/` není — index.html je SPA).
  location = / {
    # ⛔ add_header ve vnořeném bloku RODIČOVSKOU SADU NAHRAZUJE, nedoplňuje.
    # Bez zopakování by kořen webu přišel o CSP, X-Frame-Options a spol. —
    # tichá bezpečnostní regrese, kterou by nic nenahlásilo, protože stránka
    # by se dál servírovala správně.
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files /__predrender__ @predrender;
  }

  location / {
    add_header Cache-Control "no-store" always;
    # Repeat security headers — see the server-scope note above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # ⛔ STATICKÉ STRÁNKY MAJÍ PŘEDNOST PŘED SPA SKOŘÁPKOU.
    #
    # Bez předrenderu dostane návštěvník prázdný `/index.html` a obsah se
    # dokresluje až po stažení celého balíku JS. Pořadí: skutečný soubor tohoto
    # buildu (ikony, manifest…) → předrenderovaná stránka z web-renderu → SPA.
    # Cesty, které generátor nezná (administrace, extranet), dostanou od
    # web-renderu 404 a skončí na SPA beze změny.
    try_files $uri @predrender;
  }

  # Předrenderovaná stránka z web-renderu, krátce cachovaná v Edge.
  #   · 200 se drží 30 s a pak se revaliduje podmíněným GETem (ETag → 304);
  #     během revalidace i při výpadku web-renderu jde STARÁ verze (stale), ne SPA.
  #   · 404 (neznámá cesta, SPA deep link) se drží 1 min — každá navigace v SPA
  #     by jinak stála hop přes mesh.
  #   · 412 = výstup z jiné skořápky, než má tenhle build → SPA a NECACHUJE se.
  #   · Každá jiná chyba = okamžitě SPA (návštěvník nesmí čekat ani vidět chybu).
  # Krátké timeouty: když web-render neběží a cache nic nemá, platí jen ten 1 s.
  location @predrender {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    if ($web_render_zapnuto = "0") { return 418; }
    if ($request_method !~ ^(GET|HEAD)$) { return 418; }
    proxy_pass http://web_render;
    proxy_set_header X-Skorapka-Otisk $skorapka_otisk;
    proxy_set_header Host $web_render_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 1s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    # Jediná autorita nad bezpečnostními hlavičkami je Edge: helmet web-renderu
    # by jinak přidal druhou (a konfliktní) sadu — XFO DENY proti SAMEORIGIN,
    # HSTS, COOP/CORP jen na předrenderu (nález revize 2026-10-02).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Origin-Agent-Cluster;
    proxy_hide_header X-DNS-Prefetch-Control;
    proxy_hide_header X-Download-Options;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header X-RateLimit-Limit;
    proxy_hide_header X-RateLimit-Remaining;
    proxy_hide_header X-RateLimit-Reset;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Vary;
    proxy_cache predrender;
    proxy_cache_key $request_uri;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 2s;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_cache_valid 200 30s;
    proxy_cache_valid 404 1m;
    proxy_intercept_errors on;
    error_page 400 403 404 405 412 413 414 418 429 431 500 502 503 504 = @spa;
  }

  location @spa {
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files /index.html =404;
  }

  # ⛔ OBRÁZKY Z PŘEDRENDERU NESMÍ BĚŽET POD CSP STRÁNKY (Sangha Studio 2026-10-02).
  # Generátor vytahuje inline `data:` obrázky VČETNĚ image/svg+xml do `/_img/`
  # na PŮVODU WEBU. Otevřené přímo by SVG s <script> běželo pod CSP aplikace —
  # proto vlastní přísná CSP se `sandbox` (žádný skript, formulář ani navigace;
  # v <img> se nic nemění). Chybějící obrázek = 404, NE SPA skořápka s 200.
  location ^~ /_img/ {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox" always;
    if ($web_render_zapnuto = "0") { return 404; }
    if ($request_method !~ ^(GET|HEAD)$) { return 404; }
    proxy_pass http://web_render;
    proxy_set_header Host $web_render_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 1s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    # Jediná autorita nad bezpečnostními hlavičkami je Edge: helmet web-renderu
    # by jinak přidal druhou (a konfliktní) sadu — XFO DENY proti SAMEORIGIN,
    # HSTS, COOP/CORP jen na předrenderu (nález revize 2026-10-02).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Origin-Agent-Cluster;
    proxy_hide_header X-DNS-Prefetch-Control;
    proxy_hide_header X-Download-Options;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header X-RateLimit-Limit;
    proxy_hide_header X-RateLimit-Remaining;
    proxy_hide_header X-RateLimit-Reset;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Vary;
    proxy_cache predrender;
    proxy_cache_key $request_uri;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 2s;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    # Jméno = sha256 obsahu → neměnné; Cache-Control (immutable) posílá web-render.
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 1m;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @obrazek_chybi;
  }

  # Nedostupný web-render u obrázku = 404 (ne skořápka, ne 502 ven).
  location @obrazek_chybi {
    return 404;
  }
}
