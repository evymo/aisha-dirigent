<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <rect width="480" height="320" rx="16" fill="#0E0E10"/>

  <!-- Connect illustration -->
  <g transform="translate(140, 30)">
    <!-- Server/Backend box -->
    <rect x="60" y="0" width="80" height="60" rx="8" fill="#16161A" stroke="#FF6A1A" stroke-width="1.5"/>
    <circle cx="80" cy="20" r="4" fill="#FBBE3C"/>
    <circle cx="96" cy="20" r="4" fill="#FBBE3C"/>
    <circle cx="112" cy="20" r="4" fill="#FF6A1A"/>
    <rect x="72" y="34" width="56" height="4" rx="2" fill="#26262B"/>
    <rect x="72" y="42" width="40" height="4" rx="2" fill="#26262B"/>

    <!-- Connection lines -->
    <path d="M100 60 L100 90" stroke="#FF6A1A" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
    <path d="M100 90 L40 130" stroke="#FF6A1A" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
    <path d="M100 90 L100 130" stroke="#FF6A1A" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
    <path d="M100 90 L160 130" stroke="#FF6A1A" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>

    <!-- Three mode cards -->
    <!-- Local -->
    <rect x="10" y="130" width="60" height="50" rx="6" fill="#16161A" stroke="#FBBE3C" stroke-width="1"/>
    <g transform="translate(40, 147)" stroke="#FBBE3C" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6.5 -0.5 L0 -6 L6.5 -0.5"/><path d="M-4.5 -1.5 V5.5 H4.5 V-1.5"/><path d="M-1.3 5.5 V2 H1.3 V5.5"/>
    </g>
    <text x="40" y="170" text-anchor="middle" fill="#9A9A9E" font-family="system-ui" font-size="9">Local</text>

    <!-- Self-hosted -->
    <rect x="70" y="130" width="60" height="50" rx="6" fill="#16161A" stroke="#E55A10" stroke-width="1"/>
    <g transform="translate(100, 147)" stroke="#E55A10" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-5" y="-6.5" width="10" height="13" rx="1"/>
      <path d="M-2.3 -3.8 h1.4 M0.9 -3.8 h1.4 M-2.3 -1 h1.4 M0.9 -1 h1.4 M-2.3 1.8 h1.4 M0.9 1.8 h1.4"/>
      <path d="M-1 6.5 V4 H1 V6.5"/>
    </g>
    <text x="100" y="170" text-anchor="middle" fill="#9A9A9E" font-family="system-ui" font-size="9">Self-hosted</text>

    <!-- Cloud -->
    <rect x="130" y="130" width="60" height="50" rx="6" fill="#16161A" stroke="#FF6A1A" stroke-width="1"/>
    <g transform="translate(148, 135)" stroke="#FF6A1A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 18.5a4.5 4.5 0 1 1 .9-8.91A6 6 0 0 1 19.4 11.5a3.5 3.5 0 0 1-.9 7H7z"/>
    </g>
    <text x="160" y="170" text-anchor="middle" fill="#9A9A9E" font-family="system-ui" font-size="9">Cloud</text>
  </g>

  <!-- Title -->
  <text x="240" y="260" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="600">
    Připojte backend
  </text>
  <text x="240" y="284" text-anchor="middle" fill="#9A9A9E" font-family="system-ui, sans-serif" font-size="12">
    Lokální, firemní nebo cloudový — vy rozhodujete kde běží vaše data
  </text>
</svg>
