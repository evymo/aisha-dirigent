# Phase 12 WP 0.2 — Grafana dashboard provisioner.
# Loads JSON dashboards from /var/lib/grafana/dashboards (mounted volume).

apiVersion: 1

providers:
  - name: aisha-default
    orgId: 1
    folder: AISHA
    folderUid: aisha
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
