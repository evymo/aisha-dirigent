# Prose lives in docs/compose-notes/docker-compose.coolify-matrix.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
x-common: &common
  restart: unless-stopped
  networks:
    - internal
    - mesh-dns

x-bridge-common: &bridge-common
  <<: *common
  restart: unless-stopped
  depends_on:
    matrix-config-init:
      condition: service_completed_successfully
    synapse:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "kill -0 1 || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  matrix-config-init:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache gettext
        COPY coolify/synapse /src
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-matrix-config-init
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /synapse /synapse-media /tg /wa /sg /dc /sl /mt /em /registrations
        # Fix volume ownership for synapse (runs as UID/GID 991)
        chown -R 991:991 /synapse /synapse-media /registrations 2>/dev/null || true
        # Ensure log.config is a FILE not a directory (stale volume trap)
        rm -rf /synapse/log.config
        # Ensure homeserver.yaml and aisha-appservice.yaml are files, not dirs
        rm -rf /synapse/homeserver.yaml /synapse/appservices/aisha-appservice.yaml
        # Remove stale pidfile from previous runs (Synapse refuses to start if it exists)
        rm -f /synapse/homeserver.pid
        # Remove stale signing keys with old hostnames (synapse generates a new one
        # for the current SYNAPSE_SERVER_NAME if missing)
        find /synapse -maxdepth 1 -name "*.signing.key" -not -name "$$SYNAPSE_SERVER_NAME.signing.key" -delete 2>/dev/null || true
        # ALSO remove a zero-byte signing key for the current SYNAPSE_SERVER_NAME
        # (left over from a previous failed deploy where synapse never finished
        # generating). Synapse refuses to start with an empty signing key.
        # 2026-05-23: caught during cold-start when synapse logs reported
        # "No signing keys in file /data/<server>.signing.key".
        if [ -e "/synapse/$$SYNAPSE_SERVER_NAME.signing.key" ] && [ ! -s "/synapse/$$SYNAPSE_SERVER_NAME.signing.key" ]; then
          echo "matrix-config-init: removing empty signing key (synapse will regenerate via start.py)"
          rm -f "/synapse/$$SYNAPSE_SERVER_NAME.signing.key"
        fi
        # Generate the signing key inline if missing — start.py only auto-generates
        # when homeserver.yaml is missing, which it's not (we just wrote it).
        # ed25519 raw 32-byte key encoded base64 (no padding), preceded by
        # "ed25519 <ALIAS>". This matches synapse's generate_signing_key format.
        if [ ! -s "/synapse/$$SYNAPSE_SERVER_NAME.signing.key" ]; then
          ALIAS="a_$$(head -c 4 /dev/urandom | hexdump -e '/1 "%02x"')"
          KEYDATA="$$(head -c 32 /dev/urandom | base64 | tr -d '=' | tr '+/' '-_')"
          echo "ed25519 $$ALIAS $$KEYDATA" > "/synapse/$$SYNAPSE_SERVER_NAME.signing.key"
          chown 991:991 "/synapse/$$SYNAPSE_SERVER_NAME.signing.key" 2>/dev/null || true
          chmod 0644 "/synapse/$$SYNAPSE_SERVER_NAME.signing.key"
          echo "matrix-config-init: generated synapse signing key (alias=$$ALIAS)"
        fi
        mkdir -p /synapse/appservices
        envsubst < /src/homeserver.yaml > /synapse/homeserver.yaml || cp /src/homeserver.yaml /synapse/homeserver.yaml
        cp        /src/log.config                /synapse/log.config
        envsubst < /src/aisha-appservice.yaml > /synapse/appservices/aisha-appservice.yaml || cp /src/aisha-appservice.yaml /synapse/appservices/aisha-appservice.yaml
        chown -R 991:991 /synapse/appservices 2>/dev/null || true
        envsubst < /src/bridges/mautrix-telegram.yaml > /tg/config.yaml || cp /src/bridges/mautrix-telegram.yaml /tg/config.yaml
        envsubst < /src/bridges/mautrix-whatsapp.yaml > /wa/config.yaml || cp /src/bridges/mautrix-whatsapp.yaml /wa/config.yaml
        envsubst < /src/bridges/mautrix-signal.yaml > /sg/config.yaml || cp /src/bridges/mautrix-signal.yaml /sg/config.yaml
        envsubst < /src/bridges/mautrix-discord.yaml > /dc/config.yaml || cp /src/bridges/mautrix-discord.yaml /dc/config.yaml
        envsubst < /src/bridges/mautrix-slack.yaml > /sl/config.yaml || cp /src/bridges/mautrix-slack.yaml /sl/config.yaml
        envsubst < /src/bridges/mautrix-meta.yaml > /mt/config.yaml || cp /src/bridges/mautrix-meta.yaml /mt/config.yaml
        envsubst < /src/bridges/postmoogle.yaml > /em/config.yaml || cp /src/bridges/postmoogle.yaml /em/config.yaml
        
        # Pre-generate appservice registration files so Synapse can start successfully
        # AND copy them to the individual bridge data directories to prevent them from auto-generating new ones with wrong tokens!
        for b_id in telegram whatsapp signal discord slack meta; do
          if [ "$$b_id" = "telegram" ];  then tg_dir="/tg"; fi
          if [ "$$b_id" = "whatsapp" ];  then tg_dir="/wa"; fi
          if [ "$$b_id" = "signal" ];    then tg_dir="/sg"; fi
          if [ "$$b_id" = "discord" ];   then tg_dir="/dc"; fi
          if [ "$$b_id" = "slack" ];     then tg_dir="/sl"; fi
          if [ "$$b_id" = "meta" ];      then tg_dir="/mt"; fi
          envsubst < "/src/bridges/registrations/mautrix-$$b_id-registration.yaml" > "/registrations/mautrix-$$b_id-registration.yaml"
          cp "/registrations/mautrix-$$b_id-registration.yaml" "$$tg_dir/registration.yaml"
        done
        envsubst < /src/bridges/registrations/postmoogle-registration.yaml > /registrations/postmoogle-registration.yaml
        cp /registrations/postmoogle-registration.yaml /em/registration.yaml

        echo "matrix configs staged with env substitution"
    environment:
      # ⛔ envsubst v config-init dosazuje jména do bridge configů; bez téhle
      # proměnné by z `${APP_NAME_PREFIX}-db` vzniklo `-db` a mosty by mlčky
      # cílily na neexistujícího hostitele. `:?` tu být NEMŮŽE (envsubst ho
      # nezná), takže hodnotu vynucuje compose už tady.
      - APP_NAME_PREFIX=${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}
      - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME}
      - SYNAPSE_DB_PASSWORD=${SYNAPSE_DB_PASSWORD:?SYNAPSE_DB_PASSWORD is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      - SYNAPSE_REGISTRATION_SECRET=${SYNAPSE_REGISTRATION_SECRET:?SYNAPSE_REGISTRATION_SECRET is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      - SYNAPSE_MACAROON_SECRET=${SYNAPSE_MACAROON_SECRET:?SYNAPSE_MACAROON_SECRET is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      - SYNAPSE_FORM_SECRET=${SYNAPSE_FORM_SECRET:?SYNAPSE_FORM_SECRET is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      - SYNAPSE_OIDC_CLIENT_SECRET=${SYNAPSE_OIDC_CLIENT_SECRET:?SYNAPSE_OIDC_CLIENT_SECRET is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      - KEYCLOAK_DOMAIN=${KEYCLOAK_DOMAIN}
      - KEYCLOAK_DOMAIN_PUBLIC=${KEYCLOAK_DOMAIN_PUBLIC}
      - MATRIX_WEBHOOK_URL=${MATRIX_WEBHOOK_URL}
      - AISHA_AS_TOKEN=${AISHA_AS_TOKEN:-}
      - AISHA_HS_TOKEN=${AISHA_HS_TOKEN:-}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - synapse-data:/synapse
      - synapse-media:/synapse-media
      - bridge-telegram:/tg
      - bridge-whatsapp:/wa
      - bridge-signal:/sg
      - bridge-discord:/dc
      - bridge-slack:/sl
      - bridge-meta:/mt
      - bridge-email:/em
      - bridge-registrations:/registrations
    healthcheck:
      disable: true
    networks:
      - internal

  synapse-db-init:
    image: ${REGISTRY_PROXY}library/postgres:17-alpine
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-synapse-db-init
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD:?SYNAPSE_DB_PASSWORD is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
    volumes:
      - synapse-data:/data
    command:
      - sh
      - -c
      - |
        set -e
        # Pojistka u spotřeby — proč tady a ne v compose: docs/compose-notes/.
        [ -n "$${SYNAPSE_DB_PASSWORD}" ] || { echo "FATAL: SYNAPSE_DB_PASSWORD je prazdne — ucet by vznikl bez pouzitelneho hesla." >&2; exit 1; }
        # Tee diagnostics into a file element-web nginx exposes for debugging:
        # https://<ELEMENT_DOMAIN>/_synapse/db-init.log
        DBLOG=/data/db-init.log
        : > "$$DBLOG"
        log() { echo "$$@" | tee -a "$$DBLOG"; }
        log "[synapse-db-init] $$(date) starting"
        # Wait for aisha-db — cross-stack dependency (core stack) that may be mid-restart
        # during cold-start (entrypoint-wrapper.sh re-applies role passwords ~60s after boot;
        # the wave-4 core gate is SOFT). Bounded so a genuinely-dead DB fails loudly instead
        # of hanging the wave. Same resilient wait pattern as n8n-config-init.
        i=0; until pg_isready -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -q 2>/dev/null; do
          i=$$((i+1)); [ "$$i" -ge 150 ] && { log "[synapse-db-init] ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db not ready after 300s — aborting"; exit 1; }
          log "[synapse-db-init] waiting for ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db ($$i)"; sleep 2
        done
        # Use aisha_admin (SUPERUSER) — its password is re-applied on every aisha-db boot
        # via entrypoint-wrapper.sh, unlike the postgres superuser which is only set on first init.

        # Create synapse_user (idempotent; pg17 creates it but belt+suspenders)
        psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -tc \
          "SELECT 1 FROM pg_roles WHERE rolname='synapse_user'" | grep -q 1 || \
          psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -c \
          "CREATE USER synapse_user WITH PASSWORD '$${SYNAPSE_DB_PASSWORD}';"

        # Create synapse database (Matrix requires LC_COLLATE='C' + template0)
        psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -tc \
          "SELECT 1 FROM pg_database WHERE datname='synapse'" | grep -q 1 || \
          psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -c \
          "CREATE DATABASE synapse OWNER synapse_user ENCODING 'UTF8' LC_COLLATE='C' LC_CTYPE='C' TEMPLATE template0;"

        # Schema isolation: synapse runs in its own schema synapse_hs (set as
        # default search_path on the database). This contains historical
        # DuplicateTable failure modes — synapse never sees other apps' tables
        # in the public schema.
        psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -c \
          "GRANT ALL PRIVILEGES ON DATABASE synapse TO synapse_user;" 2>&1 | tee -a "$$DBLOG"
        psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d synapse -c \
          "CREATE SCHEMA IF NOT EXISTS synapse_hs AUTHORIZATION synapse_user; GRANT USAGE, CREATE ON SCHEMA synapse_hs TO synapse_user; ALTER DATABASE synapse SET search_path TO synapse_hs;" 2>&1 | tee -a "$$DBLOG"

        # Bridge databases — each gets its own dedicated DB AND its own isolated
        # schema bridge_hs (same pattern as synapse) for defensive consistency.
        for bridge_db in \
          synapse_bridge_telegram \
          synapse_bridge_whatsapp \
          synapse_bridge_signal \
          synapse_bridge_discord \
          synapse_bridge_slack \
          synapse_bridge_meta \
          synapse_bridge_email; do
          if psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -tc \
            "SELECT 1 FROM pg_database WHERE datname='$$bridge_db'" | grep -q 1; then
            log "[synapse-db-init] bridge database $$bridge_db exists"
          else
            log "[synapse-db-init] creating bridge database $$bridge_db"
            psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -c \
              "CREATE DATABASE $$bridge_db OWNER synapse_user ENCODING 'UTF8' LC_COLLATE='C' LC_CTYPE='C' TEMPLATE template0;" 2>&1 | tee -a "$$DBLOG"
          fi
          psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -c \
            "GRANT ALL PRIVILEGES ON DATABASE $$bridge_db TO synapse_user;" 2>&1 | tee -a "$$DBLOG"
          psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d "$$bridge_db" -c \
            "CREATE SCHEMA IF NOT EXISTS bridge_hs AUTHORIZATION synapse_user; GRANT USAGE, CREATE ON SCHEMA bridge_hs TO synapse_user; ALTER DATABASE $$bridge_db SET search_path TO bridge_hs;" 2>&1 | tee -a "$$DBLOG"
        done

        log "[synapse-db-init] synapse_user + synapse/bridge databases ready"
    healthcheck:
      disable: true
    networks:
      - internal

  synapse:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *common
    image: ${IMAGE_SYNAPSE}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-synapse
    depends_on:
      matrix-config-init:
        condition: service_completed_successfully
      synapse-db-init:
        condition: service_completed_successfully
    volumes:
      - synapse-data:/data
      - synapse-media:/data/media_store
      - bridge-registrations:/data/bridge-registrations
    environment:
      - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME}
      - SYNAPSE_DB_PASSWORD=${SYNAPSE_DB_PASSWORD:?SYNAPSE_DB_PASSWORD is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      - SYNAPSE_REGISTRATION_SECRET=${SYNAPSE_REGISTRATION_SECRET}
      - SYNAPSE_REPORT_STATS=no
      - UID=991
      - GID=991
    expose:
      - "8008"
    networks:
      coolify:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-synapse
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-synapse
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-synapse
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

  element-web:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *common
    build:
      context: .
      dockerfile_inline: |
        # Pinned to v1.12.21 (== docker.io :latest @ sha256:26546ef2…04d12 as of
        # 2026-06-11, digest-verified). Raw :latest is the silent-drift class that
        # broke element-call (non-root base swap); the no-latest-images gate now
        # rejects unpinned FROM refs in dockerfile_inline blocks too.
        FROM vectorim/element-web:v1.12.21
        COPY coolify/synapse/element-config.json /app/config.json.tpl
        # v1.12.21 base runs as uid 101 (nginx) even during build RUN steps —
        # writing into root-owned /docker-entrypoint.d needs a root window.
        # Runtime user is restored right after (envsubst hook itself runs fine
        # as nginx: the entrypoint executes it and /app/config.json is
        # nginx-writable — validated 2026-06-12 on the pinned digest).
        USER root
        RUN mkdir -p /docker-entrypoint.d && \
            printf '#!/bin/sh\nenvsubst < /app/config.json.tpl > /app/config.json\n' \
              > /docker-entrypoint.d/10-aisha-envsubst.sh && \
            chmod +x /docker-entrypoint.d/10-aisha-envsubst.sh && \
            touch /app/config.json && chown 101:101 /app/config.json
        USER nginx
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-element-web
    depends_on:
      synapse:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - synapse-data:/usr/share/nginx/html/_synapse:ro
    networks:
      - internal
      - coolify
      - mesh-dns
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  element-call:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *common
    build:
      context: .
      dockerfile_inline: |
        # Pinned to v0.20.1 (== ghcr :latest @ sha256:c37996d0…186d as of 2026-06-08).
        # :latest silently drifted the base to nginxinc/nginx-unprivileged (USER 101),
        # which broke the build below; pin for reproducibility — no more silent drift.
        FROM ghcr.io/element-hq/element-call:v0.20.1
        # element-call runs as the non-root nginx user (UID 101), so BOTH the
        # build-time writes into root-owned /docker-entrypoint.d AND the start-time
        # render of /app/config.json need root. Escalate for the build, chown the
        # web root so the entrypoint (UID 101) can render config.json, drop back.
        # (element-web's base runs as root, so it needs none of this.)
        USER root
        COPY coolify/synapse/element-call-config.json /app/config.json.tpl
        RUN mkdir -p /docker-entrypoint.d && \
            printf '#!/bin/sh\nenvsubst < /app/config.json.tpl > /app/config.json\n' \
              > /docker-entrypoint.d/10-aisha-envsubst.sh && \
            chmod +x /docker-entrypoint.d/10-aisha-envsubst.sh && \
            chown -R 101:101 /app
        USER 101
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-element-call
    depends_on:
      synapse:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - internal
      - coolify
      - mesh-dns
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3

  matrix-rtc-auth:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.matrix-rtc-auth
      args:
        MATRIX_RTC_AUTH_BASE_IMAGE: ${IMAGE_LK_JWT_SERVICE:-ghcr.io/element-hq/lk-jwt-service:0.2.1}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-matrix-rtc-auth
    environment:
      - LIVEKIT_URL=wss://${LIVEKIT_DOMAIN}
      - LIVEKIT_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_SECRET=${LIVEKIT_API_SECRET}
      - LK_JWT_PORT=8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/bin/busybox", "nc", "-z", "127.0.0.1", "8080"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  svc-matrix:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *common
    build:
      context: .
      dockerfile: services/svc-matrix/Dockerfile
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-matrix
    extra_hosts:
      - "${KEYCLOAK_DOMAIN_PUBLIC}:host-gateway"
      - "${KEYCLOAK_EXTRA_HOST_ALIAS:?vydává derive-domains; bez něj by extra_hosts nesl duplicitu nebo prázdné jméno}:host-gateway"
    depends_on:
      synapse:
        condition: service_healthy
    environment:
      CORS_ALLOWLIST: ${CORS_ALLOWLIST:-}
      SVC_MATRIX_PORT: "3026"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGREST_URL: http://${APP_NAME_PREFIX:?identita instance — jméno na sdílené síti ji MUSÍ nést}-postgrest:3000
      POSTGREST_SERVICE_TOKEN: ${POSTGREST_SERVICE_TOKEN:?POSTGREST_SERVICE_TOKEN is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      KEYCLOAK_URL: ${KEYCLOAK_INTERNAL_URL:?KEYCLOAK_INTERNAL_URL must be generated by topology resolver}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?realm je DEKLAROVANÁ konstanta (keycloak/*-realm.json), ne literál ve stack kódu — doručuje cold-start env}
      KEYCLOAK_ISSUER: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}
      KC_ISSUER: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}
      SYNAPSE_ADMIN_URL: http://${APP_NAME_PREFIX:?identita instance}-synapse:8008
      SYNAPSE_REGISTRATION_SECRET: ${SYNAPSE_REGISTRATION_SECRET}
      MATRIX_DOMAIN: ${MATRIX_DOMAIN}
      MATRIX_WEBHOOK_SECRET: ${MATRIX_WEBHOOK_SECRET:-}
      N8N_MATRIX_WEBHOOK_URL: ${N8N_MATRIX_WEBHOOK_URL:-}
    expose:
      - "3026"
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-matrix
          - ${APP_NAME_PREFIX:?required — identita ZÁKAZNÍKA (ne implementace stacku); bez ní by alias na sdílené síti kolidoval s jinou instancí}-svc-matrix
      mesh-dns: {}
    labels:
      - "coolify.managed=true"
      - "traefik.enable=false"
      - "traefik.docker.network=coolify"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3026/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  mautrix-telegram:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
