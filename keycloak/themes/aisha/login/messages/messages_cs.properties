# Přihlašovací stránka — čeština. VÝCHOZÍ (platformní) texty.
#
# Instanční overlay tenhle soubor PŘEPÍŠE celý (message bundly se nahrazují
# souborově, ne po klíčích) — proto tu musí být VŠECHNY klíče, které šablona
# používá, včetně převzatých passkey hlášek.
#
# „AISHA" je tu název produktu, ne značka zákazníka: generický build nesmí
# nést jméno žádné instance, ale ani zůstat prázdný.

# — karta —
loginTitle=Přihlášení — {0}
loginAccountTitle=Přihlášení
doLogIn=Přihlásit se
loginPanelEyebrow=AISHA · Přihlášení
loginAssurance=Chráněno OIDC + MFA
loginLegal=Přístup k datům je řízen rolemi a Row-Level Security. Každý dotaz i odpověď jsou auditované.

# — uvítací sloupec —
loginWordmark=AISHA
loginWordmarkSuffix=ID
loginHeroKicker=Firemní AI server · pod vaší střechou
# Nadpis je POZVÁNKA, ne slogan. Dřív tu stálo „Jedno místo pro řízení celého
# provozu." a instance to přebíjela na „Řiďte skupinu z jednoho místa." — obojí
# mluví za zákazníka, kterého generický build nezná, a slibuje pozici, kterou
# přihlašovací stránka nemá čím doložit. Tohle je jediná věta, která popisuje,
# co člověk za přihlášením SKUTEČNĚ udělá.
#
# Klíč je záměrně stejný i v instančním overlayi: je to text o produktu,
# ne hodnota instance. Kdo ho bude chtít „vylepšit" na slogan, ať si přečte
# tenhle odstavec první.
loginHeroTitle=Zeptejte se, na co chcete.
# Druhá věta dřív začínala „Ptejte se přirozeným jazykem" — po změně nadpisu
# to byl týž imperativ dvakrát pod sebou. Informace zůstala, koktání ne.
loginHeroLead=AISHA propojí provozy, smlouvy, fakturaci i dokumenty do jednoho řízeného prostředí. Odpověď dostanete přirozeným jazykem — vždy s důkazem zdroje.

# Adresa monitoringu pro kontrolky stavu (gateway /api/health). PRÁZDNÁ =
# generický build nikam nevolá. Instance sem dá svou; navíc musí mít doménu
# přihlašovací stránky v ALLOWED_ORIGINS gateway, jinak prohlížeč odpověď
# zahodí a kontrolky zůstanou neutrální.
loginStatusEndpoint=

# — passkey —
webauthn-passwordless-login-title=Přihlásit se passkey
webauthn-doAuthenticate=Použít passkey
webauthn-unsupported-browser-text=Váš prohlížeč nepodporuje passkey. Přihlašte se heslem.
webauthn-error-title=Chyba passkey
webauthn-error-api-get=Ověření passkey selhalo.
webauthn-error-user-not-found=Neznámý uživatel.
# Agregovaný příznak provozu. ZÁMĚRNĚ bez jmen subsystémů: stránku vidí
# i nepřihlášený a ten nepotřebuje vědět, z čeho je systém složený.
# Dřív tu byly loginStackSso/Data/Storage a instance je přepsala na
# produktová jména — expozice, kterou agregace ruší v mechanismu.
loginStatusUnknown=Stav provozu se zjišťuje
loginStatusOk=Všechny systémy v provozu
loginStatusDegraded=Provoz je omezen
