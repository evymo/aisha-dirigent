# =============================================================================
# Claude app release — build + publish aisha-dirigent.mcpb
# =============================================================================
# Builds the AISHA Dirigent Claude Desktop Extension (.mcpb) and attaches it to
# the GitHub release for the tag (created when missing). The Claude app + packager are ZERO runtime
# dependencies (Node stdlib only), so no `npm ci` is needed — the release stays
# fast and reproducible.
#
# Release the Claude app independently of the monorepo version by pushing a tag
# with the `claude-app-v` prefix, e.g.:
#     git tag claude-app-v0.6.1 && git push --tags
# (The app's own version is inherited from the VS Code Dirigent extension; see
#  scripts/ide-adapters/adapter-claude-app.mjs::appVersion.)
#
# The full drift gate + composition tests run in the main CI (ci.yml Web:Tests
# lane → `npm run test:scripts`) whenever src/, scripts/, or the claude-app
# change. This workflow additionally gates the release on the zero-dep node:test
# suite.
# =============================================================================

name: Claude App Release

on:
  push:
    tags:
      - "claude-app-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + validate only; do not attach to a release"
        required: false
        type: boolean
        default: false

# contents: write = create the release and upload its assets; nothing else.
permissions:
  contents: write

concurrency:
  group: claude-app-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build + publish aisha-dirigent.mcpb
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test (claude-app, zero-dep node:test)
        run: npm run test:claude-app

      - name: Build .mcpb (regenerate + validate + pack)
        run: node scripts/package-claude-app.mjs

      - name: Checksum
        run: |
          cd dist/claude-app
          sha256sum aisha-dirigent.mcpb > aisha-dirigent.mcpb.sha256
          cat aisha-dirigent.mcpb.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aisha-dirigent-mcpb
          path: |
            dist/claude-app/aisha-dirigent.mcpb
            dist/claude-app/aisha-dirigent.mcpb.sha256
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Best-effort: attach the .mcpb to the release for this tag (gh CLI,
          # preinstalled on GitHub-hosted runners). Creates the release if it
          # doesn't exist yet. Soft-fails so a token/scope gap never fails the
          # build — the artifact is already uploaded above. (No heredocs: a
          # column-0 terminator inside a YAML `run: |` block ends the literal
          # early — see aisha-packages-publish.yml.)
          if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release create "$REF_NAME" --verify-tag --title "$REF_NAME" \
              --notes "AISHA Dirigent Claude app ${REF_NAME}" \
              || { echo "could not create release ${REF_NAME} (non-fatal); artifact still uploaded"; exit 0; }
          fi
          gh release upload "$REF_NAME" --clobber \
            dist/claude-app/aisha-dirigent.mcpb dist/claude-app/aisha-dirigent.mcpb.sha256 \
            && echo "attached aisha-dirigent.mcpb (+ .sha256) to ${REF_NAME}" \
            || echo "attach to ${REF_NAME} failed (non-fatal); artifact still uploaded"
