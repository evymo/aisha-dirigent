# Prose lives in docs/compose-notes/docker-compose.coolify-keycloak.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
x-common: &common
  restart: unless-stopped
  networks:
    - internal

services:
  keycloak:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.keycloak
      args: &kc-theme-overlay-args
        KC_THEME_OVERLAY_GIT_URL: ${KC_THEME_OVERLAY_GIT_URL:-}
        KC_THEME_OVERLAY_REF: ${KC_THEME_OVERLAY_REF:-}
        KC_THEME_OVERLAY_PATH: ${KC_THEME_OVERLAY_PATH:-keycloak/themes}
        KC_THEME_OVERLAY_CACHEBUST: ${KC_THEME_OVERLAY_CACHEBUST:-}
      secrets: &kc-build-secrets
        - forgejo_token
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-keycloak
    command: ["start", "--import-realm", "--optimized"]
    cpus: ${KEYCLOAK_CPUS:-1.0}
    mem_limit: ${KEYCLOAK_MEM:-2g}
    environment:
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_JAVA_HEAP:--Xms256m -Xmx512m}
      KC_CACHE: local
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?Set PLATFORM_ADMIN_PASSWORD in Coolify env (generated by cold-start)}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:?generuje generate-secrets — prázdné znamená, že selhal push env do Coolify, ne že si to operátor nepřeje; realm by klientovi nastavil prázdné heslo}
      COMPANION_DOMAIN: ${COMPANION_DOMAIN:-}
      KEYCLOAK_DOMAIN_PUBLIC: ${KEYCLOAK_DOMAIN_PUBLIC:-}
      AISHA_PKI_ISSUER_CLIENT_SECRET: ${AISHA_PKI_ISSUER_CLIENT_SECRET:?generuje generate-secrets — prázdné znamená selhaný push env; pki-renewer drží tutéž hodnotu a nepřihlásil by se}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?deklaruje instance — prázdné by naimportovalo realm bez jména a všech 110 konzumentů by hledalo jinde}
      APPSMITH_OIDC_SECRET: ${APPSMITH_OIDC_SECRET}
      APPSMITH_INTRANET_OIDC_SECRET: ${APPSMITH_INTRANET_OIDC_SECRET}
      NOCODB_OIDC_SECRET: ${NOCODB_OIDC_SECRET}
      LANGFUSE_OIDC_SECRET: ${LANGFUSE_OIDC_SECRET}
      STUDIO_OIDC_SECRET: ${STUDIO_OIDC_SECRET}
      EXTRANET_OIDC_SECRET: ${EXTRANET_OIDC_SECRET}
      N8N_OIDC_SECRET: ${N8N_OIDC_SECRET}
      OPENCLAW_OIDC_SECRET: ${OPENCLAW_OIDC_SECRET}
      NETBIRD_MGMT_SECRET: ${NETBIRD_MGMT_SECRET}
      # Bootstrap dvojice — realm si předgenerovaný secret PŘEVEZME při importu
      # (výklad v docs/compose-notes/docker-compose.coolify-keycloak.yml.md).
      AISHA_BOOTSTRAP_CLIENT_SECRET: ${AISHA_BOOTSTRAP_CLIENT_SECRET}
      AISHA_PKI_BOOTSTRAP_CLIENT_SECRET: ${AISHA_PKI_BOOTSTRAP_CLIENT_SECRET}
      # Hesla servisních účtů — ROPC (`netbird-peer-discover`) potřebuje OBOJE:
      # secret klienta i heslo uživatele (výklad v compose-notes).
      AISHA_BOOTSTRAP_PASSWORD: ${AISHA_BOOTSTRAP_PASSWORD}
      AISHA_PKI_BOOTSTRAP_PASSWORD: ${AISHA_PKI_BOOTSTRAP_PASSWORD}
      OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID:-}
      OAUTH_APPLE_CLIENT_SECRET: ${OAUTH_APPLE_CLIENT_SECRET:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_AUTH_KEY_B64: ${APPLE_AUTH_KEY_B64:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      PUBLIC_TLD: ${PUBLIC_TLD:-}
      KC_REGISTRATION_ALLOWED: ${KC_REGISTRATION_ALLOWED:-true}
      APP_DOMAIN: ${APP_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      API_DOMAIN_PUBLIC: ${API_DOMAIN_PUBLIC:-}
      AUTH_DOMAIN_PUBLIC: ${AUTH_DOMAIN_PUBLIC:-}
      MCP_DOMAIN: ${MCP_DOMAIN:-}
      DIRIGENT_DOMAIN: ${DIRIGENT_DOMAIN:-}
      APPSMITH_DOMAIN: ${APPSMITH_DOMAIN:-}
      NOCODB_DOMAIN: ${NOCODB_DOMAIN:-}
      LANGFUSE_DOMAIN: ${LANGFUSE_DOMAIN:-}
      STUDIO_DOMAIN_DIRECT: ${STUDIO_DOMAIN_DIRECT:-}
      EXTRANET_DOMAIN_PUBLIC: ${EXTRANET_DOMAIN_PUBLIC:-}
      N8N_DOMAIN: ${N8N_DOMAIN:-}
      PKI_DOMAIN: ${PKI_DOMAIN:-}
      INTRANET_DOMAIN: ${INTRANET_DOMAIN:-}
      NETBIRD_DOMAIN: ${NETBIRD_DOMAIN:-}
      INTERNAL_TLD: ${INTERNAL_TLD:-}
      KC_DB: postgres
      KC_DB_URL_HOST: ${APP_NAME_PREFIX:?identita instance — jméno na sdílené síti ji MUSÍ nést}-db
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: postgres
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: https://${KEYCLOAK_DOMAIN_PUBLIC:?vydává derive-domains; prázdno = selhal push env — bez hostname by KC stavěl redirecty z vnitřního aliasu}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "80"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LEGACY_OBSERVABILITY_INTERFACE: "true"
      KC_SPI_THEME_STATIC_MAX_AGE: "300"
      BG_SLOT: ${BG_SLOT:-blue}
      BG_ACTIVE_HOST: ${BG_ACTIVE_HOST:-}
    expose:
      - "80"
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-keycloak
      coolify:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-keycloak
          - ${APP_NAME_PREFIX:?required — identita ZÁKAZNÍKA (ne implementace stacku); bez ní by alias na sdílené síti kolidoval s jinou instancí}-keycloak
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q 'UP' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

# Zdroj `environment:` čte proměnnou z prostředí projektu, tedy i z `.env`, který
# Coolify pro build zapisuje — ověřeno měřením 2026-08-15 i s proměnnou úmyslně
# odstraněnou z procesního prostředí. Proměnná NESMÍ být v Coolify build-time:
# `.env` ji dostane tak jako tak (compose interpolace bere všechny), zatímco
# `--build-arg` už jen build-time sadu.
  # realm-sync — deklarace klientů KONVERGUJE, ne jen vzniká (`--import-realm`
  # bere jen prázdný realm). Výklad: docs/compose-notes/docker-compose.coolify-keycloak.yml.md
  realm-sync:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
      args: *kc-theme-overlay-args
      secrets: *kc-build-secrets
    container_name: ${APP_NAME_PREFIX:?identita instance}-keycloak--realm-sync
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/opt/keycloak/reconcile-realm-clients.sh"]
    # Jednorázový init kontejner: healthcheck se VYPÍNÁ, jinak Coolify hlásí
    # `running:unhealthy` u něčeho, co má správně doběhnout a skončit.
    healthcheck:
      disable: true
    environment:
      # ⛔ ADRESA Z RESOLVERU, NE HOLÉ JMÉNO — `internal` i `coolify` jsou sdílené
      # sítě (brána jmeno-na-sdilene-siti-nese-identitu); výklad v compose-notes.
      KC_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:?vydává derive-domains; bez něj by smír mířil na holé jméno na sdílené síti}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?deklaruje instance}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?deklaruje cold-start do .env.coolify; smír musí vidět TÝŽ účet jako keycloak}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?bez něj se kcadm nepřihlásí}
      # Tytéž hodnoty, které dostává keycloak — smír porovnává deklaraci
      # se skutečností, takže musí vidět OBĚ strany.
      # Pověření IdP i sem: smír je jediné místo, kterým projde každý start — viz compose notes.
      OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID:-}
      OAUTH_APPLE_CLIENT_SECRET: ${OAUTH_APPLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      APPSMITH_OIDC_SECRET: ${APPSMITH_OIDC_SECRET}
      APPSMITH_INTRANET_OIDC_SECRET: ${APPSMITH_INTRANET_OIDC_SECRET}
      NOCODB_OIDC_SECRET: ${NOCODB_OIDC_SECRET}
      LANGFUSE_OIDC_SECRET: ${LANGFUSE_OIDC_SECRET}
      STUDIO_OIDC_SECRET: ${STUDIO_OIDC_SECRET}
      EXTRANET_OIDC_SECRET: ${EXTRANET_OIDC_SECRET}
      N8N_OIDC_SECRET: ${N8N_OIDC_SECRET}
      OPENCLAW_OIDC_SECRET: ${OPENCLAW_OIDC_SECRET}
      NETBIRD_MGMT_SECRET: ${NETBIRD_MGMT_SECRET}
      AISHA_PKI_ISSUER_CLIENT_SECRET: ${AISHA_PKI_ISSUER_CLIENT_SECRET}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET}
      AISHA_BOOTSTRAP_CLIENT_SECRET: ${AISHA_BOOTSTRAP_CLIENT_SECRET}
      AISHA_PKI_BOOTSTRAP_CLIENT_SECRET: ${AISHA_PKI_BOOTSTRAP_CLIENT_SECRET}
      AISHA_BOOTSTRAP_PASSWORD: ${AISHA_BOOTSTRAP_PASSWORD}
      AISHA_PKI_BOOTSTRAP_PASSWORD: ${AISHA_PKI_BOOTSTRAP_PASSWORD}
    networks:
      - internal
    labels:
      - "coolify.managed=true"

secrets:
  forgejo_token:
    environment: FORGEJO_TOKEN

networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  coolify:
    external: true
    name: coolify
