    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-money
    profiles: ["money"]
    expose: ["3016"]
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
