# Prose lives in docs/compose-notes/docker-compose.coolify-model.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
services:
  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-model--pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      # Odvozuje cold-start z manifestu (pki nasazeno ⇒ true); bez PKI se vypíná
      # POŽADAVEK, ne jen adresa — výklad: docs/compose-notes/docker-compose.coolify.yml.md
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:?odvozuje cold-start z manifestu; bez něj pki-init trvá na bundlu i bez PKI}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  svc-model:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    build:
      context: .
      dockerfile: Dockerfile.svc-model
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-model
    restart: unless-stopped
    environment:
      - CHAT_GGUF_URL=${CHAT_GGUF_URL}
      - CHAT_GGUF_SHA256=${CHAT_GGUF_SHA256}
      - EMBED_GGUF_URL=${EMBED_GGUF_URL:-}
      - EMBED_GGUF_SHA256=${EMBED_GGUF_SHA256:-}
      - EMBED_ALIAS=${EMBED_ALIAS:-}
      - EMBED2_GGUF_URL=${EMBED2_GGUF_URL:-}
      - EMBED2_GGUF_SHA256=${EMBED2_GGUF_SHA256:-}
      - EMBED2_ALIAS=${EMBED2_ALIAS:-}
      - BUNDLE_GIT_URL=${INGEST_BUNDLE_GIT_URL:-}
      - BUNDLE_GIT_PATH=${INGEST_BUNDLE_GIT_PATH:-ingest}
      - BUNDLE_GIT_REF=${INGEST_BUNDLE_GIT_REF:-}
      - MODEL_ALIAS=${MODEL_ALIAS:-}
      - MODEL_N_CTX=${MODEL_N_CTX:-4096}
      - MODEL_N_THREADS=${MODEL_N_THREADS:-}
    volumes:
      - model-weights:/models
    expose:
      - "8000"
    cpus: ${MODEL_CPUS:-2.0}
    mem_limit: ${MODEL_MEM:-8g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 8s
      start_period: 300s
      retries: 5
    networks:
      internal:
        aliases: ["svc-model", "${APP_NAME_PREFIX:?identita instance}-svc-model"]
      mesh-dns: {}
    labels:
      - "coolify.managed=true"

  netbird-agent:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-model--netbird
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        echo "[netbird-agent] Bridge mode — own netns, no host daemon conflict."
        echo "[netbird-agent] DNS proxy disabled — model receives inbound mesh only."
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited — retry in 15s; container stays UP (never trips Coolify restart-limit)."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    volumes:
      - netbird-model-data-v3:/etc/netbird
      - netbird-model-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_EXPERIMENTAL}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: experimental-model
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-model

  model-mesh-ingress:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_CADDY}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-model--mesh-ingress
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
    environment:
      MODEL_MESH_INGRESS_ROUTES: ${MODEL_MESH_INGRESS_ROUTES:-}
      # TÝŽ seznam, jaký dostává gateway — jeden zdroj (`lib/derive-subnets.mjs`).
      # Bez něj Caddy `x-forwarded-for` přepíše a klientská adresa se ztratí.
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$${MODEL_MESH_INGRESS_ROUTES:-}" ]; then
          echo "[mesh-ingress] MODEL_MESH_INGRESS_ROUTES prázdné — derivace nic nevydala nebo se nedoručila."
          echo "[mesh-ingress] Naslouchám jen na health, aby bylo VIDĚT, že tabulka chybí."
          printf ':8000 {\n  handle /__mesh_health {\n    respond "no-routes" 503\n  }\n  handle {\n    respond "mesh-ingress bez směrovací tabulky" 503\n  }\n}\n' > /etc/caddy/Caddyfile
        else
          : > /etc/caddy/Caddyfile
          # ⛔ NAMĚŘENO 2026-08-31: brána viděla `x-forwarded-for` s JEDINÝM
          # prvkem — adresou svého souseda (mesh-router edge). To je podpis
          # NAHRAZENÍ, ne řetězu: Caddy bez `trusted_proxies` příchozí hlavičce
          # nedůvěřuje a přepíše ji tím, kdo se právě připojil. Každý náš skok
          # tak řetěz zahodil a klientská adresa se ke dveřím NEDOSTALA —
          # `enforce` by zamkl i majitele.
          #
          # Hodnota se NEOPISUJE: je to TÝŽ seznam, jaký dostává gateway
          # (`lib/derive-subnets.mjs` → GATEWAY_TRUSTED_PROXIES). Dva tvary
          # (čárky pro env, mezery pro Caddy), jeden zdroj — kdyby si je každý
          # skládal sám, chůze zprava by v každém prvku končila jinde.
          if [ -n "$${GATEWAY_TRUSTED_PROXIES:-}" ]; then
            printf '{\n  servers {\n    trusted_proxies static %s\n  }\n}\n\n' \
              "$$(echo "$${GATEWAY_TRUSTED_PROXIES}" | tr ',' ' ')" >> /etc/caddy/Caddyfile
          else
            # Nedoručený seznam se NEDOSAZUJE. Bez něj Caddy řetěz přepíše —
            # to je vada, ale TICHÁ; tady se aspoň řekne nahlas.
            echo "[mesh-ingress] GATEWAY_TRUSTED_PROXIES nedoručen — x-forwarded-for bude PŘEPSÁN, klientská adresa se ztratí"
          fi
          PORTS=$$(echo "$${MODEL_MESH_INGRESS_ROUTES}" | tr ';' '\n' | cut -d'|' -f1 | sort -un)
          for P in $$PORTS; do
            printf ':%s {\n  handle /__mesh_health {\n    respond "ok" 200\n  }\n' "$$P" >> /etc/caddy/Caddyfile
            echo "$${MODEL_MESH_INGRESS_ROUTES}" | tr ';' '\n' | while IFS='|' read -r RP RH RT; do
              [ "$$RP" = "$$P" ] || continue
              M=$$(echo "$$RH" | cut -d, -f1 | cut -d. -f1 | tr '-' '_')
              HOSTS=$$(echo "$$RH" | tr ',' ' ')
              printf '  @%s host %s\n  handle @%s {\n    reverse_proxy http://%s\n  }\n' "$$M" "$$HOSTS" "$$M" "$$RT" >> /etc/caddy/Caddyfile
            done
            printf '  handle {\n    respond "mesh-ingress: Host nepatri na tento port" 421\n  }\n}\n' >> /etc/caddy/Caddyfile
          done
          echo "[mesh-ingress] tabulka: $$(echo "$${MODEL_MESH_INGRESS_ROUTES}" | tr ';' '\n' | wc -l) tras na $$(echo "$$PORTS" | wc -w) portech"
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/__mesh_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  model-weights:
    name: ${APP_NAME_PREFIX:?}_svc-model-weights
  pki-certs:
    name: ${APP_NAME_PREFIX:?}_model-pki-certs
  netbird-model-data-v3:
    name: ${APP_NAME_PREFIX:?}_netbird-model-data
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  coolify:
    external: true
    name: coolify
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}