name: AISHA OpenAI plugin package
on:
  pull_request:
    paths:
      - extensions/aisha-dirigent-openai/**
      - .github/workflows/aisha-openai-plugin.yml
  push:
    paths:
      - extensions/aisha-dirigent-openai/**
      - .github/workflows/aisha-openai-plugin.yml
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test package boundaries and build both formats
        working-directory: extensions/aisha-dirigent-openai
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/package.py --output dist/aisha-dirigent-0.1.0.zip --codex-preview dist/codex-preview
