# Prose lives in docs/compose-notes/docker-compose.coolify-exec.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
x-svc-common: &svc-common
  restart: unless-stopped
  networks:
    - internal
    - coolify
    - mesh-dns

x-svc-healthcheck: &svc-healthcheck
  interval: 15s
  timeout: 5s
  start_period: 30s
  retries: 5

services:
  svc-agent-runner:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *svc-common
    cap_add: [NET_ADMIN]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ip route replace "$${NETBIRD_PEER_CIDR:?}" via "$${NETBIRD_DNS_IP:?}"
        echo "[mesh-route] $${NETBIRD_PEER_CIDR} via $${NETBIRD_DNS_IP}"
        S=/var/run/docker.sock
        if [ -S "$$S" ]; then
          G=$$(stat -c %g "$$S")
          if [ "$$G" = "0" ]; then
            echo "[docker-sock] $$S patří skupině 0 (root) — node do ní nepřidávám; běhy pluginů v dockeru selžou EACCES"
          else
            N=$$(getent group "$$G" | cut -d: -f1)
            [ -n "$$N" ] || { addgroup -g "$$G" dockersock; N=dockersock; }
            addgroup node "$$N"
            echo "[docker-sock] node ∈ $$N (gid $$G) — z vlastníka socketu, ne natvrdo"
          fi
        else
          echo "[docker-sock] $$S není socket — backend docker nebude mít přístup"
        fi
        exec su-exec node node dist/server.js
    # ⛔ ALIAS S IDENTITOU přebíjí seznam sítí ze sdílené kotvy. Cíl mesh trasy
    # se skládá jako `<prefix>-<služba>`, jenže Coolify `container_name`
    # PŘEPISUJE — nosný je ALIAS (naměřeno 2026-08-21 na extranetu: trasa mířila
    # na jméno, které neexistovalo, ingress vracel 502, a mesh přitom byla
    # průchozí). Kotva sítě jen vyjmenovává, alias k nim přidává jméno.
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-agent-runner
      coolify:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-agent-runner
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-agent-runner
    depends_on:
      plugin-exec-tag:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile.svc-agent-runner
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-agent-runner
    expose:
      - "3030"
    environment:
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?mesh}
      CORS_ALLOWLIST: ${CORS_ALLOWLIST:-}
      NODE_ENV: production
      PORT: 3030
      LOG_LEVEL: ${LOG_LEVEL:-info}

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KC_ISSUER: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}

      PLUGIN_SYSTEM_URL: ${PLUGIN_SYSTEM_URL}
      PLUGIN_BROKER_URL: ${PLUGIN_BROKER_URL}
      BROKER_TOKEN_SECRET: ${BROKER_TOKEN_SECRET}

      RUNNER_BACKEND: ${RUNNER_BACKEND:-kata}
      DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-v1.46}
      DOCKER_EXEC_NETWORK: ${APP_NAME_PREFIX:?identita instance — síť na sdíleném hostiteli ji MUSÍ nést}-exec-net
      KATA_GRPC_ENDPOINT: ${KATA_DEFAULT_RUNTIME}
      EXEC_MEMORY_LIMIT: ${EXEC_MEMORY_LIMIT:-2g}
      MAX_CONCURRENT_CLAUDE_RUNS: ${MAX_CONCURRENT_CLAUDE_RUNS:-3}
      EXEC_CPU_QUOTA: ${EXEC_CPU_QUOTA:-200000}
      EXEC_CPU_PERIOD: ${EXEC_CPU_PERIOD:-100000}
      DEFAULT_TIMEOUT_MS: ${DEFAULT_TIMEOUT_MS:-60000}
      MAX_TIMEOUT_MS: ${MAX_TIMEOUT_MS:-600000}

      NETBIRD_ENABLED: ${NETBIRD_ENABLED:-true}
      NETBIRD_API_URL: ${NETBIRD_API_URL}
      NETBIRD_AUTH_SCHEME: ${NETBIRD_AUTH_SCHEME:-Bearer}
      NETBIRD_API_TOKEN: ${NETBIRD_API_TOKEN:-}
      NETBIRD_KEYCLOAK_CLIENT_ID: netbird-backend
      NETBIRD_KEYCLOAK_CLIENT_SECRET: ${NETBIRD_MGMT_SECRET}
      NETBIRD_SANDBOX_GROUP: ${NETBIRD_SANDBOX_GROUP}

      AISHA_DB_URL: ${AISHA_DB_URL}
      POSTGREST_URL: ${POSTGREST_URL}
      POSTGREST_SERVICE_TOKEN: ${POSTGREST_SERVICE_TOKEN}

      AGENT_RUNNER_ENABLED: "true"
      AGENT_RUNNER_WAKE_TOKEN: ${AGENT_RUNNER_WAKE_TOKEN:-}
      NODE_EXTRA_CA_CERTS: /certs/pki/aisha-ca-bundle.pem

      CLAUDE_POLL_ENABLED: ${CLAUDE_POLL_ENABLED:-false}
      AGENT_RUNS_DIR: ${AGENT_RUNS_DIR:?AGENT_RUNS_DIR must be delivered by cold-start env (generate-secrets derives the instance-scoped host path)}
      AGENT_REPO_PATH: ${AGENT_REPO_PATH:?AGENT_REPO_PATH must be delivered by cold-start env (generate-secrets derives the instance-scoped host path)}
      AGENT_CLAUDE_IMAGE: ${AGENT_CLAUDE_IMAGE:-}
      CLAUDE_CLI_TIMEOUT_MS: ${CLAUDE_CLI_TIMEOUT_MS:-3600000}
      AGENT_GATEWAY_URL: ${AGENT_GATEWAY_URL:-}
      AGENT_MCP_TOKEN: ${AGENT_MCP_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_CLAUDE_OAUTH_TOKEN: ${AGENT_CLAUDE_OAUTH_TOKEN:-}
      AGENT_CLAUDE_HOME_DIR: ${AGENT_CLAUDE_HOME_DIR:-}
      AGENT_LOCAL_LLM_URL: ${AGENT_LOCAL_LLM_URL:-}
      AGENT_LOCAL_LLM_MODEL: ${AGENT_LOCAL_LLM_MODEL:-}
      AGENT_AUTH_MODE: ${AGENT_AUTH_MODE:-auto}
      AGENT_CLAUDE_MODEL: ${AGENT_CLAUDE_MODEL:-}
      AGENT_CLAUDE_PERMISSION_MODE: ${AGENT_CLAUDE_PERMISSION_MODE:-acceptEdits}
      AGENT_GIT_PUSH: ${AGENT_GIT_PUSH:-0}
      AGENT_GIT_REMOTE: ${AGENT_GIT_REMOTE:-}
      AGENT_GIT_TOKEN: ${AGENT_GIT_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./config/pki:/certs/pki:ro
      - /var/lib/aisha/agent-runs:/var/lib/aisha/agent-runs:rw
      - /srv/aisha/base-repo:/srv/aisha/base-repo:ro
    healthcheck:
      <<: *svc-healthcheck
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:3030/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\" || exit 1"
    labels:
      - "coolify.managed=true"

  # Proza: docs/compose-notes/docker-compose.coolify-exec.yml.md
  plugin-exec-image:
    build:
      context: .
      dockerfile: images/plugin-exec/Dockerfile
      labels:
        coolify.managed: "true"
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-plugin-exec-image
    restart: unless-stopped
    entrypoint: ["sh", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - internal
    labels:
      - "coolify.managed=true"

  # Proza: docs/compose-notes/docker-compose.coolify-exec.yml.md
  plugin-exec-tag:
    image: ${IMAGE_DOCKER_CLI:?obraz docker CLI — bez něj nevznikne stabilní jméno sandboxu}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-plugin-exec-tag
    restart: "no"
    depends_on:
      plugin-exec-image:
        condition: service_started
    environment:
      SLUZBA: plugin-exec-image
      APLIKACE: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-exec
      CIL: aisha/plugin-exec:v1
    entrypoint:
      - sh
      - -euc
      - |
        KONT="$$(docker ps -q --filter label=com.docker.compose.service="$$SLUZBA" --filter label=coolify.resourceName="$$APLIKACE" | head -1)"
        [ -n "$$KONT" ] || { echo "kontejner sluzby $$SLUZBA v $$APLIKACE nenalezen" >&2; exit 1; }
        ID="$$(docker inspect -f '{{.Image}}' "$$KONT")"
        [ -n "$$ID" ] || { echo "prazdne ID obrazu pro $$KONT" >&2; exit 1; }
        docker tag "$$ID" "$$CIL"
        docker image inspect "$$CIL" >/dev/null
        echo "$$CIL -> $$ID"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    healthcheck:
      disable: true
    networks:
      - internal
    labels:
      - "coolify.managed=true"

  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-exec--pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      # Odvozuje cold-start z manifestu (pki nasazeno ⇒ true); bez PKI se vypíná
      # POŽADAVEK, ne jen adresa — výklad: docs/compose-notes/docker-compose.coolify.yml.md
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:?odvozuje cold-start z manifestu; bez něj pki-init trvá na bundlu i bez PKI}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  netbird-agent:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-exec--netbird
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        echo "[netbird-agent] Bridge mode — own netns, no host daemon conflict."
        echo "[netbird-agent] DNS proxy disabled — exec receives inbound mesh only."
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited — retry in 15s; container stays UP (never trips Coolify restart-limit)."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    volumes:
      - netbird-exec-data-v3:/etc/netbird
      - netbird-exec-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_EXPERIMENTAL}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: experimental-exec
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    expose:
      - "3030"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-model

  exec-mesh-ingress:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_CADDY}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-model--mesh-ingress
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
    environment:
      EXEC_MESH_INGRESS_ROUTES: ${EXEC_MESH_INGRESS_ROUTES:-}
      # TÝŽ seznam, jaký dostává gateway — jeden zdroj (`lib/derive-subnets.mjs`).
      # Bez něj Caddy `x-forwarded-for` přepíše a klientská adresa se ztratí.
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$${EXEC_MESH_INGRESS_ROUTES:-}" ]; then
          echo "[mesh-ingress] EXEC_MESH_INGRESS_ROUTES prázdné — derivace nic nevydala nebo se nedoručila."
          echo "[mesh-ingress] Naslouchám jen na health, aby bylo VIDĚT, že tabulka chybí."
          # ⛔ STAV BEZ TABULKY MUSÍ BÝT VIDĚT SONDĚ (naměřeno 2026-09-03).
          # Záložní Caddyfile poslouchal na :8000, ale healthcheck sonduje :3030 —
          # port této služby. Sonda tedy dostala „connection refused" místo
          # navrženého 503 „bez směrovací tabulky", a diagnóza vedla k „zavřený
          # port" místo ke skutečné příčině. Neshoda byla v 15 z 16 stacků;
          # jediný, kde porty seděly, byl `model`, jehož vlastní port JE 8000 —
          # vzor se trefil sám sebou a vada byla ze zdroje neviditelná.
          printf ':3030 {\n  handle /__mesh_health {\n    respond "no-routes" 503\n  }\n  handle {\n    respond "mesh-ingress bez směrovací tabulky" 503\n  }\n}\n' > /etc/caddy/Caddyfile
        else
          : > /etc/caddy/Caddyfile
          # ⛔ NAMĚŘENO 2026-08-31: brána viděla `x-forwarded-for` s JEDINÝM
          # prvkem — adresou svého souseda (mesh-router edge). To je podpis
          # NAHRAZENÍ, ne řetězu: Caddy bez `trusted_proxies` příchozí hlavičce
          # nedůvěřuje a přepíše ji tím, kdo se právě připojil. Každý náš skok
          # tak řetěz zahodil a klientská adresa se ke dveřím NEDOSTALA —
          # `enforce` by zamkl i majitele.
          #
          # Hodnota se NEOPISUJE: je to TÝŽ seznam, jaký dostává gateway
          # (`lib/derive-subnets.mjs` → GATEWAY_TRUSTED_PROXIES). Dva tvary
          # (čárky pro env, mezery pro Caddy), jeden zdroj — kdyby si je každý
          # skládal sám, chůze zprava by v každém prvku končila jinde.
          if [ -n "$${GATEWAY_TRUSTED_PROXIES:-}" ]; then
            printf '{\n  servers {\n    trusted_proxies static %s\n  }\n}\n\n' \
              "$$(echo "$${GATEWAY_TRUSTED_PROXIES}" | tr ',' ' ')" >> /etc/caddy/Caddyfile
          else
            # Nedoručený seznam se NEDOSAZUJE. Bez něj Caddy řetěz přepíše —
            # to je vada, ale TICHÁ; tady se aspoň řekne nahlas.
            echo "[mesh-ingress] GATEWAY_TRUSTED_PROXIES nedoručen — x-forwarded-for bude PŘEPSÁN, klientská adresa se ztratí"
          fi
          PORTS=$$(echo "$${EXEC_MESH_INGRESS_ROUTES}" | tr ';' '\n' | cut -d'|' -f1 | sort -un)
          for P in $$PORTS; do
            printf ':%s {\n  handle /__mesh_health {\n    respond "ok" 200\n  }\n' "$$P" >> /etc/caddy/Caddyfile
            echo "$${EXEC_MESH_INGRESS_ROUTES}" | tr ';' '\n' | while IFS='|' read -r RP RH RT; do
              [ "$$RP" = "$$P" ] || continue
              M=$$(echo "$$RH" | cut -d, -f1 | cut -d. -f1 | tr '-' '_')
              HOSTS=$$(echo "$$RH" | tr ',' ' ')
              printf '  @%s host %s\n  handle @%s {\n    reverse_proxy http://%s\n  }\n' "$$M" "$$HOSTS" "$$M" "$$RT" >> /etc/caddy/Caddyfile
            done
            printf '  handle {\n    respond "mesh-ingress: Host nepatri na tento port" 421\n  }\n}\n' >> /etc/caddy/Caddyfile
          done
          echo "[mesh-ingress] tabulka: $$(echo "$${EXEC_MESH_INGRESS_ROUTES}" | tr ';' '\n' | wc -l) tras na $$(echo "$$PORTS" | wc -w) portech"
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3030/__mesh_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pki-certs:
    name: ${APP_NAME_PREFIX:?}_exec-pki-certs
  netbird-exec-data-v3:
    name: ${APP_NAME_PREFIX:?}_netbird-exec-data
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  coolify:
    external: true
    name: coolify
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}