# ═══════════════════════════════════════════════════════════════════════════════
# Vector — Log collector pro Supabase Analytics (Logflare)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Sbírá Docker container logy a posílá je do Logflare/Analytics backendu.
# Aktivní pouze s profilem "full" nebo "analytics".
#

api:
  enabled: true
  address: 0.0.0.0:9001

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - aisha-vector

transforms:
  # Přidáme project label ke kazdému logu
  project_logs:
    type: remap
    inputs:
      - docker_host
    source: |
      .project = "evymo"
      .event_message = del(.message)
      .appname = del(.container_name)
      ts = del(.timestamp)
      if !is_null(ts) {
        .timestamp = ts
      }

sinks:
  logflare:
    type: "http"
    inputs:
      - project_logs
    uri: "http://analytics:4000/api/logs?source_name=docker_logs"
    method: "post"
    auth:
      strategy: "bearer"
      token: "${LOGFLARE_API_KEY}"
    encoding:
      codec: "json"
    batch:
      max_bytes: 1048576
      timeout_secs: 1
    healthcheck:
      enabled: true
    request:
      retry_max_duration_secs: 10
