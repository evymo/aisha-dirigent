# =============================================================================
# mautrix-discord Bridge Configuration — Evymo Production
# =============================================================================
# Docs: https://docs.mau.fi/bridges/go/discord/
# =============================================================================

homeserver:
  address: http://synapse:8008
  domain: ${MATRIX_DOMAIN}

appservice:
  address: http://mautrix-discord:29334
  hostname: 0.0.0.0
  port: 29334
  database:
    type: postgres
    uri: postgres://synapse_user:${SYNAPSE_DB_PASSWORD}@${APP_NAME_PREFIX}-db:5432/synapse_bridge_discord?sslmode=disable
  id: discord
  as_token: ${AISHA_AS_TOKEN}_discord
  hs_token: ${AISHA_HS_TOKEN}_discord
  bot:
    username: discordbot
    displayname: Discord Bridge Bot
    avatar: mxc://maunium.net/nIdEykemnwdisvHbpxflpDlC

bridge:
  permissions:
    "*": relay
    "${MATRIX_DOMAIN}": user
    "@admin:${MATRIX_DOMAIN}": admin
  relay:
    enabled: true
  command_prefix: "!discord"
  double_puppet_allow_discovery: true

logging:
  min_level: warn
  writers:
    - type: stdout
      format: json
