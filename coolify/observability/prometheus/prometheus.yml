# Phase 12 WP 0.2 — Prometheus scrape config.
#
# Targets:
#   - node-exporter, cadvisor, postgres-exporter (in this stack)
#   - all 20 HTTP services with /metrics endpoint (wired in WP 0.1 + WP 0.4)
#   - Prometheus self-metrics
#
# Service discovery: static lists for now (Coolify-deployed services have
# stable in-cluster DNS names). Future iteration: docker_sd_config when the
# cluster scales beyond ~30 services.
#
# Reload (hot): `curl -X POST http://prometheus:9090/-/reload`

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: aisha
    stack: production

scrape_configs:
  # ── Prometheus itself ─────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # ── Infra exporters in this stack ─────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  # ── AISHA microservices /metrics (Phase 12 WP 0.1 + 0.4) ──────────────
  # Service names match docker compose container names + their internal
  # ports per services/*/config.ts defaults.
  - job_name: aisha-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:3001
          - ws-gateway:3002
          - storage-auth:3005
          - svc-stripe:3010
          - svc-ai-chat:3011
          - svc-push:3012
          - svc-blockchain:3013
          - svc-fio-bank:3014
          - svc-homeassistant:3015
          - svc-github-app:3016
          - svc-mcp-knowledge:3017
          - svc-health-ai:3024
          - svc-livekit:3025
          - svc-communications:3027
          - svc-matrix:3026
          - svc-packeta:3028
          - svc-plugin-system:3029
          - svc-web-artifact:3030
          - svc-pki-bridge:3037
          - svc-ide-context:3050
    relabel_configs:
      # Strip the port from instance label for cleaner Grafana legends
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
        replacement: $1
