# =============================================================================
# mautrix-signal Bridge Configuration — Evymo Production
# =============================================================================
# Docs: https://docs.mau.fi/bridges/go/signal/
# =============================================================================

homeserver:
  address: http://synapse:8008
  domain: ${MATRIX_DOMAIN}

appservice:
  address: http://mautrix-signal:29328
  hostname: 0.0.0.0
  port: 29328
  database:
    type: postgres
    uri: postgres://synapse_user:${SYNAPSE_DB_PASSWORD}@${APP_NAME_PREFIX}-db:5432/synapse_bridge_signal?sslmode=disable
  id: signal
  as_token: ${AISHA_AS_TOKEN}_signal
  hs_token: ${AISHA_HS_TOKEN}_signal
  bot:
    username: signalbot
    displayname: Signal Bridge Bot
    avatar: mxc://maunium.net/wPJgTQbZOtpBFmDNkiNEMDUp

bridge:
  permissions:
    "*": relay
    "${MATRIX_DOMAIN}": user
    "@admin:${MATRIX_DOMAIN}": admin
  relay:
    enabled: true
  command_prefix: "!signal"
  double_puppet_allow_discovery: true

logging:
  min_level: warn
  writers:
    - type: stdout
      format: json
