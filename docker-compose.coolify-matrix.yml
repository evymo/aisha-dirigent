    <<: *bridge-common
    profiles: ["bridge-slack"]
    image: ${IMAGE_MAUTRIX_SLACK}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-bridge-slack
    volumes:
