# =============================================================================
# PostgREST standalone configuration
# =============================================================================
# PostgREST connects to PG17 as 'authenticator' role and switches to
# anon/authenticated/service_role based on JWT 'role' claim.
#
# JWT: Keycloak RS256 (validated via JWKS URI or pre-shared public key)
# =============================================================================

# Database connection
db-uri = "$(PGRST_DB_URI)"
db-schemas = "public, storage"
db-anon-role = "anon"
db-extra-search-path = "extensions"

# JWT — Keycloak JWKS for RS256 verification
jwt-secret = "$(PGRST_JWT_SECRET)"
jwt-aud = "aisha-app"

# Role claim path in Keycloak JWT
# Keycloak puts roles in realm_access.roles array
# We map the 'role' claim via a custom KC mapper to match PostgREST expectations
jwt-role-claim-key = ".role"

# Server
server-host = "0.0.0.0"
server-port = 3000

# Performance
db-pool = 20
db-pool-acquisition-timeout = 10

# OpenAPI — disabled: no anon schema enumeration at GET / (RPC-only platform).
# follow-privileges leaks every anon-visible table/RPC name+shape to the public.
openapi-mode = "disabled"
openapi-server-proxy-uri = ""

# Logging
log-level = "warn"
