# Static SPA host for a surface shell. SPA fallback → index.html; hashed assets
# cached immutably, index.html + runtime tokens never cached (instance may re-theme).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets — safe to cache forever.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Runtime-resolved theming + app shell — never cache (instance may re-skin/re-config).
  location = /index.html { add_header Cache-Control "no-store"; }
  location = /tokens.css { add_header Cache-Control "no-store"; }

  # SPA routes → index.html (client-side OIDC redirect handling lives in the shell).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
