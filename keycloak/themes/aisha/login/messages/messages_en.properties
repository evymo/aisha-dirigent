# Login page — English. DEFAULT (platform) copy.
#
# An instance overlay REPLACES this file wholesale (message bundles are swapped
# file by file, not key by key) — so every key the template uses must be here,
# passkey strings included.

# — card —
loginTitle=Sign in — {0}
loginAccountTitle=Sign in
doLogIn=Sign in
loginPanelEyebrow=AISHA · Sign in
loginAssurance=Protected by OIDC + MFA
loginLegal=Data access is governed by roles and Row-Level Security. Every query and answer is audited.

# — welcome column —
loginWordmark=AISHA
loginWordmarkSuffix=ID
loginHeroKicker=Corporate AI server · under your own roof
# The headline is an INVITATION, not a slogan. It used to read "One place to run
# the whole operation." and the instance overrode it with "Run the group from one
# place." — both speak for a customer the generic build has never met, and promise
# a posture a sign-in page cannot back up. This is the one sentence that says what
# a person actually DOES on the other side of the login.
#
# The key is deliberately identical in the instance overlay: it is product copy,
# not an instance value. Anyone tempted to "improve" it into a slogan should read
# this paragraph first.
loginHeroTitle=Ask whatever you want.
# The second sentence used to open with "Ask in plain language" — after the
# headline change that was the same imperative twice in a row. Same information,
# without the stutter.
loginHeroLead=AISHA connects operations, contracts, invoicing and documents into a single governed environment. Answers come back in plain language — always citing their source.

# Monitoring endpoint for the status lamps (gateway /api/health). EMPTY = the
# generic build calls nothing. An instance fills it in and must also list the
# login page's domain in the gateway's ALLOWED_ORIGINS, or the browser drops
# the response and the lamps stay neutral.
loginStatusEndpoint=

# — passkey —
webauthn-passwordless-login-title=Sign in with a passkey
webauthn-doAuthenticate=Use passkey
webauthn-unsupported-browser-text=Your browser does not support passkeys. Sign in with your password.
webauthn-error-title=Passkey error
webauthn-error-api-get=Passkey verification failed.
webauthn-error-user-not-found=Unknown user.
# Agregovaný příznak provozu. ZÁMĚRNĚ bez jmen subsystémů: stránku vidí
# i nepřihlášený a ten nepotřebuje vědět, z čeho je systém složený.
# Dřív tu byly loginStackSso/Data/Storage a instance je přepsala na
# produktová jména — expozice, kterou agregace ruší v mechanismu.
loginStatusUnknown=Checking service status
loginStatusOk=All systems operational
loginStatusDegraded=Service degraded
