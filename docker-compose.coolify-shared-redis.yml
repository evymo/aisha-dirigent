# Prose lives in docs/compose-notes/docker-compose.coolify-shared-redis.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
services:
  shared-redis:
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-shared-redis
    image: ${REGISTRY_PROXY}library/redis:7-alpine
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-shared-redis
    expose:
      - "6379"
    volumes:
      - shared-redis-data:/data
      - shared-redis-config:/usr/local/etc/redis
    environment:
      REDIS_PASSWORD_CORE: ${REDIS_PASSWORD_CORE}
      REDIS_PASSWORD_LANGFUSE: ${REDIS_PASSWORD_LANGFUSE}
      REDIS_PASSWORD_N8N:      ${REDIS_PASSWORD_N8N}
      REDIS_PASSWORD_ADMIN:    ${REDIS_PASSWORD_ADMIN}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # Pojistka se přestěhovala z compose sem — proč, viz docs/compose-notes/.
        for JMENO in REDIS_PASSWORD_ADMIN REDIS_PASSWORD_CORE REDIS_PASSWORD_LANGFUSE REDIS_PASSWORD_N8N; do
          if [ -z "$$(printenv "$$JMENO" || true)" ]; then
            echo "FATAL: $$JMENO je prazdne — ACL by vzniklo bez pouzitelneho hesla." >&2
            echo "       Hodnotu razi generate-secrets.mjs a dorucuje coolify-sync-envs.sh," >&2
            echo "       ktery doruceni overuje zpetnym ctenim. Prazdno tu znamena, ze selhalo." >&2
            exit 1
          fi
        done
        ACL=/usr/local/etc/redis/users.acl
        cat > "$$ACL" <<EOF
        user default off
        user admin on >$${REDIS_PASSWORD_ADMIN} ~* &* +@all
        user core on >$${REDIS_PASSWORD_CORE} ~* &* +@all -@dangerous +info +client +ping +flushdb
        user langfuse on >$${REDIS_PASSWORD_LANGFUSE} ~lf:* &* +@all -@dangerous +info +ping
        user n8n on >$${REDIS_PASSWORD_N8N} ~bull:* ~n8n:* &* +@all -@dangerous +info +ping
        EOF
        chmod 0600 "$$ACL"
        exec redis-server \
          --appendonly yes \
          --maxmemory 1gb \
          --maxmemory-policy allkeys-lru \
          --aclfile "$$ACL"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -u redis://core:$${REDIS_PASSWORD_CORE}@127.0.0.1:6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-shared-redis--pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      # Odvozuje cold-start z manifestu (pki nasazeno ⇒ true); bez PKI se vypíná
      # POŽADAVEK, ne jen adresa — výklad: docs/compose-notes/docker-compose.coolify.yml.md
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:?odvozuje cold-start z manifestu; bez něj pki-init trvá na bundlu i bez PKI}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  netbird-agent:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-shared-redis--netbird
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        echo "[netbird-agent] Bridge mode — own netns, no host daemon conflict."
        echo "[netbird-agent] DNS proxy disabled — shared-redis receives inbound mesh only."
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited — retry in 15s; container stays UP (never trips Coolify restart-limit)."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    volumes:
      - netbird-shared-redis-data-v3:/etc/netbird
      - netbird-shared-redis-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_BACKEND}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: backend-shared-redis
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-model

  shared-redis-mesh-tcp:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: "${IMAGE_NGINX}"
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-shared-redis--mesh-tcp
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
    environment:
      SHARED_REDIS_MESH_TCP_ROUTES: "${SHARED_REDIS_MESH_TCP_ROUTES:-}"
    # Měří to, co je úkolem sidecaru: že PORT Z TABULKY skutečně přijímá spojení.
    # Prázdná tabulka → prázdný port → unhealthy, a to je SPRÁVNĚ: sidecar, který
    # nic nerozvádí, se nesmí tvářit zdravě (týž zákon jako 503 `no-routes`
    # u HTTP ingressu).
    healthcheck:
      test:
        - CMD-SHELL
        - p=$$(printf '%s' "$$SHARED_REDIS_MESH_TCP_ROUTES" | cut -d';' -f1 | cut -d'|' -f1); [ -n "$$p" ] && nc -z 127.0.0.1 "$$p" || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - sh
      - -c
      - |
        set -eu
        CFG=/tmp/mesh-tcp.conf
        if [ -z "$${SHARED_REDIS_MESH_TCP_ROUTES:-}" ]; then
          echo "[mesh-tcp] SHARED_REDIS_MESH_TCP_ROUTES prazdne - derivace nic nevydala nebo se nedorucila." >&2
          echo "[mesh-tcp] NENASLOUCHAM na zadnem portu. Connection refused je VIDITELNY stav;" >&2
          echo "[mesh-tcp] naslouchajici port bez cile by vypadal jako funkcni mesh." >&2
          trap 'exit 0' TERM INT
          while :; do sleep 3600 & wait $$!; done
        fi
        {
          echo "events {}"
          echo "stream {"
          OLDIFS=$$IFS; IFS=";"
          for r in $${SHARED_REDIS_MESH_TCP_ROUTES}; do
            IFS=$$OLDIFS
            port=$${r%%|*}; target=$${r#*|}
            [ -n "$$port" ] && [ -n "$$target" ] || { IFS=";"; continue; }
            echo "  server { listen $$port; proxy_pass $$target; }"
            IFS=";"
          done
          IFS=$$OLDIFS
          echo "}"
        } > "$$CFG"
        echo "[mesh-tcp] tabulka: $${SHARED_REDIS_MESH_TCP_ROUTES}"
        nginx -t -c "$$CFG"
        exec nginx -g "daemon off;" -c "$$CFG"

volumes:
  pki-certs:
    name: ${APP_NAME_PREFIX:?}_shared-redis-pki-certs
  netbird-shared-redis-data-v3:
    name: ${APP_NAME_PREFIX:?}_netbird-shared-redis-data
  shared-redis-data:
    name: ${APP_NAME_PREFIX:?}_shared-redis-data
  shared-redis-config:
    name: ${APP_NAME_PREFIX:?}_shared-redis-config
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net