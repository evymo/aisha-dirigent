# =============================================================================
# mautrix-slack Bridge Configuration — Evymo Production
# =============================================================================
# Docs: https://docs.mau.fi/bridges/go/slack/
# =============================================================================

homeserver:
  address: http://synapse:8008
  domain: ${MATRIX_DOMAIN}

appservice:
  address: http://mautrix-slack:29335
  hostname: 0.0.0.0
  port: 29335
  database:
    type: postgres
    uri: postgres://synapse_user:${SYNAPSE_DB_PASSWORD}@${APP_NAME_PREFIX}-db:5432/synapse_bridge_slack?sslmode=disable
  id: slack
  as_token: ${AISHA_AS_TOKEN}_slack
  hs_token: ${AISHA_HS_TOKEN}_slack
  bot:
    username: slackbot
    displayname: Slack Bridge Bot

bridge:
  permissions:
    "*": relay
    "${MATRIX_DOMAIN}": user
    "@admin:${MATRIX_DOMAIN}": admin
  relay:
    enabled: true
  command_prefix: "!slack"
  double_puppet_allow_discovery: true

logging:
  min_level: warn
  writers:
    - type: stdout
      format: json
