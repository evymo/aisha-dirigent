# Used in some dropdowns on the UI as name for this endpoint
label: Enrollment

# A renewal request is only accpeted if the used certificate will
# expire within this period of time.
renewal_period: "000060"

# Create certificates for initial requests with a short validity to
# allow an immediate renewal
initial_validity: "+000030"

# If the request was a replacement, optionally revoke the replaced
# certificate after a grace period
revoke_on_replace:
    reason_code: keyCompromise
    delay_revocation_time: "+000014"

# if you remove this section, any non-renewal request will be treated
# as an initial request, this works around non-standard MDM and devices
authorized_signer:
    rule1:
        # Full DN
        subject: CN=.+:pkiclient,.*
    rule2:
        # Full DN
            subject: CN=my.scep.enroller.com:generic,.*

policy:
    # Authentication Options
    # Initial requests need ONE authentication.
    # Activate Challenge Password and/or HMAC by setting the appropriate
    # options below.

    # Manual (shared-secret challenge) authentication is DISABLED — the
    # AISHA enrollment auth model is HMAC (see `hmac:` below). A static
    # operator challenge password is an insecure demo primitive.
    allow_man_authen: 0

    # if set, no authentication is required at all and hmac/challenge is
    # not evaluated even if it is set/present in the request!
    allow_anon_enroll: 0

    # Approval
    # If not autoapproved, allow opeerator to add approval by hand
    allow_man_approv: 1

    # if the eligibiliyt check failed the first time
    # show a button to run a recheck (Workflow goes to PENDING)
    allow_eligibility_recheck: 0

    # Approval points required (eligibility and operator count as one point each).
    #
    # AISHA enrollment context: pki-bridge calls `/rpc/<realm>/RequestCertificate`
    # for machine-to-machine cert issuance (netbird-internal-tls, mesh services).
    # Every call is HMAC-authenticated by pki-bridge (OPENXPKI_RPC_HMAC) and the
    # `eligible.initial.connector` (regex `(\w[-\w]*\.)*mesh\.aisha\.(network|internal)\z|
    # (\w[-\w]*\.)*backend\.id3a\.cz\z`) gates which hostnames may auto-enroll.
    # That is the AISHA authorization model — HMAC + SAN regex — and a human-
    # operator approval step would only block automated cert chain bootstrap.
    #
    # Per the OpenXPKI comment below ("if you set this to '0', all authenticated
    # requests are auto-approved!"), 0 is the right value for our setup. Track B
    # symptom prior to this change: pki-bridge POST /rpc/.../RequestCertificate
    # timed out at 30s while the workflow waited for a manual approval that
    # would never arrive (HMAC auth provided 0 points, operator provided 0
    # points, target=1 → workflow PENDING forever).
    approval_points: 0

    # The number of active certs with the same subject that are allowed
    # to exist at the same time, deducted by one if a renewal is seen
    # set to 0 if you dont want to check for duplicates at all
    max_active_certs: 1

    # If an initial enrollment is seen
    # all existing certificates with the same subject are revoked
    auto_revoke_existing_certs: 1

    # Upper bound of certificates revoked inline within a SINGLE enrollment.
    # The remainder stays queued and is picked up by subsequent enrollments;
    # this converges because the duplicate search matches status 'ISSUED' only,
    # so each revoked cert drops out of the next queue. Without a bound the
    # enrollment response time is O(accumulated duplicates) and a large backlog
    # saturates the daemon past its RPC timeout, blocking all enrollment.
    # Unset = unlimited (legacy behaviour).
    max_revocations_per_enroll: 5

    # allows a "renewal" outside the renewal window, the notafter date
    # is aligned to the old certificate. Set revoke_on_replace option
    # to revoke the replaced certificate.
    # This substitutes the "replace_window" from the OpenXPKI v1 config
    allow_replace: 1

    # by default only the certificate identifier is written to the workflow
    # set to a true value to get the PEM encoded certificate in the context,
    # set to "chain" to get the issuer certificate and "fullchain" to get
    # the chain including the root certificate (key chain).
    export_certificate: chain


    # Those options are pulled by the revoke_by_entity workflow, they have no
    # effect on the enrollment workflow! You must set at least one of them or
    # remove the is_policy_loaded condition in the workflow definition

    # Allow revocation of any certificate with a certain profile
    # profile: tls_server

    # Allow revocation if the subject matches the given pattern
    # subject: "*"


profile:
  cert_profile: tls_server
  cert_subject_style: enroll

# Mapping of names to OpenXPKI profiles to be used with the
# Microsoft Certificate Template Name Ext. (1.3.6.1.4.1.311.20.2)
profile_map:
    pc-client: tls_client
    tls-server: tls_server
    tls-client: tls_client
    tls-dual: tls_dual

# HMAC based authentication — used by svc-pki-bridge for auto-approved
# cert issuance. The placeholder 'verysecret' is overridden at deploy
# time by pki-init which renders __PKI_RPC_HMAC__ from the Coolify env
# variable OPENXPKI_RPC_HMAC. See docker-compose.coolify-pki.yml.
hmac: __PKI_RPC_HMAC__

# Challenge password (optional, secondary to HMAC). The value is NOT
# shipped in the repo — pki-init renders __PKI_ENROLL_CHALLENGE__ from the
# OPENXPKI_ENROLL_CHALLENGE Coolify env at deploy time, mirroring the
# __PKI_RPC_HMAC__ flow. An unset env renders it empty (challenge unused).
challenge:
    value: __PKI_ENROLL_CHALLENGE__

eligible:
    initial:
       value@: connector:rpc.generic.connector.aisha_mesh
       args: '[% context.cert_subject_parts.CN.0 %]'

    renewal:
       value: 1

    onbehalf:
       value: 1

connector:
    # AISHA mesh domains — any *.${MESH_TLD} or *.${INTERNAL_TLD}
    # hostname is eligible for auto-enrollment when HMAC-authenticated.
    # This replaces the upstream default \w+\.openxpki.test pattern.
    aisha_mesh:
        class: OpenXPKI::Connector::Regex
        LOCATION: (\w[-\w]*\.)*mesh\.aisha\.(network|internal)\z|(\w[-\w]*\.)*backend\.id3a\.cz\z
