# Prose lives in docs/compose-notes/docker-compose.coolify-local-ingest.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
services:
  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-local-ingest--pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:-true}
      PKI_BUNDLE_WAIT_S: ${PKI_BUNDLE_WAIT_S:-600}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  input-init:
    image: ${IMAGE_BUSYBOX:?pin z config/image-versions.env}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-local-ingest--input-init
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /input/dokumenty && echo 'input-init: /data/input/dokumenty je pripojny bod pro dokumentove zdroje (:ro)'"]
    volumes:
      - ingest-input:/input
    healthcheck:
      disable: true
    networks:
      - internal

  docs-sync:
    image: ${IMAGE_RCLONE:-rclone/rclone:1.68}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-local-ingest--docs-sync
    restart: unless-stopped
    user: "0:0"
    environment:
      RCLONE_CONFIG_NC_TYPE: webdav
      RCLONE_CONFIG_NC_VENDOR: nextcloud
      RCLONE_CONFIG_NC_URL: ${NEXTCLOUD_URL:-}
      RCLONE_CONFIG_NC_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_APP_PASSWORD: ${NEXTCLOUD_APP_PASSWORD:-}
      NEXTCLOUD_APP_PASSWORD_OBSCURED: ${NEXTCLOUD_APP_PASSWORD_OBSCURED:-}
      DOCS_SYNC_INTERVAL: ${DOCS_SYNC_INTERVAL:-300}
      DOCS_SYNC_OFFSET: ${DOCS_SYNC_OFFSET:-100}
      DOCS_SYNC_INCLUDE_SMLOUVY: ${DOCS_SYNC_INCLUDE_SMLOUVY:-}
      DOCS_SYNC_INCLUDE_DOKUMENTY: ${DOCS_SYNC_INCLUDE_DOKUMENTY:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # Heslo: obfuskované se vezme rovnou, čitelné se obfuskuje tady.
        if [ -n "$${NEXTCLOUD_APP_PASSWORD_OBSCURED:-}" ]; then
          RCLONE_CONFIG_NC_PASS="$${NEXTCLOUD_APP_PASSWORD_OBSCURED}"
        elif [ -n "$${NEXTCLOUD_APP_PASSWORD:-}" ]; then
          RCLONE_CONFIG_NC_PASS="$$(rclone obscure "$${NEXTCLOUD_APP_PASSWORD}")"
        else
          RCLONE_CONFIG_NC_PASS=""
        fi
        export RCLONE_CONFIG_NC_PASS
        if [ -z "$${RCLONE_CONFIG_NC_URL:-}" ] || [ -z "$${RCLONE_CONFIG_NC_PASS:-}" ]; then
          echo "[docs-sync] NEXTCLOUD_URL/HESLO prazdne — lane VYPNUTA (ne chyba)."
          echo "[docs-sync] Deklarace zdroju: <fork>-instance-data/sources/nextcloud-*.json"
          trap 'exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        # Vlastni retry smycka, NE exec: vypadek Nextcloudu nesmi zabit PID 1
        # (RestartCount by vyšplhal a Coolify restart-limit shodi celou appku).
        trap 'echo "[docs-sync] TERM — koncim"; exit 0' TERM INT
        while :; do
          for lane in SMLOUVY DOKUMENTY; do
            eval "pat=\$$DOCS_SYNC_INCLUDE_$$lane"
            if [ -z "$${pat:-}" ]; then
              echo "[docs-sync] $$lane — zadne vzory (generator je nedodal), preskakuji"
              continue
            fi
            printf '%s\n' "$$pat" | tr ',' '\n' > /tmp/$$lane.filter
            echo "[docs-sync] $$lane — start"
            rclone copy "nc:" /docs --filter-from /tmp/$$lane.filter \
              --update --use-server-modtime --transfers 4 --checkers 8 \
              --log-level NOTICE 2>&1 | tail -5 || echo "[docs-sync] $$lane selhal — dalsi cyklus to zkusi znovu"
            [ "$$lane" = SMLOUVY ] && { sleep "$${DOCS_SYNC_OFFSET}" & wait "$$!" || true; }
          done
          sleep "$${DOCS_SYNC_INTERVAL}" & wait "$$!" || true
        done
    volumes:
      # Pojmenovaný svazek v TÉMŽE compose (sdílí ho local-ingest níž) — ne hostitelská
      # cesta z `${VAR}`: Coolify 4.3.16 z holého `${VAR}` udělá tiše pojmenovaný svazek
      # `<uuid>_<slug>` bez ohledu na hodnotu (sourceIsLocal, naměřeno 2026-09-28).
      - ingest-docs:/docs
    healthcheck:
      disable: true
    networks:
      - internal
  money-sync:
    image: ${IMAGE_NODE:-node:22-alpine}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-local-ingest--money-sync
    restart: unless-stopped
    depends_on:
      input-init:
        condition: service_completed_successfully
    environment:
      SVC_MONEY_URL: ${SVC_MONEY_URL:-http://svc-money:3016}
      SVC_MONEY_API_TOKEN: ${SVC_MONEY_API_TOKEN:-}
      MONEY_SYNC_ZDROJE: ${MONEY_SYNC_ZDROJE:-}
      MONEY_SYNC_INTERVAL: ${MONEY_SYNC_INTERVAL:-1800}
      MONEY_SYNC_STRANA: ${MONEY_SYNC_STRANA:-250}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${MONEY_SYNC_ZDROJE:-}" ] || [ -z "$${SVC_MONEY_API_TOKEN:-}" ]; then
          echo "[money-sync] MONEY_SYNC_ZDROJE/TOKEN prazdne — lane VYPNUTA (ne chyba)."
          trap 'exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        cat > /tmp/sync.mjs <<'MJS'
        import { mkdirSync, writeFileSync, readFileSync, existsSync } from 'node:fs';
        const URL_ = process.env.SVC_MONEY_URL, TOK = process.env.SVC_MONEY_API_TOKEN;
        const ZDROJE = JSON.parse(process.env.MONEY_SYNC_ZDROJE);
        const STRANA = Number.parseInt(process.env.MONEY_SYNC_STRANA, 10);
        const OUT = '/input/money', STAV = '/input/.money-sync-stav.json';
        mkdirSync(OUT, { recursive: true });
        const stav = existsSync(STAV) ? JSON.parse(readFileSync(STAV, 'utf8')) : {};
        async function dotaz(agenda, query, pokusu = 4) {
          let posledni;
          for (let i = 1; i <= pokusu; i++) {
            try {
              const r = await fetch(`$${URL_}/query`, { method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOK },
                body: JSON.stringify({ agenda, query }), signal: AbortSignal.timeout(240000) });
              const t = await r.text();
              if (!r.ok) throw new Error(`$${r.status} $${t.slice(0,120)}`);
              const j = JSON.parse(t);
              if (j.errors?.length) throw new Error(JSON.stringify(j.errors).slice(0,160));
              return j.data;
            } catch (e) { posledni = e; if (i < pokusu) await new Promise(r => setTimeout(r, 4000 * i)); }
          }
          throw posledni;
        }
        for (const z of ZDROJE) {
          const od = stav[z.agenda]?.zmenaOd;
          const filtr = od ? `, ChangeFrom: "$${od}"` : '';
          let ulozeno = 0, offset = 0, chyba = null;
          try {
            for (;;) {
              const d = await dotaz(z.agenda, `{ $${z.entita}(From:$${offset}, Count:$${STRANA}$${filtr}) { $${z.pole} } }`);
              const radky = d?.[z.entita] ?? [];
              if (!radky.length) break;
              for (const r of radky) {
                const jmeno = String(r.CisloDokladu || r.ID).replace(/[^A-Za-z0-9._-]/g, '-');
                writeFileSync(`$${OUT}/$${z.agenda}-$${jmeno}.json`, JSON.stringify({ ...r, _marker: z.marker }));
                ulozeno++;
              }
              offset += radky.length;
              if (radky.length < STRANA) break;
            }
            // Kurzor se posouvá JEN po úspěchu celé agendy — jinak by se
            // přeskočily doklady z běhu, který spadl v půlce.
            stav[z.agenda] = { zmenaOd: new Date().toISOString().slice(0, 10), ulozeno };
          } catch (e) { chyba = e.message; }
          console.log(`[money-sync] $${z.agenda}: $${ulozeno} $${chyba ? 'CHYBA ' + chyba.slice(0,90) : 'ok'}`);
        }
        writeFileSync(STAV, JSON.stringify(stav, null, 1));
        MJS
        trap 'echo "[money-sync] TERM — koncim"; exit 0' TERM INT
        while :; do
          node /tmp/sync.mjs 2>&1 | tail -8 || echo "[money-sync] beh selhal — dalsi cyklus to zkusi znovu"
          sleep "$${MONEY_SYNC_INTERVAL}" & wait "$$!" || true
        done
    volumes:
      - ingest-input:/input
    healthcheck:
      disable: true
    networks:
      - internal

  local-ingest:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    build:
      context: .
      dockerfile: Dockerfile.local-ingest
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-local-ingest
    restart: unless-stopped
    depends_on:
      pki-init:
        condition: service_completed_successfully
      input-init:
        condition: service_completed_successfully
    environment:
      - AISHA_INGEST_TOKEN=${INGEST_TOKEN}
      - AISHA_INGEST_ALLOWED_HOSTS=${INGEST_ALLOWED_HOSTS}
      - INGEST_WATCH=${INGEST_WATCH:-60}
      - INGEST_WORKERS=${INGEST_WORKERS:-4}
      - AISHA_EXPORT_PUSH_URL=${AISHA_EXPORT_PUSH_URL:-}
      - AISHA_EXPORT_PUSH_TOKEN=${AISHA_EXPORT_PUSH_TOKEN:-}
      - BUNDLE_GIT_URL=${INGEST_BUNDLE_GIT_URL:-}
      - BUNDLE_GIT_PATH=${INGEST_BUNDLE_GIT_PATH:-}
      - BUNDLE_GIT_REF=${INGEST_BUNDLE_GIT_REF:-}
      - BUNDLE_GIT_SYNC=${INGEST_BUNDLE_GIT_SYNC:-1}
      - REQUESTS_CA_BUNDLE=/certs/pki/aisha-ca-bundle.pem
      - SSL_CERT_FILE=/certs/pki/aisha-ca-bundle.pem
    volumes:
      - pki-certs:/certs/pki:ro
      - ingest-bundle:/bundle
      - ingest-input:/data/input
      - ingest-docs:/data/input/dokumenty:ro
      - ingest-out:/data/out
    expose:
      - "8765"
    cpus: 2.0
    mem_limit: 4g
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-Ingest-Token: $$AISHA_INGEST_TOKEN\" http://127.0.0.1:8765/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
    networks:
      internal:
        aliases: ["svc-local-ingest", "${APP_NAME_PREFIX:?identita instance}-svc-local-ingest"]
      mesh-dns: {}
    labels:
      - "coolify.managed=true"

  netbird-agent:
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-local-ingest--netbird
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        echo "[netbird-agent] Bridge mode — own netns, no host daemon conflict."
        echo "[netbird-agent] DNS proxy disabled — local-ingest receives inbound mesh only."
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        # Retry loop, NOT exec: a mesh/PKI outage must not kill PID 1 (would climb
        # RestartCount → Coolify restart-limit StopApplication kills the whole app).
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited — retry in 15s; container stays UP (never trips Coolify restart-limit)."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    volumes:
      - netbird-local-ingest-data-v3:/etc/netbird
      - netbird-local-ingest-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_EXPERIMENTAL}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: experimental-local-ingest
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    expose:
      - "8765"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-local-ingest

  local-ingest-mesh-ingress:
    profiles: ["mesh"]
    image: ${IMAGE_CADDY}
    environment:
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-local-ingest--mesh-ingress
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
    command:
      - sh
      - -c
      - |
        # ⛔ NAMĚŘENO 2026-09-01: Caddy bez `trusted_proxies` příchozímu
        # `x-forwarded-for` NEDŮVĚŘUJE a přepíše ho adresou souseda. HAProxy na
        # pfSense hlavičku nastavuje autoritativně (`del-header` + `set-header
        # X-Forwarded-For %[src]`), takže klientská adresa k nám dorazí — a náš
        # skok ji zahodil. Seznam je TÝŽ, jaký dostává gateway; nedoručený se
        # hlásí NAHLAS a Caddyfile se staví bez něj (prázdný `static` by Caddy
        # neustartoval).
        : > /etc/caddy/Caddyfile
        if [ -n "$${GATEWAY_TRUSTED_PROXIES:-}" ]; then
          printf '{\n  servers {\n    trusted_proxies static %s\n  }\n}\n\n' \
            "$$(echo "$${GATEWAY_TRUSTED_PROXIES}" | tr ',' ' ')" > /etc/caddy/Caddyfile
        else
          echo "[caddy] GATEWAY_TRUSTED_PROXIES NEDORUČEN — x-forwarded-for bude PŘEPSÁN"
        fi
        cat >> /etc/caddy/Caddyfile <<'CADDY'
        :8765 {
          handle /__mesh_health {
            respond "ok" 200
          }
          handle {
            reverse_proxy http://svc-local-ingest:8765
          }
        }
        CADDY
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8765/__mesh_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  ingest-drop-push-netns:
    image: ${REGISTRY_PROXY}library/caddy:2.8.4-alpine
    profiles: ["mesh"]
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-ingest-drop-push-netns
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN"]
    security_opt: ["no-new-privileges:true"]
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    environment:
      MESH_ENABLED: ${MESH_ENABLED:?vydává topologický resolver}
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?vydává generate-secrets — rozsah peerů pro routu}
      NETBIRD_DNS_IP: ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # ⛔ VLOŽENO DOSLOVA z infra/mesh/mesh-client-route.sh — NEUPRAVUJ TADY.
        _mesh="$$(echo "$${MESH_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
        case "$$_mesh" in
          true|1|yes|on)
            if [ -z "$${NETBIRD_PEER_CIDR:-}" ] || [ -z "$${NETBIRD_DNS_IP:-}" ]; then
              echo "[mesh-route] FATAL: mesh je vyhlášená, ale chybí NETBIRD_PEER_CIDR nebo NETBIRD_DNS_IP." >&2
              exit 64
            fi
            if ip route replace "$${NETBIRD_PEER_CIDR}" via "$${NETBIRD_DNS_IP}" 2>&1; then
              echo "[mesh-route] routa $${NETBIRD_PEER_CIDR} → $${NETBIRD_DNS_IP} (mesh-router) postavena"
            else
              echo "[mesh-route] FATAL: routu do mesh nelze postavit — chybí NET_ADMIN, nebo služba není na síti mesh-dns." >&2
              echo "[mesh-route] NEDĚLEJ: nepokračuj bez routy — vnitřní jméno by se přeložilo wildcardem VEN." >&2
              exit 64
            fi
            ;;
          *)
            echo "[mesh-route] MESH_ENABLED=$${MESH_ENABLED:-<unset>} — routa do mesh se nestaví (veřejná lane)."
            ;;
        esac
        echo "[drop-push-netns] netns drží; ingest-drop-push v něm zrcadlí do MinIO přes mesh"
        trap 'echo "[drop-push-netns] TERM — konec"; exit 0' TERM INT
        # Trasu drží dál: kontejner je vlastníkem jmenného prostoru, který sdílí
        # ingest-drop-push. Po výpadku sítě se trasa obnoví v příští minutě.
        while :; do
          sleep 60
          case "$$_mesh" in
            true|1|yes|on) ip route replace "$${NETBIRD_PEER_CIDR}" via "$${NETBIRD_DNS_IP}" >/dev/null 2>&1 || echo "[mesh-route] obnova trasy selhala" >&2 ;;
          esac
        done
    healthcheck:
      test: ["CMD-SHELL", "case \"$$(echo $$MESH_ENABLED | tr A-Z a-z)\" in true|1|yes|on) ip route | grep -qF \"$$NETBIRD_PEER_CIDR\" ;; *) true ;; esac"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=false"
    networks:
      - internal
      - mesh-dns

  ingest-drop-push:
    image: ${IMAGE_RCLONE:?pin z config/image-versions.env}
    profiles: ["mesh"]
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-ingest-drop-push
    restart: unless-stopped
    network_mode: "service:ingest-drop-push-netns"
    depends_on:
      ingest-drop-push-netns:
        # `service_healthy` (riq): konzument nesmí startovat před trasou.
        # `restart: true` (upstream): restart držitele nechá konzumenta v mrtvém
        # netns jen s `lo` — musí jít s ním.
        condition: service_healthy
        restart: true
    environment:
      RCLONE_CONFIG_DROP_TYPE: s3
      RCLONE_CONFIG_DROP_PROVIDER: Minio
      RCLONE_CONFIG_DROP_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_DROP_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_DROP_ENDPOINT: ${MINIO_URL:?vydává derive-domains z katalogu (internal_endpoints minio)}
      RCLONE_CONFIG_DROP_ACCESS_KEY_ID: ${INGEST_DROP_ACCESS_KEY}
      RCLONE_CONFIG_DROP_SECRET_ACCESS_KEY: ${INGEST_DROP_SECRET_KEY}
      # Prefix je SDÍLENÁ KONSTANTA dopravy: push a pull si musí sáhnout na týž
      # řetězec. Proměnná by dovolila, aby se strany rozešly — a nikdo ji neplnil.
      INGEST_DROP_PREFIX: export
    volumes:
      - ingest-out:/drop:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # Remote `drop:` skládá rclone z RCLONE_CONFIG_DROP_* (žádný soubor s tajemstvím).
        if [ -z "$${RCLONE_CONFIG_DROP_ACCESS_KEY_ID:-}" ] || [ -z "$${RCLONE_CONFIG_DROP_SECRET_ACCESS_KEY:-}" ]; then
          echo "[drop-sync] FATAL: chybí scoped klíč k bucketu — doprava balíků by stála." >&2
          exit 64
        fi
        echo "[drop-sync] drop -> bucket (engine publikuje; jiný stroj než jádro, proto mesh adresa) (prefix: $${INGEST_DROP_PREFIX})"
        # ⛔ ÚPLNÝ PRŮCHOD, NE `--watch`. Balíček vzniká PŘESUNEM hotového adresáře
        # (staging → export, aby doprava nikdy neviděla rozepsaný balíček), jenže
        # inotify do přesunutého adresáře NEZANOŘÍ: hlídání událostí proto o souborech
        # uvnitř nikdy neuslyší. Naměřeno 2026-09-16 v produkci instance: balíček ležel
        # v /drop/export, bucket měl 0 objektů, a po restartu sidecaru ho úvodní úplný
        # průchod nahrál (40 objektů za 10 s). `--watch` navíc končil tiše při restartu
        # MinIO — obojí řeší týž tvar: průchod, otisk času, spánek.
        while :; do
          # `copy`, ne `sync`: jako `mc mirror` bez --remove nové a změněné nahraje, nic nemaže.
          # Nepřijatý klíč (uživatele zakládá storage-init jádra) je jen neúspěšné kolo.
          if rclone copy /drop/export drop:ingest-drop/$${INGEST_DROP_PREFIX} 2>&1; then
            date +%s > /tmp/last-sync   # otisk pro healthcheck: doprava se OZVALA, ne jen běží
          else
            echo "[drop-sync] průchod selhal (rc=$$?) — další za 60 s" >&2
          fi
          sleep 60
        done
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cat /tmp/last-sync) )) -lt 300 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=false"

volumes:
  # Dokumenty z Nextcloudu: plní docs-sync, čte local-ingest. Jméno z identity instance
  # (týž vzor jako ostatní svazky) — dvě instance na jednom stroji se nepotkají.
  ingest-docs:
    name: ${APP_NAME_PREFIX:?}_local-ingest-docs
  ingest-bundle:
    name: ${APP_NAME_PREFIX:?}_local-ingest-bundle
  ingest-input:
    name: ${APP_NAME_PREFIX:?}_local-ingest-input
  ingest-out:
    name: ${LOCAL_INGEST_OUT_VOLUME:?doručuje cold-start (env-doctor CONTRACT z APP_NAME_PREFIX = identita instance) — bez něj se drop lane nesmí tiše rozejít s druhou stranou}
  pki-certs:
    name: ${APP_NAME_PREFIX:?}_local-ingest-pki-certs
  netbird-local-ingest-data-v3:
    name: ${APP_NAME_PREFIX:?}_netbird-local-ingest-data
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  coolify:
    external: true
    name: coolify
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}