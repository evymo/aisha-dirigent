# Prose lives in docs/compose-notes/docker-compose.coolify.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
x-v2-common: &v2-common
  restart: unless-stopped
  networks:
    - internal

x-svc-common: &svc-common
  <<: *v2-common
  depends_on:
    db:
      condition: service_healthy
    postgrest:
      condition: service_started
  environment: &svc-env
    NODE_ENV: production
    POSTGREST_URL: http://${APP_NAME_PREFIX:?identita instance}-postgrest:3000
    KC_JWKS_URL: ${KEYCLOAK_INTERNAL_URL:?KEYCLOAK_INTERNAL_URL must be generated by topology resolver}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
    KC_ISSUER: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    REDIS_URL: redis://:${REDIS_PASSWORD}@${APP_NAME_PREFIX:?identita instance}-redis:6379

x-svc-healthcheck: &svc-healthcheck
  interval: 15s
  timeout: 5s
  start_period: 15s
  retries: 5

services:
  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:-true}
      PKI_BUNDLE_WAIT_S: ${PKI_BUNDLE_WAIT_S:-600}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  minio-init:
    build:
      context: docker/minio
      target: mc
      args:
        REGISTRY_PROXY: ${REGISTRY_PROXY:-}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["storage-init"]
    environment:
      STORAGE_ADMIN_URL: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@${APP_NAME_PREFIX:?identita instance}-minio:9000
      STORAGE_BUCKETS: >-
        archive-scans email-assets email-templates health-documents hero-images
        page-assets product-images wearable-analysis uploads-quarantine
        entity-evidence ingest-drop aisha-sbom-artifacts langfuse langfuse-media
        aisha-loki-chunks aisha-loki-ruler
      STORAGE_PUBLIC_READ: archive-scans email-assets product-images
      STORAGE_SCOPED_POLICY: ingest-drop-rw
      STORAGE_SCOPED_POLICY_JSON: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:ListenNotification","s3:ListenBucketNotification"],"Resource":["arn:aws:s3:::ingest-drop"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::ingest-drop/*"]}]}'
      STORAGE_SCOPED_USER: ${INGEST_DROP_ACCESS_KEY}
      STORAGE_SCOPED_SECRET: ${INGEST_DROP_SECRET_KEY}
    restart: "no"
    healthcheck:
      disable: true
    networks:
      - internal

  migrate:
    <<: *v2-common
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      AISHA_DB_URL: postgresql://aisha_admin:${POSTGRES_PASSWORD}@${APP_NAME_PREFIX:?identita instance}-db:5432/postgres
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:?migrate provisionuje operátory přes Keycloak VNITŘNĚ (http://<prefix>-keycloak:80) — bez ní by mířil na cizí instanci}
      DATABASE_URL: postgresql://aisha_admin:${POSTGRES_PASSWORD}@${APP_NAME_PREFIX:?identita instance}-db:5432/postgres
      NODE_EXTRA_CA_CERTS: /certs/pki/aisha-ca-bundle.pem
      AISHA_MIGRATE_DEBUG_HOLD: ${AISHA_MIGRATE_DEBUG_HOLD:-0}
      AISHA_DB_FORCE_BASELINE_RESET: ${AISHA_DB_FORCE_BASELINE_RESET:-0}
      AISHA_IMPLEMENTATION_HOOK: ${AISHA_IMPLEMENTATION_HOOK:-scripts/deploy/instance-data-hook.sh}
      AISHA_INSTANCE_DATA_GIT_URL: ${AISHA_INSTANCE_DATA_GIT_URL:-}
      AISHA_IMPLEMENTATION: ${AISHA_IMPLEMENTATION:-}
      AISHA_PRIMARY_ADMIN_EMAIL: ${AISHA_PRIMARY_ADMIN_EMAIL:-}
      AISHA_LLM_GATEWAY_URL: ${AISHA_LLM_GATEWAY_URL:-}
      VLLM_GENERATION_URL: ${VLLM_GENERATION_URL:-}
      AISHA_PKI_ISSUER_CLIENT_SECRET: "${AISHA_PKI_ISSUER_CLIENT_SECRET:?Set AISHA_PKI_ISSUER_CLIENT_SECRET in Coolify env (generated by cold-start)}"
    volumes:
      - pki-certs:/certs/pki:ro
    restart: "no"
    healthcheck:
      disable: true

  db:
    <<: *v2-common
    build: &pg_build
      context: infra/postgres
      args:
        PG_MAJOR: ${POSTGRES_MAJOR:?}
        REGISTRY_PROXY: ${REGISTRY_PROXY:-}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db
    expose:
      - "5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NOCODB_DB_PASSWORD: ${NOCODB_DB_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      NETBIRD_DB_PASSWORD: ${NETBIRD_DB_PASSWORD}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      COLUMN_ENCRYPTION_KEY: ${COLUMN_ENCRYPTION_KEY}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - pg-run:/var/run/postgresql
    # Klíče trezoru a sloupců: entrypoint-wrapper.sh je sem zapíše (0400, postgres)
    # a SQL helpery je čtou jako vlastník. tmpfs = nikdy na disk ani do zálohy.
    # Dřív GUC přes ALTER DATABASE/PGOPTIONS — četla je každá role (2026-09-25).
    tmpfs:
      - /run/aisha-keys:mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisha_admin -h 127.0.0.1 && test -f /tmp/.db-passwords-ready"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-db
  pgbackrest:
    <<: *v2-common
    build: *pg_build
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-pgbackrest
    user: postgres
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - db-data:/var/lib/postgresql/data:ro
      - pgbackrest-repo:/var/lib/pgbackrest
      - pg-run:/var/run/postgresql
    entrypoint: ["/usr/local/bin/pgbackrest-backup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pgbackrest info >/dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

  postgrest:
    dns:
      - ${NETBIRD_DNS_IP:?generate-secrets}
    dns_search:
      - ${MESH_TLD:?generate-secrets}
    <<: *v2-common
    networks:
      mesh-dns: {}
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-postgrest
    build:
      context: .
      dockerfile: Dockerfile.postgrest
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-postgrest
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      PGRST_DB_URI: postgresql://authenticator:${POSTGRES_PASSWORD}@${APP_NAME_PREFIX:?identita instance}-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_OPENAPI_MODE: ${PGRST_OPENAPI_MODE:-disabled}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_POOL: ${PGRST_DB_POOL:-20}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_JWT_SECRET_IS_BASE64: "false"
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/ready"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    <<: *v2-common
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-redis
    image: ${REGISTRY_PROXY}library/redis:7-alpine
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: >-
      redis-server --appendonly yes
                   --maxmemory 512mb
                   --maxmemory-policy allkeys-lru
                   --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping|grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    <<: *v2-common
    build:
      context: docker/minio
      target: minio
      args:
        REGISTRY_PROXY: ${REGISTRY_PROXY:-}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-minio
    expose:
      - "9000"
      - "9001"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER_OLD: ${MINIO_ROOT_USER_OLD:-}
      MINIO_ROOT_PASSWORD_OLD: ${MINIO_ROOT_PASSWORD_OLD:-}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-minio

  imgproxy:
    <<: *v2-common
    image: ${REGISTRY_PROXY}darthsim/imgproxy:v3.8.0
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-imgproxy
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-imgproxy
      coolify:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-imgproxy
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_KEY: ${IMGPROXY_KEY:?Set IMGPROXY_KEY in Coolify env (generated by cold-start)}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_S3_ENDPOINT: http://${APP_NAME_PREFIX:?identita instance}-minio:9000
      AWS_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "imgproxy health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  gateway:
    dns:
      - ${NETBIRD_DNS_IP:?generate-secrets}
    dns_search:
      - ${MESH_TLD:?generate-secrets}
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-gateway
    expose:
      - "3001"
    # Mesh routa — viz compose-notes.
    cap_add: [NET_ADMIN]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ip route replace "$${NETBIRD_PEER_CIDR:?}" via "$${NETBIRD_DNS_IP:?}"
        echo "[mesh-route] $${NETBIRD_PEER_CIDR} via $${NETBIRD_DNS_IP}"
        exec su-exec node node dist/server.js
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?mesh}
      PORT: 3001
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CORS_ALLOWLIST: ${CORS_ALLOWLIST:-}
      POSTGREST_URL: http://${APP_NAME_PREFIX:?identita instance}-postgrest:3000
      KEYCLOAK_URL: ${KEYCLOAK_INTERNAL_URL:?topology}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      OIDC_CLIENT_ID: ${OIDC_APP_CLIENT_ID:?generate-secrets}
      OIDC_CLIENT_SECRET: ${KC_CLIENT_SECRET:-}
      KC_JWKS_URL: ${KEYCLOAK_INTERNAL_URL:?topology}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      KC_ISSUER: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}
      KC_ALLOWED_CLIENTS: ${KC_ALLOWED_CLIENTS:?složí ho aisha-env-doctor z deklarovaných OIDC klientů; chybí-li, je vada v DORUČENÍ}
      KC_TOKEN_URL: https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      KC_ADMIN_URL: ${KEYCLOAK_INTERNAL_URL:?topology}
      KC_REALM: ${KEYCLOAK_REALM}
      KC_CLIENT_ID: ${OIDC_APP_CLIENT_ID:?generate-secrets}
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET:-}
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID:?generate-secrets}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:?generuje generate-secrets — prázdné znamená selhaný push env, ne vypnutou funkci; gateway a Keycloak musí držet TUTÉŽ hodnotu}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INTRANET_API_KEY: ${INTRANET_API_KEY:?required}  # gateway /token-exchange; see generate-secrets.mjs
      # /internal/knock/roster — roster schválených tabletů pro dveře (vlastní token dvojice).
      KNOCK_ROSTER_TOKEN: ${KNOCK_ROSTER_TOKEN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@${APP_NAME_PREFIX:?identita instance}-redis:6379
      AISHA_SHARED_REDIS_URL: redis://core:${REDIS_PASSWORD_CORE}@${SHARED_REDIS_HOST:?required — derive-domains.mjs ho odvozuje ze SERVICE_ALIAS_PREFIX; coolify-sync-envs ho doručí}:6379
      SPA_DOOR_MODE: ${SPA_DOOR_MODE:-off}
      KNOCK_UPSTREAM: ${KNOCK_UPSTREAM:-}
      SPA_REDIS_DB: ${SPA_REDIS_DB:-4}
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:?odvozuje derive-subnets.mjs, doručuje coolify-sync-envs}
      JWT_SECRET: ${JWT_SECRET}
      ANON_KEY: ${ANON_KEY:?required}
      SOURCE_API_URL: ${SOURCE_API_URL:-}
      API_DOMAIN_PUBLIC: ${API_DOMAIN_PUBLIC:-}
      # Adresa frontendu pro návrat po přihlášení a jediný výchozí cíl redirect_to
      # (services/gateway/src/auth/presmerovani.ts). Bez ní trasy přihlášení odpoví 503.
      APP_DOMAIN: ${APP_DOMAIN:-}
      # Výslovné přepisy operátora (prázdné = odvodit z domén výš). Bez řádku tady by
      # hodnota z env aplikace do kontejneru vůbec nedošla.
      FRONTEND_URL: ${FRONTEND_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:-}
      GATEWAY_DOMAIN_PUBLIC: ${GATEWAY_DOMAIN_PUBLIC:-}
      GATEWAY_URL: http://${APP_NAME_PREFIX:?identita instance}-gateway:3001
      STRIPE_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-stripe:3010
      SVC_AI_CHAT_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-ai-chat:3011
      PUSH_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-push:3012
      BLOCKCHAIN_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-blockchain:3013
      FIO_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-fio-bank:3014
      HA_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-homeassistant:3015
      GITHUB_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-github-app:3016
      SVC_MCP_KNOWLEDGE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-mcp-knowledge:3017
      HEALTH_AI_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-health-ai:3024
      LIVEKIT_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-livekit:3025
      SVC_MATRIX_URL: http://${APP_NAME_PREFIX:?identita instance — jméno na sdílené síti ji MUSÍ nést}-svc-matrix:3026
      MATRIX_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance — jméno na sdílené síti ji MUSÍ nést}-svc-matrix:3026
      COMMS_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-communications:3027
      PACKETA_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-packeta:3028
      PLUGIN_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-plugin-system:3029
      WEB_ARTIFACT_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-web-artifact:3030
      STORAGE_AUTH_URL: ${STORAGE_AUTH_URL:?vydává derive-domains z katalogu (internal_endpoints.env_aliases), doručuje coolify-sync-envs}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RAGNAROK_URL: ${RAGNAROK_URL:-}
      RAGNAROK_API_KEY: ${RAGNAROK_API_KEY:?required}
      MCP_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-mcp-knowledge:3017
      AI_CHAT_SERVICE_URL: http://${APP_NAME_PREFIX:?identita instance}-svc-ai-chat:3011
      COOLIFY_API_KEY: ${COOLIFY_API_KEY:-}
      COOLIFY_BASE_URL: ${COOLIFY_BASE_URL:-}
      FORGEJO_URL: ${FORGEJO_URL:-}
      FORGEJO_TOKEN: ${FORGEJO_TOKEN:-}
      FORGEJO_REPO: ${FORGEJO_REPO:-}
      NODE_EXTRA_CA_CERTS: /certs/pki/aisha-ca-bundle.pem
    volumes:
      - pki-certs:/certs/pki:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\" || exit 1"
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      mesh-dns: {}
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-gateway
      coolify:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-gateway
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"

  web:
    dns:
      - ${NETBIRD_DNS_IP:?generate-secrets}
    dns_search:
      - ${MESH_TLD:?generate-secrets}
    <<: *v2-common
    build:
      context: .
      dockerfile: Dockerfile.web
      secrets:
        - sentry_auth_token
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-web
    expose:
      - "80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    networks:
      mesh-dns: {}
      internal: {}
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"

  plugin-publish-init:
    build:
      context: .
      dockerfile: Dockerfile.plugin-publish-init
    container_name: ${APP_NAME_PREFIX:?identita instance}-plugin-publish-init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      S3_ENDPOINT: http://${APP_NAME_PREFIX:?identita instance}-minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      S3_PLUGIN_BUCKET: ${S3_PLUGIN_BUCKET:-plugins}
      AISHA_POSTGREST_URL: http://${APP_NAME_PREFIX:?identita instance}-postgrest:3000
      POSTGREST_SERVICE_TOKEN: ${POSTGREST_SERVICE_TOKEN:?publikuje se servisní rolí}
    command: ["/usr/local/bin/publish-plugins.sh"]
    healthcheck:
      disable: true
    networks:
      - internal

  svc-plugin-system:
    dns:
      - ${NETBIRD_DNS_IP:?generate-secrets}
    dns_search:
      - ${MESH_TLD:?generate-secrets}
    <<: *v2-common
    cap_add: [NET_ADMIN]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ip route replace "$${NETBIRD_PEER_CIDR:?}" via "$${NETBIRD_DNS_IP:?}"
        echo "[mesh-route] $${NETBIRD_PEER_CIDR} via $${NETBIRD_DNS_IP}"
        exec su-exec node node dist/server.js
    build:
      context: .
      dockerfile: Dockerfile.svc-plugin-system
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-plugin-system
    expose:
      - "3029"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *svc-env
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?mesh}
      PORT: 3029
      S3_ENDPOINT: http://${APP_NAME_PREFIX:?identita instance}-minio:9000
      AGENT_RUNNER_URL: ${AGENT_RUNNER_URL:-}
      AGENT_RUNNER_ENABLED: ${AGENT_RUNNER_ENABLED:-true}
      BROKER_TOKEN_SECRET: ${BROKER_TOKEN_SECRET:?required}
      PLUGIN_NETWORK_ALLOWLIST: ${PLUGIN_NETWORK_ALLOWLIST:-}
      PLUGIN_RPC_WHITELIST: ${PLUGIN_RPC_WHITELIST:-}
      NODE_EXTRA_CA_CERTS: /certs/pki/aisha-ca-bundle.pem
    volumes:
      - pki-certs:/certs/pki:ro
    healthcheck:
      <<: *svc-healthcheck
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:3029/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\" || exit 1"
      start_period: 30s
    networks:
      mesh-dns: {}
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-plugin-system
    labels:
      - "coolify.managed=true"

  svc-mcp-knowledge:
