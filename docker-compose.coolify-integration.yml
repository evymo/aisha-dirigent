# Prose lives in docs/compose-notes/docker-compose.coolify-integration.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
x-common: &common
  restart: unless-stopped
  networks:
    - internal
    - mesh-dns

services:
  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-integration--pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:-true}
      PKI_BUNDLE_WAIT_S: ${PKI_BUNDLE_WAIT_S:-600}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  elasticsearch:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *common
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-integration--elasticsearch
    cpus: ${INTEGRATION_ES_CPUS:-2.0}
    mem_limit: ${INTEGRATION_ES_MEM:-3g}
    environment:
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      discovery.type: "single-node"
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9200/ | grep -qE '^(200|401)$'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    expose:
      - "9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-elasticsearch
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-elasticsearch

  ragnarok:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.ragnarok
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-integration--ragnarok
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      RAGNAROK_CONTAINER_PORT: "9696"
      RAGNAROK_LOG_LEVEL: "info"
      RAGNAROK_API_KEY: ${RAGNAROK_API_KEY:?RAGNAROK_API_KEY is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      MAESTRO_API_KEY: ${MAESTRO_API_KEY:?MAESTRO_API_KEY is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      DEPLOYMENT: "production"
      ES_URL: "http://${APP_NAME_PREFIX:?identita instance}-elasticsearch:9200"
      ES_USER: "elastic"
      ES_PASSWORD: ${ELASTIC_PASSWORD}
      ES_INDEX_EMBEDDINGS: "aisha-kb"
      ES_INDEX_HIGHLIGHT_CHUNKS: "aisha-highlight-chunks"
      ES_MAX_VECTOR_DIM: "2048"
      ES_LOGGING_ENABLED: "false"
      DEFAULT_PROVIDER_LLM: ${INSIGHT_LLM_PROVIDER:-OpenAI}
      DEFAULT_MODEL_LLM: ${INSIGHT_LLM_MODEL:-gpt-4o-mini}
      DEFAULT_BASE_URL_LLM: ${INSIGHT_LLM_BASE_URL:-}
      DEFAULT_PROVIDER_EMB: ${INSIGHT_EMB_PROVIDER:-OpenAI}
      DEFAULT_MODEL_EMB: ${INSIGHT_EMB_MODEL:-text-embedding-3-small}
      DEFAULT_BASE_URL_EMB: ${INSIGHT_EMB_BASE_URL:-}
      OPENAI_KEY: ${AISHA_LLM_GATEWAY_KEY:?Set AISHA_LLM_GATEWAY_KEY in Coolify env (generated by cold-start)}
      OPENAI_TYPE: "${INSIGHT_OPENAI_TYPE:-OpenAI}"
      OPENAI_ENDPOINT: ${INSIGHT_OPENAI_ENDPOINT:?INSIGHT_OPENAI_ENDPOINT must be delivered by cold-start env — the shared-network alias is instance-scoped}
      COHERE_KEY: ${COHERE_API_KEY:-}
      DEFAULT_PROVIDER_RERANK: ${INSIGHT_RERANK_PROVIDER:-Cohere}
      KRONOS_API_KEY: "not-integrated-aisha-rpc-replaces-it"
      MONGO_CONN_STR: "mongodb://not-integrated:27017"
      MINIO_SECRET_KEY: "not-integrated-aisha-shared-storage"
      PACKAGE_REGISTRY_TOKEN: "not-used-in-self-hosted"
      CONTEXT_ENABLED: "false"
    # Bez host portu — do meshe přes sidecar agenta (compose-notes: „bez host portů").
    expose:
      - "9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-integration--ragnarok
          - ${APP_NAME_PREFIX:?identita instance}-ragnarok
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-integration--ragnarok
          - ${APP_NAME_PREFIX:?identita instance}-ragnarok

  aisha-kronos-shim:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *common
    cap_add: [NET_ADMIN]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ip route replace "$${NETBIRD_PEER_CIDR:?}" via "$${NETBIRD_DNS_IP:?}"
        echo "[mesh-route] $${NETBIRD_PEER_CIDR} via $${NETBIRD_DNS_IP}"
        exec su-exec node node dist/server.js
    build:
      context: .
      dockerfile: Dockerfile.svc-aisha-kronos-shim
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-integration--kronos-shim
    depends_on:
      ragnarok:
        condition: service_healthy
    environment:
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?mesh}
      PORT: "9625"
      LOG_LEVEL: "info"
      KRONOS_API_KEY: ${KRONOS_API_KEY}
      RAGNAROK_URL: "http://${APP_NAME_PREFIX:?identita instance}-ragnarok:9696"
      RAGNAROK_API_KEY: ${RAGNAROK_API_KEY:?RAGNAROK_API_KEY is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      POSTGREST_URL: ${POSTGREST_URL:?doručuje derivace topologie, prázdná hodnota vyrobí volani nikam}
      # ⛔ ZÁMĚRNĚ BEZ `:?` (naměřeno 2026-08-24). Stráž tady tajemství přesune do
      # BUILD-TIME množiny (compose bez něj neprojde), a tam se zapeče do
      # `docker history` — přesně to hlídá rohatka `build-time-mnozina-vsech-compose`
      # (61 → 62 při pokusu stráž přidat). Chybějící hodnotu odmítne KÓD:
      # `requireEnv('POSTGREST_SERVICE_TOKEN')` selže při startu, aniž by secret
      # vtáhl do buildu. Stráž v compose patří adresám, ne tajemstvím.
      POSTGREST_SERVICE_TOKEN: ${POSTGREST_SERVICE_TOKEN}
      INSIGHT_DEFAULT_LANG: ${INSIGHT_DEFAULT_LANG:-cs-CZ}
    expose:
      - "9625"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9625/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-aisha-kronos-shim
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-aisha-kronos-shim

  maestro:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.maestro
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-integration--maestro
    # ⛔ ALIAS S IDENTITOU (2026-08-21): cíl mesh trasy se skládá jako
    # `<prefix>-<služba>`, ale Coolify `container_name` PŘEPISUJE — nosný je
    # ALIAS. Bez něj trasa míří na jméno, které neexistuje, a ingress vrací 502,
    # přestože mesh sama je průchozí. Sítě dědí kotva; tohle k nim přidá jméno.
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-integration--maestro
          - ${APP_NAME_PREFIX:?identita instance}-maestro
      coolify:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-integration--maestro
          - ${APP_NAME_PREFIX:?identita instance}-maestro
    depends_on:
      elasticsearch:
        condition: service_healthy
      aisha-kronos-shim:
        condition: service_healthy
    environment:
      MAESTRO_CONTAINER_PORT: "8020"
      MAESTRO_LOG_LEVEL: "info"
      MAESTRO_API_KEY: ${MAESTRO_API_KEY}
      DEPLOYMENT: "production"
      ES_URL: "http://${APP_NAME_PREFIX:?identita instance}-elasticsearch:9200"
      ES_USER: "elastic"
      ES_PASSWORD: ${ELASTIC_PASSWORD}
      ES_INDEX_EMBEDDINGS: "aisha-kb"
      ES_INDEX_HIGHLIGHT_CHUNKS: "aisha-highlight-chunks"
      ES_INDEX_LOGS: "aisha-insight-logs"
      ES_MAX_VECTOR_DIM: "2048"
      ES_LOGGING_ENABLED: "false"
      RAGNAROK_URL: "http://${APP_NAME_PREFIX:?identita instance}-ragnarok:9696"
      RAGNAROK_API_KEY: ${RAGNAROK_API_KEY:?RAGNAROK_API_KEY is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      DEFAULT_PROVIDER_LLM: ${INSIGHT_LLM_PROVIDER:-OpenAI}
      DEFAULT_MODEL_LLM: ${INSIGHT_LLM_MODEL:-gpt-4o-mini}
      DEFAULT_BASE_URL_LLM: ${INSIGHT_LLM_BASE_URL:-}
      DEFAULT_PROVIDER_EMB: ${INSIGHT_EMB_PROVIDER:-OpenAI}
      DEFAULT_MODEL_EMB: ${INSIGHT_EMB_MODEL:-text-embedding-3-small}
      DEFAULT_BASE_URL_EMB: ${INSIGHT_EMB_BASE_URL:-}
      OPENAI_KEY: ${AISHA_LLM_GATEWAY_KEY:?Set AISHA_LLM_GATEWAY_KEY in Coolify env (generated by cold-start)}
      OPENAI_TYPE: "${INSIGHT_OPENAI_TYPE:-OpenAI}"
      OPENAI_ENDPOINT: ${INSIGHT_OPENAI_ENDPOINT:?INSIGHT_OPENAI_ENDPOINT must be delivered by cold-start env — the shared-network alias is instance-scoped}
      COHERE_KEY: ${COHERE_API_KEY:-}
      DEFAULT_PROVIDER_RERANK: ${INSIGHT_RERANK_PROVIDER:-Cohere}
      CONTEXT_ENABLED: "true"
      CONTEXT_WINDOW_SIZE: "10"
      KRONOS_URL: "http://${APP_NAME_PREFIX:?identita instance}-aisha-kronos-shim:9625"
      KRONOS_API_KEY: ${KRONOS_API_KEY}
      MONGO_CONN_STR: "mongodb://not-integrated:27017"
      MINIO_SECRET_KEY: "not-integrated-aisha-shared-storage"
      PACKAGE_REGISTRY_TOKEN: "not-used-in-self-hosted"
    # Bez host portu — do meshe přes sidecar agenta (compose-notes: „bez host portů").
    expose:
      - "8020"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8020/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  rabbitmq:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *common
    image: ${REGISTRY_PROXY}library/rabbitmq:3.13-management-alpine
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-integration--rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be delivered by cold-start env (generate-secrets)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # Bez host portu — do meshe přes sidecar agenta (compose-notes: „bez host portů").
    # AMQP (TCP) rozvádí integration-mesh-tcp; alias níž je cíl jeho trasy.
    expose:
      - "5672"
      - "15672"
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-integration--rabbitmq
      mesh-dns: {}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  netbird-agent:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-integration--netbird
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    volumes:
      - netbird-backend-data-v3:/etc/netbird
      - netbird-backend-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        # Retry loop, NOT exec: a mesh/PKI outage must not kill the container (would
        # climb RestartCount → Coolify restart-limit StopApplication kills the app).
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited (mesh unreachable / TLS not ready) — retry in 15s; container stays UP."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_INTEGRATION}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: backend-integration
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-maestro

  integration-mesh-ingress:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_CADDY}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-model--mesh-ingress
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
    environment:
      INTEGRATION_MESH_INGRESS_ROUTES: ${INTEGRATION_MESH_INGRESS_ROUTES:-}
      # TÝŽ seznam, jaký dostává gateway — jeden zdroj (`lib/derive-subnets.mjs`).
      # Bez něj Caddy `x-forwarded-for` přepíše a klientská adresa se ztratí.
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$${INTEGRATION_MESH_INGRESS_ROUTES:-}" ]; then
          echo "[mesh-ingress] INTEGRATION_MESH_INGRESS_ROUTES prázdné — derivace nic nevydala nebo se nedoručila."
          echo "[mesh-ingress] Naslouchám jen na health, aby bylo VIDĚT, že tabulka chybí."
          # ⛔ STAV BEZ TABULKY MUSÍ BÝT VIDĚT SONDĚ (naměřeno 2026-09-03).
          # Záložní Caddyfile poslouchal na :8000, ale healthcheck sonduje :8020 —
          # port této služby. Sonda tedy dostala „connection refused" místo
          # navrženého 503 „bez směrovací tabulky", a diagnóza vedla k „zavřený
          # port" místo ke skutečné příčině. Neshoda byla v 15 z 16 stacků;
          # jediný, kde porty seděly, byl `model`, jehož vlastní port JE 8000 —
          # vzor se trefil sám sebou a vada byla ze zdroje neviditelná.
          printf ':8020 {\n  handle /__mesh_health {\n    respond "no-routes" 503\n  }\n  handle {\n    respond "mesh-ingress bez směrovací tabulky" 503\n  }\n}\n' > /etc/caddy/Caddyfile
        else
          : > /etc/caddy/Caddyfile
          # ⛔ NAMĚŘENO 2026-08-31: brána viděla `x-forwarded-for` s JEDINÝM
          # prvkem — adresou svého souseda (mesh-router edge). To je podpis
          # NAHRAZENÍ, ne řetězu: Caddy bez `trusted_proxies` příchozí hlavičce
          # nedůvěřuje a přepíše ji tím, kdo se právě připojil. Každý náš skok
          # tak řetěz zahodil a klientská adresa se ke dveřím NEDOSTALA —
          # `enforce` by zamkl i majitele.
          #
          # Hodnota se NEOPISUJE: je to TÝŽ seznam, jaký dostává gateway
          # (`lib/derive-subnets.mjs` → GATEWAY_TRUSTED_PROXIES). Dva tvary
          # (čárky pro env, mezery pro Caddy), jeden zdroj — kdyby si je každý
          # skládal sám, chůze zprava by v každém prvku končila jinde.
          if [ -n "$${GATEWAY_TRUSTED_PROXIES:-}" ]; then
            printf '{\n  servers {\n    trusted_proxies static %s\n  }\n}\n\n' \
              "$$(echo "$${GATEWAY_TRUSTED_PROXIES}" | tr ',' ' ')" >> /etc/caddy/Caddyfile
          else
            # Nedoručený seznam se NEDOSAZUJE. Bez něj Caddy řetěz přepíše —
            # to je vada, ale TICHÁ; tady se aspoň řekne nahlas.
            echo "[mesh-ingress] GATEWAY_TRUSTED_PROXIES nedoručen — x-forwarded-for bude PŘEPSÁN, klientská adresa se ztratí"
          fi
          PORTS=$$(echo "$${INTEGRATION_MESH_INGRESS_ROUTES}" | tr ';' '\n' | cut -d'|' -f1 | sort -un)
          for P in $$PORTS; do
            printf ':%s {\n  handle /__mesh_health {\n    respond "ok" 200\n  }\n' "$$P" >> /etc/caddy/Caddyfile
            echo "$${INTEGRATION_MESH_INGRESS_ROUTES}" | tr ';' '\n' | while IFS='|' read -r RP RH RT; do
              [ "$$RP" = "$$P" ] || continue
              M=$$(echo "$$RH" | cut -d, -f1 | cut -d. -f1 | tr '-' '_')
              HOSTS=$$(echo "$$RH" | tr ',' ' ')
              printf '  @%s host %s\n  handle @%s {\n    reverse_proxy http://%s\n  }\n' "$$M" "$$HOSTS" "$$M" "$$RT" >> /etc/caddy/Caddyfile
            done
            printf '  handle {\n    respond "mesh-ingress: Host nepatri na tento port" 421\n  }\n}\n' >> /etc/caddy/Caddyfile
          done
          echo "[mesh-ingress] tabulka: $$(echo "$${INTEGRATION_MESH_INGRESS_ROUTES}" | tr ';' '\n' | wc -l) tras na $$(echo "$$PORTS" | wc -w) portech"
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8020/__mesh_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # TCP přes mesh (vzor clamav-mesh-tcp): katalog internal_tcp_endpoints → derivace
  # → INTEGRATION_MESH_TCP_ROUTES. proxy_pass se řeší při startu → čeká na rabbitmq.
  integration-mesh-tcp:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: "${IMAGE_NGINX}"
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-integration--mesh-tcp
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      INTEGRATION_MESH_TCP_ROUTES: "${INTEGRATION_MESH_TCP_ROUTES:-}"
    # Měří to, co je úkolem sidecaru: že PORT Z TABULKY skutečně přijímá spojení.
    # Prázdná tabulka → prázdný port → unhealthy, a to je SPRÁVNĚ.
    healthcheck:
      test:
        - CMD-SHELL
        - p=$$(printf '%s' "$$INTEGRATION_MESH_TCP_ROUTES" | cut -d';' -f1 | cut -d'|' -f1); [ -n "$$p" ] && nc -z 127.0.0.1 "$$p" || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - sh
      - -c
      - |
        set -eu
        CFG=/tmp/mesh-tcp.conf
        if [ -z "$${INTEGRATION_MESH_TCP_ROUTES:-}" ]; then
          echo "[mesh-tcp] INTEGRATION_MESH_TCP_ROUTES prazdne - derivace nic nevydala nebo se nedorucila." >&2
          echo "[mesh-tcp] NENASLOUCHAM na zadnem portu. Connection refused je VIDITELNY stav;" >&2
          echo "[mesh-tcp] naslouchajici port bez cile by vypadal jako funkcni mesh." >&2
          trap 'exit 0' TERM INT
          while :; do sleep 3600 & wait $$!; done
        fi
        {
          echo "events {}"
          echo "stream {"
          OLDIFS=$$IFS; IFS=";"
          for r in $${INTEGRATION_MESH_TCP_ROUTES}; do
            IFS=$$OLDIFS
            port=$${r%%|*}; target=$${r#*|}
            [ -n "$$port" ] && [ -n "$$target" ] || { IFS=";"; continue; }
            echo "  server { listen $$port; proxy_pass $$target; }"
            IFS=";"
          done
          IFS=$$OLDIFS
          echo "}"
        } > "$$CFG"
        echo "[mesh-tcp] tabulka: $${INTEGRATION_MESH_TCP_ROUTES}"
        nginx -t -c "$$CFG"
        exec nginx -g "daemon off;" -c "$$CFG"

volumes:
  pki-certs:
    driver: local
    name: ${APP_NAME_PREFIX:?}_integration-pki-certs
  es-data:
    driver: local
  rabbitmq-data:
    driver: local
  netbird-backend-data-v3:
    driver: local
    name: ${APP_NAME_PREFIX:?}_netbird-backend-data
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  coolify:
    external: true
    name: coolify
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}