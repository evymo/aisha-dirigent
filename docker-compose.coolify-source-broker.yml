# Prose lives in docs/compose-notes/docker-compose.coolify-source-broker.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
x-aisha-povinne-za-behu: [FEDERATION_VAULT_KEY]
services:
  svc-source-broker:
    cap_add: [NET_ADMIN]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ip route replace "$${NETBIRD_PEER_CIDR:?}" via "$${NETBIRD_DNS_IP:?}"
        echo "[mesh-route] $${NETBIRD_PEER_CIDR} via $${NETBIRD_DNS_IP}"
        exec su-exec node node dist/server.js
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-source-broker
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    build:
      context: .
      dockerfile: Dockerfile.svc-source-broker
      args:
        SOURCE_ADAPTER_OVERLAY_GIT_URL: ${SOURCE_ADAPTER_OVERLAY_GIT_URL:-}
        SOURCE_ADAPTER_OVERLAY_REF: ${SOURCE_ADAPTER_OVERLAY_REF:-}
        SOURCE_ADAPTER_OVERLAY_CACHEBUST: ${SOURCE_ADAPTER_OVERLAY_CACHEBUST:-}
      secrets:
        - git_token
    restart: unless-stopped
    environment:
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?mesh}
      CORS_ALLOWLIST: ${CORS_ALLOWLIST:-}
      PORT: "8090"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      POSTGRES_URL: "${AISHA_DB_URL}"
      POSTGREST_URL: "${POSTGREST_URL:?POSTGREST_URL must be generated by topology resolver}"
      POSTGREST_SERVICE_TOKEN: "${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY}"
      AISHA_JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET (= PGRST_JWT_SECRET)}"

      AISHA_GATEWAY_URL: "${AISHA_GATEWAY_URL:?AISHA_GATEWAY_URL must be generated by topology resolver}"
      INTRANET_API_KEY: "${INTRANET_API_KEY:?set INTRANET_API_KEY — generate-secrets emits it; gateway + broker share it for /token-exchange}"

      KEYCLOAK_URL: "${KEYCLOAK_INTERNAL_URL:?KEYCLOAK_INTERNAL_URL must be generated by topology resolver}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:?KEYCLOAK_REALM must be delivered by cold-start env — the realm constant lives in keycloak/aisha-realm.json}"
      OIDC_APP_CLIENT_ID: "${OIDC_APP_CLIENT_ID:?OIDC_APP_CLIENT_ID — the instance web client; requireUser pins aud/azp to it (no default)}"
      KC_ISSUER: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}

      SOURCE_API_URL: "${SOURCE_API_URL:-}"
      SOURCE_PG_URL: "${SOURCE_PG_URL:-}"
      SOURCE_WEBHOOK_HMAC_SECRET: "${SOURCE_WEBHOOK_HMAC_SECRET:?set SOURCE_WEBHOOK_HMAC_SECRET — cold-start generates it; empty means the env sync failed}"
      FEDERATION_VAULT_KEY: "${FEDERATION_VAULT_KEY}"

      SOURCE_ADAPTER_PLUGIN_ENTRY: "${SOURCE_ADAPTER_PLUGIN_ENTRY:-}"
      SOURCE_ADAPTER_STORY_ID: "${SOURCE_ADAPTER_STORY_ID:-}"

      SOURCE_AUTH_HANDSHAKE_OUT: "${SOURCE_AUTH_HANDSHAKE_OUT:-}"
      SOURCE_AUTH_HANDSHAKE_IN: "${SOURCE_AUTH_HANDSHAKE_IN:-}"

      LOCAL_INGEST_DROP_DIR: "${LOCAL_INGEST_DROP_DIR:-/data/ingest-drop}"
      LOCAL_INGEST_INTERVAL_MS: "${LOCAL_INGEST_INTERVAL_MS:-300000}"

      INGEST_API_URL: "${INGEST_API_URL:-}"
      INGEST_API_TOKEN: "${INGEST_TOKEN}"
      SVC_MONEY_URL: "${SVC_MONEY_URL:-}"
      SVC_MONEY_API_TOKEN: "${SVC_MONEY_API_TOKEN}"
    volumes:
      - ingest-drop:/data/ingest-drop:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    expose:
      - "8090"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
    networks:
      coolify:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-source-broker
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-source-broker
      internal: {}

  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-source-broker--pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:?odvozuje cold-start z manifestu; bez něj pki-init trvá na bundlu i bez PKI}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - mesh-dns

  netbird-agent:
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-source-broker--netbird
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        echo "[netbird-agent] Bridge mode — own netns, no host daemon conflict."
        echo "[netbird-agent] DNS proxy disabled — source-broker receives inbound mesh only."
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited — retry in 15s; container stays UP (never trips Coolify restart-limit)."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    volumes:
      - netbird-source-broker-data-v3:/etc/netbird
      - netbird-source-broker-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_BACKEND}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: backend-source-broker
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
    networks:
      - mesh-dns

  source-broker-mesh-ingress:
    profiles: ["mesh"]
    image: ${IMAGE_CADDY}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-model--mesh-ingress
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
    environment:
      SOURCE_BROKER_MESH_INGRESS_ROUTES: ${SOURCE_BROKER_MESH_INGRESS_ROUTES:-}
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$${SOURCE_BROKER_MESH_INGRESS_ROUTES:-}" ]; then
          echo "[mesh-ingress] SOURCE_BROKER_MESH_INGRESS_ROUTES prázdné — derivace nic nevydala nebo se nedoručila."
          echo "[mesh-ingress] Naslouchám jen na health, aby bylo VIDĚT, že tabulka chybí."
          # ⛔ STAV BEZ TABULKY MUSÍ BÝT VIDĚT SONDĚ (naměřeno 2026-09-03).
          # Záložní Caddyfile poslouchal na :8000, ale healthcheck sonduje :8090 —
          # port této služby. Sonda tedy dostala „connection refused" místo
          # navrženého 503 „bez směrovací tabulky", a diagnóza vedla k „zavřený
          # port" místo ke skutečné příčině. Neshoda byla v 15 z 16 stacků;
          # jediný, kde porty seděly, byl `model`, jehož vlastní port JE 8000 —
          # vzor se trefil sám sebou a vada byla ze zdroje neviditelná.
          printf ':8090 {\n  handle /__mesh_health {\n    respond "no-routes" 503\n  }\n  handle {\n    respond "mesh-ingress bez směrovací tabulky" 503\n  }\n}\n' > /etc/caddy/Caddyfile
        else
          : > /etc/caddy/Caddyfile
          # ⛔ NAMĚŘENO 2026-08-31: brána viděla `x-forwarded-for` s JEDINÝM
          # prvkem — adresou svého souseda (mesh-router edge). To je podpis
          # NAHRAZENÍ, ne řetězu: Caddy bez `trusted_proxies` příchozí hlavičce
          # nedůvěřuje a přepíše ji tím, kdo se právě připojil. Každý náš skok
          # tak řetěz zahodil a klientská adresa se ke dveřím NEDOSTALA —
          # `enforce` by zamkl i majitele.
          #
          # Hodnota se NEOPISUJE: je to TÝŽ seznam, jaký dostává gateway
          # (`lib/derive-subnets.mjs` → GATEWAY_TRUSTED_PROXIES). Dva tvary
          # (čárky pro env, mezery pro Caddy), jeden zdroj — kdyby si je každý
          # skládal sám, chůze zprava by v každém prvku končila jinde.
          if [ -n "$${GATEWAY_TRUSTED_PROXIES:-}" ]; then
            printf '{\n  servers {\n    trusted_proxies static %s\n  }\n}\n\n' \
              "$$(echo "$${GATEWAY_TRUSTED_PROXIES}" | tr ',' ' ')" >> /etc/caddy/Caddyfile
          else
            # Nedoručený seznam se NEDOSAZUJE. Bez něj Caddy řetěz přepíše —
            # to je vada, ale TICHÁ; tady se aspoň řekne nahlas.
            echo "[mesh-ingress] GATEWAY_TRUSTED_PROXIES nedoručen — x-forwarded-for bude PŘEPSÁN, klientská adresa se ztratí"
          fi
          PORTS=$$(echo "$${SOURCE_BROKER_MESH_INGRESS_ROUTES}" | tr ';' '\n' | cut -d'|' -f1 | sort -un)
          for P in $$PORTS; do
            printf ':%s {\n  handle /__mesh_health {\n    respond "ok" 200\n  }\n' "$$P" >> /etc/caddy/Caddyfile
            echo "$${SOURCE_BROKER_MESH_INGRESS_ROUTES}" | tr ';' '\n' | while IFS='|' read -r RP RH RT; do
              [ "$$RP" = "$$P" ] || continue
              M=$$(echo "$$RH" | cut -d, -f1 | cut -d. -f1 | tr '-' '_')
              HOSTS=$$(echo "$$RH" | tr ',' ' ')
              printf '  @%s host %s\n  handle @%s {\n    reverse_proxy http://%s\n  }\n' "$$M" "$$HOSTS" "$$M" "$$RT" >> /etc/caddy/Caddyfile
            done
            printf '  handle {\n    respond "mesh-ingress: Host nepatri na tento port" 421\n  }\n}\n' >> /etc/caddy/Caddyfile
          done
          echo "[mesh-ingress] tabulka: $$(echo "$${SOURCE_BROKER_MESH_INGRESS_ROUTES}" | tr ';' '\n' | wc -l) tras na $$(echo "$$PORTS" | wc -w) portech"
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/__mesh_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  ingest-drop-pull:
    image: ${IMAGE_RCLONE:?pin z config/image-versions.env}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-ingest-drop-pull
    restart: unless-stopped
    environment:
      RCLONE_CONFIG_DROP_TYPE: s3
      RCLONE_CONFIG_DROP_PROVIDER: Minio
      RCLONE_CONFIG_DROP_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_DROP_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_DROP_ENDPOINT: http://${APP_NAME_PREFIX:?identita instance}-minio:9000
      RCLONE_CONFIG_DROP_ACCESS_KEY_ID: ${INGEST_DROP_ACCESS_KEY}
      RCLONE_CONFIG_DROP_SECRET_ACCESS_KEY: ${INGEST_DROP_SECRET_KEY}
      # Prefix je SDÍLENÁ KONSTANTA dopravy: push a pull si musí sáhnout na týž
      # řetězec. Proměnná by dovolila, aby se strany rozešly — a nikdo ji neplnil.
      INGEST_DROP_PREFIX: export
    volumes:
      - ingest-drop:/drop
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # Remote `drop:` skládá rclone z RCLONE_CONFIG_DROP_* (žádný soubor s tajemstvím).
        if [ -z "$${RCLONE_CONFIG_DROP_ACCESS_KEY_ID:-}" ] || [ -z "$${RCLONE_CONFIG_DROP_SECRET_ACCESS_KEY:-}" ]; then
          echo "[drop-sync] FATAL: chybí scoped klíč k bucketu — doprava balíků by stála." >&2
          exit 64
        fi
        echo "[drop-sync] bucket -> drop (broker konzumuje; oba jsou placement=backend, tedy ko-lokovaní s minio) (prefix: $${INGEST_DROP_PREFIX})"
        # ⛔ ÚPLNÝ PRŮCHOD, NE `--watch`. Balíček vzniká PŘESUNEM hotového adresáře
        # (staging → export, aby doprava nikdy neviděla rozepsaný balíček), jenže
        # inotify do přesunutého adresáře NEZANOŘÍ: hlídání událostí proto o souborech
        # uvnitř nikdy neuslyší. Naměřeno 2026-09-16 v produkci instance: balíček ležel
        # v /drop/export, bucket měl 0 objektů, a po restartu sidecaru ho úvodní úplný
        # průchod nahrál (40 objektů za 10 s). `--watch` navíc končil tiše při restartu
        # MinIO — obojí řeší týž tvar: průchod, otisk času, spánek.
        rm -f /tmp/drop-sync.ok
        while :; do
          # Kolo je jednorázové s horní mezí a běží pořád znovu: storage-init jádra
          # zakládá uživatele až po startu, takže nepřijatý klíč je jen neúspěšné kolo.
          # `--watch` (mc) uměl viset na `unexpected EOF` a proces žil dál, aniž by
          # cokoli přenášel (naměřeno ve forku: 5 dní). Sonda proto měří POSLEDNÍ
          # DORUČENÍ, ne proces. Práh sondy (420 s) MUSÍ být > sleep 60 + timeout 300
          # (nejdelší zdravá mezera dvou doručení): jinak dlouhé kolo vyjde jako unhealthy.
          # `copy`, ne `sync`: jako `mc mirror` bez --remove stáhne nové a změněné, nic nemaže.
          # ⛔ PRÁZDNÝ ZDROJ NENÍ PORUCHA (naměřeno 2026-09-20 na jedné instanci forku: do bucketu
          # ještě nikdo nenahrál, prefix neexistoval, `mc mirror` končil rc=1 a sonda držela appku
          # 29 h jako unhealthy). rclone to rozliší sám — naměřeno 2026-09-25 proti MinIO
          # z docker/minio: neexistující prefix v EXISTUJÍCÍM bucketu → rc=0 (doručeno nic,
          # značka se zapíše); neexistující bucket rc=3, nedostupný endpoint i špatný klíč rc=1
          # → kolo selže a hlásí se. Proto žádné rozlišování podle textu výstupu jako u mc.
          if timeout 300 rclone copy drop:ingest-drop/$${INGEST_DROP_PREFIX} /drop 2>&1; then
            printf '%s\n' "$$(date +%s)" > /tmp/drop-sync.ok
          else
            echo "[drop-sync] zrcadlení selhalo (rc=$$?) — nový pokus za 60 s"
          fi
          sleep 60
        done
    healthcheck:
      test: ["CMD-SHELL", "read -r t < /tmp/drop-sync.ok && [ $$(( $$(date +%s) - t )) -lt 420 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=false"
    networks:
      - internal

volumes:
  ingest-drop:
    name: ${APP_NAME_PREFIX:?}_ingest-drop
  pki-certs:
    name: ${APP_NAME_PREFIX:?}_source-broker-pki-certs
  netbird-source-broker-data-v3:
    name: ${APP_NAME_PREFIX:?}_netbird-source-broker-data
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  coolify:
    external: true
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}
secrets:
  git_token:
    environment: GIT_TOKEN
