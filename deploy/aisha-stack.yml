version: "3"

# ── Connectors ──────────────────────────────────────────────────────────────
connectors:
  default: coolify
  coolify:
    # API base URL — set via COOLIFY_API env var (or COOLIFY_URL + /api/v1)
    # Operator's deployment-specific value; not committed.
    api: ${COOLIFY_API}
    # COOLIFY_API_TOKEN read from .env-prod-backup or env var
  ssh:
    # ssh_host can be overridden per app via apps.<name>.ssh_host
    host: ${AISHA_SSH_HOST}
  local:
    compose_file: docker-compose.local.yml

# ── Servers (Coolify hosts) ─────────────────────────────────────────────────
servers:
  frontend:
    role: edge
  backend:
    role: backend
  experimental:
    role: exec

# ── Logical groups (for selective deploy) ───────────────────────────────────
groups:
  frontend  : [edge, admin]
  infra     : [netbird, pki, ledger]
  core      : [core]
  auth      : [keycloak]
  services  : [orchestration, messaging, integration, exec]
  data      : [observability]

# ── Canonical deploy order (topological — auth/infra first) ─────────────────
deploy_order:
  - keycloak
  - core
  - admin
  - edge
  - exec
  - integration
  - ledger
  - messaging
  - netbird
  - observability
  - orchestration
  - pki

