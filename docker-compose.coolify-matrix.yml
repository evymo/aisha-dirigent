    <<: *bridge-common
    profiles: ["bridge-email"]
    image: ${IMAGE_POSTMOOGLE}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-bridge-email
    environment:
      POSTMOOGLE_HOMESERVER: http://${APP_NAME_PREFIX:?identita instance}-synapse:8008
      POSTMOOGLE_DOMAIN: ${SYNAPSE_SERVER_NAME}
      POSTMOOGLE_PORT: "2525"
      POSTMOOGLE_LOGIN: emailbot
      POSTMOOGLE_DB_DSN: postgres://synapse_user:${SYNAPSE_DB_PASSWORD}@${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db:5432/synapse_bridge_email?sslmode=disable
      POSTMOOGLE_DB_DIALECT: postgres
      POSTMOOGLE_AS_TOKEN: ${AISHA_AS_TOKEN}_postmoogle
      POSTMOOGLE_HS_TOKEN: ${AISHA_HS_TOKEN}_postmoogle
      POSTMOOGLE_LOGLEVEL: warn
    ports:
