# =============================================================================
# PostgreSQL Custom Configuration (major verze = POSTGRES_MAJOR instance)
# =============================================================================
# Tuned for AISHA / Evymo production workload (Phase 12 WP 1.2).
# Klíče šifrování NEJSOU GUC: soubory v /run/aisha-keys (entrypoint-wrapper.sh).
#
# CHANGE WAVES (per Phase 12 WP 1.2 — apply in order, both safe):
#   Wave A (restart required): shared_buffers, wal_compression,
#                              max_parallel_workers_per_gather
#   Wave B (reload-only):       effective_cache_size, work_mem,
#                               maintenance_work_mem, random_page_cost,
#                               effective_io_concurrency
#
# Apply Wave A during off-peak maintenance window (~30 s downtime via
# `docker compose restart db` in Coolify). Apply Wave B with zero downtime:
#   docker exec -i aisha-db psql -U postgres -c 'SELECT pg_reload_conf();'
#
# Pre-flight: verify last `pg_basebackup` (or Coolify backup) succeeded
# < 24 h before any restart. Rollback: revert this file + restart.
#
# HNSW per-query knobs (NOT in this file — set per RPC via SET LOCAL):
#   SET LOCAL hnsw.ef_search = 80;  -- tune in mcp_search_knowledge_v*
# =============================================================================

# Connection
listen_addresses = '*'
port = 5432
# max_connections — NAMĚŘENO, ne odhadnuto.
#
# Původních 200 předpokládalo pgbouncer (WP 1.3) před PG, který PostgRESTu
# multiplexoval pool na pár fyzických spojení. Když je PostgREST zapojený
# PŘÍMO (dnešní stav), poptávka po fyzických spojeních vyskočí:
#
#   PostgREST pool (PGRST_DB_POOL)      až 100 (instance si ho zvedá)
#   Gateway pool                            10
#   Per-service Fastify backendy (×14)     120
#   n8n                                    ~10
#   migrate kontejner při deployi           ~5
#   pgAdmin                                 ~3
#   ─────────────────────────────────────────
#   ustálený stav                         ~248
#
# K tomu nárazová špička při bootstrapu: čerstvá záložka SPA vystřelí ~7–10
# paralelních RPC (branding, kurzy, jazyky, systémová konfigurace, filtry
# archivu, veřejné statistiky, stránka podle slugu, hero slides…) a každé drží
# spojení, dokud mu PostgREST nepřidělí pool. Víc záložek špičku násobí.
# Při 200 stačilo otevřít tři záložky rychle za sebou a PG se převrátil →
# PGRST000 / 503 / 500 na čtvrtině bootstrapových RPC, navenek rozbité první
# vykreslení (kostra bez textu značky). Reprodukováno na nasazené instanci.
#
# 500 = ~248 ustálený stav + 200 rezerva na špičku + 50 bezpečnostní polštář.
# Paměť to neomezuje: idle backend stojí ~10 MB → 500 × 10 MB = 5 GB nejhorší
# případ, vejde se vedle shared_buffers.
#
# Platí dál mainovo pravidlo: součet per-service poolů musí zůstat POD tímhle
# číslem. Až se PostgREST vrátí za pooler (transakční režim srazí 100 fyzických
# na ~10), může jít zpátky na 200 — do té doby je 500 provozně bezpečné číslo.
max_connections = 500

# ─── Memory ────────────────────────────────────────────────────────────────
# Wave A (restart):
shared_buffers = 2GB             # 25 % of 8GB RAM — was 256MB
# Wave B (reload):
effective_cache_size = 6GB       # 75 % of 8GB RAM — was 768MB
work_mem = 32MB                  # per sort/hash — was 4MB (pgvector HNSW search needs headroom)
maintenance_work_mem = 512MB     # VACUUM, CREATE INDEX — was 64MB

# ─── SSD-aware planner ──────────────────────────────────────────────────────
# Wave B (reload):
random_page_cost = 1.1           # SSD — was default 4.0 (HDD-era)
effective_io_concurrency = 200   # SSD parallel reads — was 1

# ─── Parallelism ───────────────────────────────────────────────────────────
# Wave A (restart):
max_parallel_workers_per_gather = 4   # was default 2

# ─── WAL ───────────────────────────────────────────────────────────────────
# Wave A (restart for compression):
wal_compression = zstd           # smaller WAL, faster replication — was off
wal_level = replica
max_wal_senders = 3
wal_keep_size = 256MB

# ─── Continuous WAL archiving / PITR (DB-03) ─────────────────────────────────
# archive_mode ships every completed WAL segment to the pgBackRest repo (stanza
# `aisha`, defined in infra/postgres/pgbackrest.conf, baked into this image). Together
# with the periodic base backups the `pgbackrest` sidecar takes (see
# docker-compose.coolify.yml) this makes the cluster replayable to an arbitrary
# point in time — Coolify's scheduled pg_dump is last-snapshot only, NOT PITR.
# archive_mode is a Wave-A (restart-required) GUC; it takes effect on the next
# `db` container start. A failing archive_command (e.g. before stanza-create runs)
# does not block writes — postgres retains the WAL in pg_wal and retries.
archive_mode = on
archive_command = 'pgbackrest --stanza=aisha archive-push %p'

# ─── Logging + audit ───────────────────────────────────────────────────────
log_min_messages = warning
log_min_error_statement = error
log_timezone = 'UTC'
timezone = 'UTC'

# auto_explain — log query plans for slow queries (extension loaded via migration)
# Wave B (reload, after extension):
auto_explain.log_min_duration = '1s'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_format = 'text'

# pg_audit — DDL + role-change audit trail at the PG kernel level.
# Defense-in-depth alongside the app-level audit_journal table:
#   - audit_journal: HIPAA-compliant app-level audit (PHI access events,
#     consent capture, supplement plan changes — written by SECURITY DEFINER
#     RPCs via write_audit_journal helper).
#   - pgaudit: kernel-level DDL + role-grant audit (CREATE/ALTER/DROP
#     statements + role grants) — catches anything an attacker with DB
#     credentials could do that bypasses app-level audit.
# Wave B (reload, after extension):
pgaudit.log = 'ddl, role'
pgaudit.log_catalog = off       # suppress noisy pg_catalog reads

# shared_preload_libraries — must be in postgresql.conf for extensions
# loaded at server start. RESTART required when modified.
# Wave A (restart): pg_stat_statements, auto_explain, pgaudit
# pgaudit binary is apt-installed by infra/postgres/Dockerfile (postgresql-$PG_MAJOR-pgaudit
# package; upstream PR #163 fixed the apt key refresh that previously blocked it).
shared_preload_libraries = 'pg_stat_statements,auto_explain,pgaudit'

# pg_stat_statements config
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

# ─── Locale ────────────────────────────────────────────────────────────────
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

