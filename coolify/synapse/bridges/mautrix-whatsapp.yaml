# =============================================================================
# mautrix-whatsapp Bridge Configuration — Evymo Production
# =============================================================================
# Docs: https://docs.mau.fi/bridges/go/whatsapp/
# =============================================================================

homeserver:
  address: http://synapse:8008
  domain: ${MATRIX_DOMAIN}

appservice:
  address: http://mautrix-whatsapp:29318
  hostname: 0.0.0.0
  port: 29318
  database:
    type: postgres
    uri: postgres://synapse_user:${SYNAPSE_DB_PASSWORD}@${APP_NAME_PREFIX}-db:5432/synapse_bridge_whatsapp?sslmode=disable
  id: whatsapp
  as_token: ${AISHA_AS_TOKEN}_whatsapp
  hs_token: ${AISHA_HS_TOKEN}_whatsapp
  bot:
    username: whatsappbot
    displayname: WhatsApp Bridge Bot
    avatar: mxc://maunium.net/NeXNQarUbrlYBiPCpprYsRqr

bridge:
  permissions:
    "*": relay
    "${MATRIX_DOMAIN}": user
    "@admin:${MATRIX_DOMAIN}": admin
  relay:
    enabled: true
  command_prefix: "!wa"
  history_sync:
    create_portals: true
  double_puppet_allow_discovery: true

logging:
  min_level: warn
  writers:
    - type: stdout
      format: json
