      SVC_PUSH_PORT: "3012"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      GCP_WORKLOAD_IDENTITY_AUDIENCE: ${GCP_WORKLOAD_IDENTITY_AUDIENCE:-}
      GCP_SERVICE_ACCOUNT_EMAIL: ${GCP_SERVICE_ACCOUNT_EMAIL:-}
      GCP_FEDERATION_TOKEN_URL: ${GCP_FEDERATION_TOKEN_URL:-}
      GCP_FEDERATION_CLIENT_ID: ${GCP_FEDERATION_CLIENT_ID:-}
      GCP_FEDERATION_CLIENT_SECRET: ${GCP_FEDERATION_CLIENT_SECRET:-}
      # Most WEB_PUSH_VAPID_* (linka) → VAPID_* (svc-push); jedna úroveň, žádné
      # vnoření. Výklad: docs/compose-notes/docker-compose.coolify-domain-services.yml.md
      VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT}
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3012/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\" || exit 1"]
    networks:
      internal:
        aliases: ["${APP_NAME_PREFIX:?identita instance}-svc-push", "svc-push"]
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-push

