# AISHA account console theme
# ---------------------------------------------------------------------------
# The realm (keycloak/aisha-realm.json) sets accountTheme=aisha, but until now
# the aisha theme only shipped login/ + email/ variants — no account/ — so
# Keycloak logged "Failed to find ACCOUNT theme aisha, using built-in themes"
# and the account console SPA failed to initialise (HTTP 401 after login).
#
# Keycloak 26's account console is the React "v3" app; custom account themes
# inherit it via parent=keycloak.v3 and layer branding on top. Inheriting keeps
# the modern, functional console while making accountTheme=aisha resolve.
#
# Branding assets (logo, fonts, colours) are shared with the login theme under
# ../login/resources/img/aisha-logo.svg; extend here with a styles= override
# when the v3 console's CSS hooks are wired up.
parent=keycloak.v3
locales=en,cs
