# =============================================================================
# Coturn TURN/STUN Server Configuration — Evymo Production
# =============================================================================
# Docs: https://github.com/coturn/coturn/wiki/turnserver
#
# Static long-term credentials for TURN auth.
# Environment variables TURN_USERNAME, TURN_PASSWORD and TURN_REALM are set
# in docker-compose.coolify-livekit.yml.
# =============================================================================

# Listening ports
listening-port=3478
tls-listening-port=5349

# Relay port range (must match docker-compose port mapping)
min-port=49152
max-port=49200

# Realm (domain for TURN)
realm=${TURN_REALM}

# Use long-term credential mechanism with static user/password
lt-cred-mech
# LiveKit TURN credentials
user=${TURN_USERNAME}:${TURN_PASSWORD}
# NetBird TURN credentials (separate user, same realm)
# Set NETBIRD_TURN_USERNAME and NETBIRD_TURN_PASSWORD in Coolify env.
user=${NETBIRD_TURN_USERNAME}:${NETBIRD_TURN_PASSWORD}

# Logging
log-file=stdout
verbose

# Security: prevent relay to private networks
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Performance
total-quota=100
stale-nonce=600

# Fingerprint for STUN compatibility
fingerprint

# No CLI (reduce attack surface)
no-cli
