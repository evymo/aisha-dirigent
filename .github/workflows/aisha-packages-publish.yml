# =============================================================================
# AISHA packages auto-publish to Verdaccio
# =============================================================================
# When a push to main touches packages/*, this workflow rebuilds + republishes
# every publishable @aisha/* package whose workspace version is ahead of the
# Verdaccio registry. Closes the "stale Verdaccio publish" gap that caused PR
# #73's svc-plugin-system test failure (Verdaccio had @aisha/security 0.1.1
# without constantTimeStringCompare while packages/security/src/ already had
# it).
#
# Idempotent: the script (scripts/aisha-packages-publish.mjs) compares each
# workspace package.json version against the latest published version and
# skips any package that's already up-to-date — re-running this workflow is
# safe and is, in fact, what enables it to act as a "catchup" mechanism after
# manual edits.
#
# Triggers:
#   - push to main when packages/** changes
#   - manual via workflow_dispatch (operator can force a publish sweep)
#
# Required secrets:
#   VERDACCIO_TOKEN   JWT with publish scope for @aisha/* on npm.id3a.cz
# =============================================================================

name: AISHA Packages Publish

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      # Re-run if the publish runner itself changes (so a bug fix in the runner
      # picks up packages that should have already been published but weren't).
      - 'scripts/aisha-packages-publish.mjs'
      - '.github/workflows/aisha-packages-publish.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no publish)'
        required: false
        type: boolean
        default: false
      force:
        # CVE response path: when a stuck workflow run leaves Verdaccio
        # in a half-published state and a normal re-trigger would skip
        # ("version unchanged" — but the registry wasn't actually
        # updated), operator can dispatch with force=true. The runner
        # ignores the registry-version check and republishes every
        # publishable package whose workspace pkg.json declares it.
        # Use case: scripts/aisha-packages-publish.mjs already supports
        # FORCE=1 — this input plumbs it through workflow_dispatch.
        # NOTE: this is NOT a merge bypass — security fixes still flow
        # through PR review per feedback_pr_workflow_no_force. force=true
        # only short-circuits the version-skip optimization. See
        # docs/security/CVE_RESPONSE_RUNBOOK.md for the canonical flow.
        description: 'Force republish (ignore version-unchanged skip) — CVE recovery'
        required: false
        type: boolean
        default: false

concurrency:
  # Only one publish sweep runs at a time. A second push to main while one is
  # mid-flight is queued; we never publish the same version twice (the script
  # skips by version) but serializing avoids races on the registry index.
  group: aisha-packages-publish
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  VERDACCIO_URL: ${{ vars.VERDACCIO_URL }}

jobs:
  publish:
    name: Publish @aisha/* to Verdaccio
    # Publisher of record: ONLY the SoT repo of the packages publishes @aisha/*.
    # Forks inherit this workflow (and its push-to-main trigger) but must never
    # write to the shared registry — two writers race for the same names, and a
    # fork-side build could shadow the upstream artefact. Measured on the riq
    # fork 2026-07-27: three consecutive main pushes red on this job over a
    # version bump born in a fork merge commit. Identity is pinned by full repo
    # name, so the guard also blocks workflow_dispatch on forks (intended —
    # owner decision: forks never publish, not even manually).
    if: github.repository == 'aisha/evymo-ai-orchestrator'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Single commit is enough — we don't compare diffs ourselves;
          # the script asks Verdaccio for current version.
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.VERDACCIO_URL }}
          # NPM_CONFIG_TOKEN is read by `npm publish` for the configured registry.
          # We export it from the VERDACCIO_TOKEN secret below.

      - name: Configure registry auth (mint fresh token if credentials present)
        id: auth
        # Sets a registry-scoped auth token in ~/.npmrc before publish, so auth
        # lives in the runner env, not in source. PREFERS minting a fresh token
        # from VERDACCIO_USER + VERDACCIO_PASSWORD: Verdaccio signs API tokens
        # with `jwt.sign.expiresIn: 30d`, so a static VERDACCIO_TOKEN secret
        # silently EXPIRES and breaks every publish (incident 2026-06-13). The
        # mint (scripts/verdaccio-mint-token.mjs, zero deps) uses the web-login
        # endpoint, which authenticates existing htpasswd users even under
        # `max_users: -1`. Falls back to the static VERDACCIO_TOKEN secret.
        env:
          VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
          VERDACCIO_USER: ${{ secrets.VERDACCIO_USER }}
          VERDACCIO_PASSWORD: ${{ secrets.VERDACCIO_PASSWORD }}
        run: |
          # VERDACCIO_URL comes from the vars.VERDACCIO_URL Actions VARIABLE (env
          # block at job top). Fail fast with an actionable message if unset.
          if [ -z "$VERDACCIO_URL" ]; then
            echo "::error::vars.VERDACCIO_URL Actions variable is not set — set it at the org level (aisha) so all publish/CI workflows resolve the Verdaccio registry. Cannot publish."
            exit 1
          fi
          # Prefer a freshly-minted token (no 30-day expiry drift).
          if [ -n "$VERDACCIO_USER" ] && [ -n "$VERDACCIO_PASSWORD" ]; then
            if FRESH="$(node scripts/verdaccio-mint-token.mjs --check 2>/dev/null)" && [ -n "$FRESH" ]; then
              VERDACCIO_TOKEN="$FRESH"
              echo "Minted fresh Verdaccio token (user=$VERDACCIO_USER) — no 30-day expiry drift"
            else
              echo "::warning::Verdaccio token mint failed; falling back to static VERDACCIO_TOKEN secret"
            fi
          fi
          # No credentials = THIS CHECKOUT IS NOT THE PUBLISHER, which is the
          # normal state of a fork: the shared registry is published from the
          # upstream repository, and a fork publishes only if it configures a
          # registry of its OWN (set VERDACCIO_USER+VERDACCIO_PASSWORD, or
          # VERDACCIO_TOKEN, on that fork). Measured 2026-07-29: upstream holds
          # VERDACCIO_TOKEN, the fork holds none — so on the fork this job
          # red-failed on EVERY packages/** push forever, for doing exactly what
          # it should do, which is nothing.
          #
          # Skipped, not failed — but LOUDLY (warning + audit line), because the
          # gap this workflow exists to close is a SILENT stale registry. On the
          # publisher the credential is present, so a lost token still fails the
          # publish itself; what is tolerated here is only "this repo does not
          # publish", never "this repo failed to publish".
          if [ -z "$VERDACCIO_TOKEN" ]; then
            echo "::warning title=publish skipped::No Verdaccio credentials in this repository — not the publisher, skipping. This is expected on a fork; the shared registry is published from upstream. To publish from here, set VERDACCIO_USER+VERDACCIO_PASSWORD (preferred, auto-refresh) or VERDACCIO_TOKEN on THIS repository."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          # Write the registry-specific token to the user-level .npmrc so npm
          # picks it up regardless of the runner's working directory at publish.
          VERDACCIO_HOST="${VERDACCIO_URL#https://}"; VERDACCIO_HOST="${VERDACCIO_HOST%/}"
          echo "//${VERDACCIO_HOST}/:_authToken=${VERDACCIO_TOKEN}" >> ~/.npmrc
          # Route the @aisha scope to Verdaccio even if a sub-package has a
          # registry-less .npmrc nearby.
          echo "@aisha:registry=${VERDACCIO_URL}" >> ~/.npmrc
          # Catch-all so generic dep installs still work.
          echo "registry=${VERDACCIO_URL}" >> ~/.npmrc

      - name: Install root dependencies
        if: steps.auth.outputs.publish == 'true'
        # The publish script itself has zero runtime deps (only stdlib), but
        # each package's build (typescript) needs its own node_modules. Build
        # dependencies are installed by `npm publish`'s prepublishOnly hook
        # OR explicitly when we run `npm run build`. Doing a root install up
        # front guarantees workspaces / linked deps resolve.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Install per-package build dependencies
        if: steps.auth.outputs.publish == 'true'
        # Each publishable @aisha/* package needs its devDependencies installed
        # so its `npm run build` works inside aisha-packages-publish.mjs. We
        # walk the dirs sequentially because they're independent.
        run: |
          for d in packages/*/; do
            if [ -f "$d/package.json" ] && [ ! -d "$d/node_modules" ]; then
              echo "→ install $d"
              (cd "$d" && npm ci --ignore-scripts --no-audit --no-fund) || \
                (cd "$d" && npm install --ignore-scripts --no-audit --no-fund)
            fi
          done

      - name: Publish (dry run or live)
        if: steps.auth.outputs.publish == 'true'
        env:
          VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
          VERDACCIO_URL: ${{ env.VERDACCIO_URL }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          # FORCE=1 bypasses the "version unchanged → skip" optimization.
          # Used for CVE recovery when Verdaccio is in a half-published
          # state (see docs/security/CVE_RESPONSE_RUNBOOK.md).
          FORCE: ${{ inputs.force == true && '1' || '' }}
        run: node scripts/aisha-packages-publish.mjs

      - name: Audit-log result
        if: always()
        # Best-effort: telemetry beacon to the orchestrator audit_journal so the
        # publish event is correlated with deploys + runs. Soft-fails on outage
        # so a postgrest blip doesn't fail the publish job itself.
        #
        # NOTE: do not use a heredoc here — the terminator (any `JSON` /
        # `EOF` etc.) at column 0 inside a YAML `run: |` block ends the
        # literal block early and breaks YAML parse ("Failing after 0s",
        # see PR #92 follow-up). Build the JSON in-shell via jq instead so
        # everything stays single-line-friendly inside the YAML literal.
        env:
          AISHA_GATEWAY_URL: ${{ secrets.AISHA_GATEWAY_URL }}
          POSTGREST_SERVICE_TOKEN: ${{ secrets.POSTGREST_SERVICE_TOKEN }}
          OUTCOME: ${{ job.status }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$AISHA_GATEWAY_URL" ] || [ -z "$POSTGREST_SERVICE_TOKEN" ]; then
            echo "skip: gateway secrets not present, telemetry off"
            exit 0
          fi
          PAYLOAD=$(jq -nc \
            --arg outcome "$OUTCOME" \
            --arg ref "${REF:-main}" \
            --arg sha "${SHA:-unknown}" \
            '{
              p_service_name: "forgejo",
              p_action: "aisha_packages_publish",
              p_action_detail: { outcome: $outcome, ref: $ref, sha: $sha },
              p_status: $outcome,
              p_duration_ms: 0
            }')
          curl -sS -X POST "${AISHA_GATEWAY_URL%/}/rest/v1/rpc/log_integration_action" \
            -H "Content-Type: application/json" \
            -H "apikey: ${POSTGREST_SERVICE_TOKEN}" \
            -H "Authorization: Bearer ${POSTGREST_SERVICE_TOKEN}" \
            -d "$PAYLOAD" || echo "telemetry POST failed (non-fatal)"
