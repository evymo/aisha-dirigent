<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <rect width="480" height="320" rx="16" fill="#0E0E10"/>

  <!-- Login form illustration -->
  <g transform="translate(140, 30)">
    <!-- Form card -->
    <rect x="25" y="10" width="150" height="170" rx="12" fill="#16161A" stroke="#2A2A30" stroke-width="1"/>

    <!-- AISHA mini avatar -->
    <circle cx="100" cy="40" r="18" fill="#1A1A1A"/>
    <circle cx="93" cy="36" r="2.5" fill="#FF6A1A"/>
    <circle cx="107" cy="36" r="2.5" fill="#FF6A1A"/>
    <path d="M93 46 Q100 51 107 46" stroke="#FF6A1A" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Email field -->
    <rect x="45" y="70" width="110" height="28" rx="6" fill="#0A0A0C" stroke="#2A2A30" stroke-width="1"/>
    <text x="55" y="88" fill="#6E6E73" font-family="system-ui" font-size="10">email@example.com</text>

    <!-- Password field -->
    <rect x="45" y="106" width="110" height="28" rx="6" fill="#0A0A0C" stroke="#2A2A30" stroke-width="1"/>
    <text x="55" y="124" fill="#6E6E73" font-family="system-ui" font-size="10">••••••••</text>

    <!-- Login button -->
    <rect x="45" y="145" width="110" height="28" rx="6" fill="#FF6A1A"/>
    <text x="100" y="164" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Přihlásit se</text>

    <!-- Or SSO divider -->
    <line x1="45" y1="195" x2="75" y2="195" stroke="#2A2A30" stroke-width="1"/>
    <text x="100" y="199" text-anchor="middle" fill="#6E6E73" font-family="system-ui" font-size="9">nebo</text>
    <line x1="125" y1="195" x2="155" y2="195" stroke="#2A2A30" stroke-width="1"/>

    <!-- SSO button -->
    <rect x="55" y="208" width="90" height="24" rx="6" fill="transparent" stroke="#E55A10" stroke-width="1"/>
    <g transform="translate(64, 220)" stroke="#E55A10" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-2.8" cy="0" r="2.1"/><path d="M-0.7 0 H4.6 M2.8 0 V1.9 M4.6 0 V1.9"/>
    </g>
    <text x="106" y="224" text-anchor="middle" fill="#E55A10" font-family="system-ui" font-size="10">Firemní SSO</text>
  </g>

  <!-- Lock + shield icons -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="16" fill="#FF6A1A" fill-opacity="0.1"/>
    <g stroke="#FF6A1A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-5" y="-1.5" width="10" height="8" rx="1.5"/>
      <path d="M-3 -1.5 V-3.8 A3 3 0 0 1 3 -3.8 V-1.5"/>
    </g>
  </g>
  <g transform="translate(380, 100)">
    <circle cx="0" cy="0" r="16" fill="#FBBE3C" fill-opacity="0.1"/>
    <g stroke="#FBBE3C" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -7 L5.8 -4.6 V-0.2 C5.8 3.4 3.4 5.7 0 7 C-3.4 5.7 -5.8 3.4 -5.8 -0.2 V-4.6 Z"/>
      <path d="M-2.3 -0.2 L-0.5 1.7 L2.7 -1.9"/>
    </g>
  </g>

  <!-- Title -->
  <text x="240" y="275" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="600">
    Přihlaste se
  </text>
  <text x="240" y="298" text-anchor="middle" fill="#9A9A9E" font-family="system-ui, sans-serif" font-size="12">
    Email, API klíč nebo firemní SSO — bezpečně a flexibilně
  </text>
</svg>
