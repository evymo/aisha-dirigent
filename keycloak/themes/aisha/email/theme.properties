# E-mailové téma.
#
# ⛔ `parent=keycloak.v2` TU BYLO A NEFUNGOVALO. `keycloak.v2` je téma typu
# LOGIN; e-mailové téma toho jména v Keycloaku NEEXISTUJE (jsou jen `base`
# a `keycloak`). Keycloak proto celé téma zahodil:
#
#   WARN  Not found parent theme 'keycloak.v2' of theme 'aisha'.
#         Unable to load EMAIL theme 'aisha' due to this.
#   ERROR Failed to find EMAIL theme aisha, using built-in themes
#
# Důsledek: VŠECHNY e-maily chodily ve výchozí šabloně Keycloaku — branding,
# patička i dosazení __SUPPORT_EMAIL__ byly celou dobu mrtvé. Nikdo si toho
# nevšiml, protože se to projeví jen v doručené poště, a i tam to vypadá jako
# „prostě strohý e-mail", ne jako vada. (Naměřeno 2026-08-02 skutečně odeslaným
# e-mailem do lokálního zachytávače — z kódu to vidět nešlo.)
#
# `base` stačí: template.ftl i html/* jsou tu přepsané celé, po rodiči chceme
# jen textové varianty a message bundly.
parent=base

locales=en,cs,de,fr,ru,th
