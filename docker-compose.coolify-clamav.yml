# Prose lives in docs/compose-notes/docker-compose.coolify-clamav.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
services:
  clamav:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    build:
      context: .
      dockerfile: infra/clamav/Dockerfile
      args:
        REGISTRY_PROXY: ${REGISTRY_PROXY:-}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-clamav
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 15s
      start_period: 300s   # first boot runs freshclam + loads the signature DB (slow)
      retries: 8
    networks:
      internal:
        aliases:
          # ⛔ JEDNO JMÉNO (2026-08-24). Do wipu tu byl alias `<prefix>-clamd`,
          # zatímco katalog deklaruje službu `clamav`, derivace vydává
          # `CLAMAV_MESH_TCP_ROUTES=3310|<prefix>-clamav:3310` a `CLAMD_HOST`
          # mířil taky na `clamav`. Sidecar `clamav-mesh-tcp` proto padal na
          # `host not found in upstream` — a SAMOTNÝ clamd přitom běžel zdravý.
          #
          # Nepřidávám druhý alias: dvě jména pro jednu věc je právě ta
          # nejednoznačnost, kterou má pravidlo „názvy projektové a JEDINEČNÉ
          # napříč stacky" odstranit. Kanonické je katalogové `clamav`.
          - ${APP_NAME_PREFIX:?identita instance}-clamav
      mesh-dns: {}

  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-clamav--pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      # Odvozuje cold-start z manifestu (pki nasazeno ⇒ true); bez PKI se vypíná
      # POŽADAVEK, ne jen adresa — výklad: docs/compose-notes/docker-compose.coolify.yml.md
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:?odvozuje cold-start z manifestu; bez něj pki-init trvá na bundlu i bez PKI}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  netbird-agent:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-clamav--netbird
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        echo "[netbird-agent] Bridge mode — own netns, no host daemon conflict."
        echo "[netbird-agent] DNS proxy disabled — clamav receives inbound mesh only."
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited — retry in 15s; container stays UP (never trips Coolify restart-limit)."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    volumes:
      - netbird-clamav-data-v3:/etc/netbird
      - netbird-clamav-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_BACKEND}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: backend-clamav
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
    networks:
      - internal

  # ⚠ MEZERA, ne hotovo (2026-08-21): clamd mluví TCP (3310), ne HTTP. Tenhle
  # ingress je Caddy HTTP proxy — bez HTTP endpointu v katalogu dostane prázdnou
  # tabulku a naslouchá jen na zdravotní 503. Stack je tím na mesh (agent +
  # netns), ale PŘÍCHOZÍ clamd přes mesh potřebuje TCP passthrough. Konzumenti
  # zatím chodí přes CLAMD_HOST na sdílené síti. Řešení patří do katalogu
  # (deklarace TCP endpointu) + sem (tcp proxy v netns agenta), ne do výjimky.
  # ⛔ `clamav-mesh-ingress` (Caddy/HTTP) ODSTRANĚN 2026-08-25. Důvod stojí
  # o pár řádků níž a platil od začátku: clamd mluví vlastním TCP protokolem,
  # takže mu Caddy směrující podle `Host` nemá jak rozvést. Derivace proto
  # `CLAMAV_MESH_INGRESS_ROUTES` vůbec NEVYDÁVÁ — a Caddy padal do záložní
  # větve: poslouchal na :8000, kdežto zdravotní sonda ťukala na :8080.
  # Kontejner tedy byl TRVALE nezdravý, a protože zdraví aplikace v Coolify je
  # konjunkce všech kontejnerů, `<prefix>-clamav` nemohl být zdravý NIKDY —
  # ani když clamd i TCP sidecar běžely v pořádku.
  #
  # Mesh tvář clamavu drží `clamav-mesh-tcp` níž. HTTP ingress byl jeho
  # předchůdce, kterého nikdo neuklidil.

  # ── TCP PŘES MESH ─────────────────────────────────────────────────────────
  # clamd mluví vlastním TCP protokolem, ne HTTP, takže `clamav-mesh-ingress`
  # (Caddy, směruje podle `Host`) ho nemá jak rozvést — a konzumenti proto
  # sahali na SDÍLENOU síť `coolify`, kde jméno nárokuje víc nájemníků najednou
  # (změřeno 2026-08-16: 149 aplikací, 8 zákaznických prefixů, docker mezi
  # stejnojmennými ROUND-ROBINUJE).
  #
  # ⭐ U TCP není `Host` potřeba: sidecar běží v netns AGENTA, takže poslouchá
  # na mesh IP tohohle peeru. Dvojice (mesh IP, port) je jednoznačná sama a dva
  # stacky můžou obě poslouchat na 3310, aniž by si překážely.
  #
  # Tabulka jde TOUTÉŽ dráhou jako u HTTP: katalog → derivace → jedna proměnná
  # → konfigurace se postaví při startu. Žádný druhý zdroj pravdy.
  #
  # Pozn. k rozlišení jmen: `proxy_pass` se rozřeší při startu. Sidecar se
  # restartuje se stackem, takže nová IP cíle dorazí týmž nasazením, které ji
  # vyrobilo — a static resolve je jediná varianta, která nestojí na volitelném
  # `ngx_stream_set_module`.
  clamav-mesh-tcp:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: "${IMAGE_NGINX}"
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-clamav--mesh-tcp
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
    environment:
      CLAMAV_MESH_TCP_ROUTES: "${CLAMAV_MESH_TCP_ROUTES:-}"
    # Měří to, co je úkolem sidecaru: že PORT Z TABULKY skutečně přijímá spojení.
    # Prázdná tabulka → prázdný port → unhealthy, a to je SPRÁVNĚ: sidecar, který
    # nic nerozvádí, se nesmí tvářit zdravě (týž zákon jako 503 `no-routes`
    # u HTTP ingressu).
    healthcheck:
      test:
        - CMD-SHELL
        - p=$$(printf '%s' "$$CLAMAV_MESH_TCP_ROUTES" | cut -d';' -f1 | cut -d'|' -f1); [ -n "$$p" ] && nc -z 127.0.0.1 "$$p" || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - sh
      - -c
      - |
        set -eu
        CFG=/tmp/mesh-tcp.conf
        if [ -z "$${CLAMAV_MESH_TCP_ROUTES:-}" ]; then
          echo "[mesh-tcp] CLAMAV_MESH_TCP_ROUTES prazdne - derivace nic nevydala nebo se nedorucila." >&2
          echo "[mesh-tcp] NENASLOUCHAM na zadnem portu. Connection refused je VIDITELNY stav;" >&2
          echo "[mesh-tcp] naslouchajici port bez cile by vypadal jako funkcni mesh." >&2
          trap 'exit 0' TERM INT
          while :; do sleep 3600 & wait $$!; done
        fi
        {
          echo "events {}"
          echo "stream {"
          OLDIFS=$$IFS; IFS=";"
          for r in $${CLAMAV_MESH_TCP_ROUTES}; do
            IFS=$$OLDIFS
            port=$${r%%|*}; target=$${r#*|}
            [ -n "$$port" ] && [ -n "$$target" ] || { IFS=";"; continue; }
            echo "  server { listen $$port; proxy_pass $$target; }"
            IFS=";"
          done
          IFS=$$OLDIFS
          echo "}"
        } > "$$CFG"
        echo "[mesh-tcp] tabulka: $${CLAMAV_MESH_TCP_ROUTES}"
        nginx -t -c "$$CFG"
        exec nginx -g "daemon off;" -c "$$CFG"
volumes:
  pki-certs:
    name: ${APP_NAME_PREFIX:?}_clamav-pki-certs
  netbird-clamav-data-v3:
    name: ${APP_NAME_PREFIX:?}_netbird-clamav-data
  clamav-data:
    name: ${APP_NAME_PREFIX:?}_clamav-data
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  coolify:
    external: true
    name: coolify
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}