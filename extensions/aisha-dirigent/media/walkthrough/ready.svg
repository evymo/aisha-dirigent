<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="readyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#1C1C21"/>
    </linearGradient>
    <linearGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A1A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6A1A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="12" fill="url(#readyBg)"/>

  <!-- Radial glow -->
  <circle cx="200" cy="115" r="80" fill="url(#glowGrad)"/>

  <!-- AISHA eye (success state) -->
  <ellipse cx="200" cy="105" rx="30" ry="20" fill="none" stroke="#FF6A1A" stroke-width="2.5"/>
  <circle cx="200" cy="105" r="8" fill="#FF6A1A"/>
  <circle cx="203" cy="103" r="2.5" fill="#fff"/>

  <!-- Checkmark circle -->
  <circle cx="222" cy="90" r="10" fill="#4ade80"/>
  <polyline points="217,90 220,93 227,87" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title -->
  <text x="200" y="155" text-anchor="middle" fill="#E55A10" font-family="system-ui" font-size="16" font-weight="700">Vše připraveno!</text>
  <text x="200" y="175" text-anchor="middle" fill="#9A9A9E" font-family="system-ui" font-size="11">Vaše prostředí je nastavené a AISHA je připravena.</text>

  <!-- 3 summary items -->
  <g transform="translate(80, 195)">
    <circle cx="10" cy="10" r="4" fill="#4ade80"/>
    <text x="22" y="14" fill="#EDEDEF" font-family="system-ui" font-size="10">Backend připojen</text>
  </g>
  <g transform="translate(80, 215)">
    <circle cx="10" cy="10" r="4" fill="#4ade80"/>
    <text x="22" y="14" fill="#EDEDEF" font-family="system-ui" font-size="10">Přihlášeni</text>
  </g>
  <g transform="translate(80, 235)">
    <circle cx="10" cy="10" r="4" fill="#4ade80"/>
    <text x="22" y="14" fill="#EDEDEF" font-family="system-ui" font-size="10">AI model aktivní</text>
  </g>

  <g transform="translate(230, 195)">
    <circle cx="10" cy="10" r="4" fill="#4ade80"/>
    <text x="22" y="14" fill="#EDEDEF" font-family="system-ui" font-size="10">Story vybrána</text>
  </g>
  <g transform="translate(230, 215)">
    <circle cx="10" cy="10" r="4" fill="#60a5fa"/>
    <text x="22" y="14" fill="#EDEDEF" font-family="system-ui" font-size="10">Prostředí detekováno</text>
  </g>
  <g transform="translate(230, 235)">
    <circle cx="10" cy="10" r="4" fill="#E55A10"/>
    <text x="22" y="14" fill="#EDEDEF" font-family="system-ui" font-size="10">Instrukce vygenerovány</text>
  </g>

  <!-- CTA hint -->
  <text x="200" y="270" text-anchor="middle" fill="#6E6E73" font-family="system-ui" font-size="9">Napište @aisha v chatu nebo otevřete Dashboard →</text>
</svg>
