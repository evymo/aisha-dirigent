# Prose lives in docs/compose-notes/docker-compose.coolify-ai-chat.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
x-svc-common: &svc-common
  restart: unless-stopped
  networks:
    - internal

x-svc-healthcheck: &svc-healthcheck
  interval: 15s
  timeout: 5s
  start_period: 30s
  retries: 5

services:
  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-ai-chat-pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      # Odvozuje cold-start z manifestu (pki nasazeno ⇒ true); bez PKI se vypíná
      # POŽADAVEK, ne jen adresa — výklad: docs/compose-notes/docker-compose.coolify.yml.md
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:?odvozuje cold-start z manifestu; bez něj pki-init trvá na bundlu i bez PKI}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  svc-ai-chat:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *svc-common
    cap_add: [NET_ADMIN]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ip route replace "$${NETBIRD_PEER_CIDR:?}" via "$${NETBIRD_DNS_IP:?}"
        echo "[mesh-route] $${NETBIRD_PEER_CIDR} via $${NETBIRD_DNS_IP}"
        exec su-exec node node dist/server.js
    build:
      context: .
      dockerfile: services/svc-ai-chat/Dockerfile
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-ai-chat
    expose:
      - "3011"
    depends_on:
      pki-init:
        condition: service_completed_successfully
    environment:
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?mesh}
      NODE_ENV: production
      SVC_AI_CHAT_PORT: 3011
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GIT_SHA: ${GIT_SHA:-dev}
      POSTGREST_URL: ${POSTGREST_URL:?POSTGREST_URL must be generated by topology resolver}
      POSTGREST_SERVICE_TOKEN: ${POSTGREST_SERVICE_TOKEN:?required — generate-secrets.mjs emits it + coolify-sync-envs.sh bulk-pushes (mandatory cold-start step)}
      REDIS_URL: redis://:${REDIS_PASSWORD}@${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-redis:6379
      SVC_MCP_KNOWLEDGE_URL: ${SVC_MCP_KNOWLEDGE_URL:?SVC_MCP_KNOWLEDGE_URL must be generated by topology resolver}
      JWT_SECRET: ${JWT_SECRET:?required — generate-secrets.mjs emits it + coolify-sync-envs.sh bulk-pushes (mandatory cold-start step); mints the PR-B MCP user-scoped token}
      KEYCLOAK_URL: ${KEYCLOAK_INTERNAL_URL:?KEYCLOAK_INTERNAL_URL must be generated by topology resolver}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KC_JWKS_URL: ${KEYCLOAK_INTERNAL_URL:?KEYCLOAK_INTERNAL_URL must be generated by topology resolver}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      KC_ISSUER: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}
      # Rezidence dat AI: `local` = cloudový backend se v registru nezaregistruje.
      # Deklaruje profil instance (ai.execution_mode), doktor ji odvodí.
      AISHA_EXECUTION_MODE: ${AISHA_EXECUTION_MODE:?rezidence dat AI — deklaruj ai.execution_mode (local|hybrid|cloud) v profilu instance a spusť doktora}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      AISHA_LLM_MOCK: ${AISHA_LLM_MOCK:-}
      VLLM_GENERATION_URL: ${VLLM_GENERATION_URL:-}
      INTERNAL_TLD: ${INTERNAL_TLD:?zóna instance — bez ní vLLM backend odmítne odvozenou http adresu modelu}
      MESH_TLD: ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
      OLLAMA_URL: ${OLLAMA_URL:-}
      DOCKER_MODEL_RUNNER_URL: ${DOCKER_MODEL_RUNNER_URL:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in Coolify env (generated by cold-start)}
      RAGNAROK_URL: ${RAGNAROK_URL:-}
      MAESTRO_URL: ${MAESTRO_URL:-}
      INSIGHT_DEFAULT_LANG: ${INSIGHT_DEFAULT_LANG:-cs-CZ}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      FLOWBOARD_CALLBACK_BASE_URL: ${FLOWBOARD_CALLBACK_BASE_URL:-}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      EVALUATE_AI_RESPONSE_URL: ${EVALUATE_AI_RESPONSE_URL:-}
      OPENCLAW_URL: ${OPENCLAW_URL:-}
      OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:?minted by generate-secrets and pushed by coolify-sync; empty is a delivery bug}
      LANGGRAPH_ENABLE_OPENCLAW: ${LANGGRAPH_ENABLE_OPENCLAW:-true}
      CORS_ALLOWLIST: ${CORS_ALLOWLIST:-}
      SSRF_HOST_ALLOWLIST: ${AI_CHAT_SSRF_ALLOWLIST:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Podíl odpovědí chatu hodnocených LLM soudcem (0–1, přepínač instance, D8 / K-17).
      # Nenastaveno = 0 = vypnuto (parseEvalSampleRate); instance zapíná hodnotou v env.
      CHAT_EVAL_SAMPLE_RATE: ${CHAT_EVAL_SAMPLE_RATE:-}
      CHAT_MODEL_PREFIXES: ${CHAT_MODEL_PREFIXES:-gpt-,o1-,o3-,o4-}
      NODE_EXTRA_CA_CERTS: /certs/pki/aisha-ca-bundle.pem
    volumes:
      - pki-certs:/certs/pki:ro
    healthcheck:
      <<: *svc-healthcheck
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:3011/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\" || exit 1"
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-ai-chat
      mesh-dns: {}
    labels:
      - "coolify.managed=true"

  svc-aitg-probes:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *svc-common
    cap_add: [NET_ADMIN]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ip route replace "$${NETBIRD_PEER_CIDR:?}" via "$${NETBIRD_DNS_IP:?}"
        echo "[mesh-route] $${NETBIRD_PEER_CIDR} via $${NETBIRD_DNS_IP}"
        exec su-exec node node dist/server.js
    build:
      context: .
      dockerfile: services/svc-aitg-probes/Dockerfile
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-aitg-probes
    expose:
      - "3041"
    depends_on:
      pki-init:
        condition: service_completed_successfully
    environment:
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?mesh}
      NODE_ENV: production
      SVC_AITG_PROBES_PORT: 3041
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GIT_SHA: ${GIT_SHA:-dev}
      POSTGREST_URL: ${POSTGREST_URL:?POSTGREST_URL must be generated by topology resolver}
      POSTGREST_SERVICE_TOKEN: ${POSTGREST_SERVICE_TOKEN:?required — generate-secrets.mjs emits it + coolify-sync-envs.sh bulk-pushes (mandatory cold-start step)}
      AI_CHAT_SERVICE_URL: ${AI_CHAT_SERVICE_URL:?doručuje env-doctor CONTRACT z identity instance}
      AI_CHAT_SERVICE_TOKEN: ${POSTGREST_SERVICE_TOKEN:?same service-role secret svc-ai-chat compares against — see compose notes}
      AITG_DEFAULT_MODEL: ${AITG_DEFAULT_MODEL:-gpt-4o-mini}
      CORS_ALLOWLIST: ${CORS_ALLOWLIST:-}
      SSRF_HOST_ALLOWLIST: ${AI_CHAT_SSRF_ALLOWLIST:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      NODE_EXTRA_CA_CERTS: /certs/pki/aisha-ca-bundle.pem
    volumes:
      - pki-certs:/certs/pki:ro
    healthcheck:
      <<: *svc-healthcheck
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:3041/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\" || exit 1"
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-aitg-probes
      mesh-dns: {}
    labels:
      - "coolify.managed=true"

  netbird-agent:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-ai-chat--netbird
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        echo "[netbird-agent] Bridge mode — own netns, no host daemon conflict."
        echo "[netbird-agent] DNS proxy disabled — ai-chat receives inbound mesh only."
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited — retry in 15s; container stays UP (never trips Coolify restart-limit)."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    volumes:
      - netbird-ai-chat-data-v3:/etc/netbird
      - netbird-ai-chat-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_BACKEND}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: backend-ai-chat
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    expose:
      - "3011"
      - "3041"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
    networks:
      - internal
      - mesh-dns

  ai-chat-mesh-ingress:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_CADDY}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-model--mesh-ingress
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
    environment:
      AI_CHAT_MESH_INGRESS_ROUTES: ${AI_CHAT_MESH_INGRESS_ROUTES:-}
      # TÝŽ seznam, jaký dostává gateway — jeden zdroj (`lib/derive-subnets.mjs`).
      # Bez něj Caddy `x-forwarded-for` přepíše a klientská adresa se ztratí.
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$${AI_CHAT_MESH_INGRESS_ROUTES:-}" ]; then
          echo "[mesh-ingress] AI_CHAT_MESH_INGRESS_ROUTES prázdné — derivace nic nevydala nebo se nedoručila."
          echo "[mesh-ingress] Naslouchám jen na health, aby bylo VIDĚT, že tabulka chybí."
          # ⛔ STAV BEZ TABULKY MUSÍ BÝT VIDĚT SONDĚ (naměřeno 2026-09-03).
          # Záložní Caddyfile poslouchal na :8000, ale healthcheck sonduje :3011 —
          # port této služby. Sonda tedy dostala „connection refused" místo
          # navrženého 503 „bez směrovací tabulky", a diagnóza vedla k „zavřený
          # port" místo ke skutečné příčině. Neshoda byla v 15 z 16 stacků;
          # jediný, kde porty seděly, byl `model`, jehož vlastní port JE 8000 —
          # vzor se trefil sám sebou a vada byla ze zdroje neviditelná.
          printf ':3011 {\n  handle /__mesh_health {\n    respond "no-routes" 503\n  }\n  handle {\n    respond "mesh-ingress bez směrovací tabulky" 503\n  }\n}\n' > /etc/caddy/Caddyfile
        else
          : > /etc/caddy/Caddyfile
          # ⛔ NAMĚŘENO 2026-08-31: brána viděla `x-forwarded-for` s JEDINÝM
          # prvkem — adresou svého souseda (mesh-router edge). To je podpis
          # NAHRAZENÍ, ne řetězu: Caddy bez `trusted_proxies` příchozí hlavičce
          # nedůvěřuje a přepíše ji tím, kdo se právě připojil. Každý náš skok
          # tak řetěz zahodil a klientská adresa se ke dveřím NEDOSTALA —
          # `enforce` by zamkl i majitele.
          #
          # Hodnota se NEOPISUJE: je to TÝŽ seznam, jaký dostává gateway
          # (`lib/derive-subnets.mjs` → GATEWAY_TRUSTED_PROXIES). Dva tvary
          # (čárky pro env, mezery pro Caddy), jeden zdroj — kdyby si je každý
          # skládal sám, chůze zprava by v každém prvku končila jinde.
          if [ -n "$${GATEWAY_TRUSTED_PROXIES:-}" ]; then
            printf '{\n  servers {\n    trusted_proxies static %s\n  }\n}\n\n' \
              "$$(echo "$${GATEWAY_TRUSTED_PROXIES}" | tr ',' ' ')" >> /etc/caddy/Caddyfile
          else
            # Nedoručený seznam se NEDOSAZUJE. Bez něj Caddy řetěz přepíše —
            # to je vada, ale TICHÁ; tady se aspoň řekne nahlas.
            echo "[mesh-ingress] GATEWAY_TRUSTED_PROXIES nedoručen — x-forwarded-for bude PŘEPSÁN, klientská adresa se ztratí"
          fi
          PORTS=$$(echo "$${AI_CHAT_MESH_INGRESS_ROUTES}" | tr ';' '\n' | cut -d'|' -f1 | sort -un)
          for P in $$PORTS; do
            printf ':%s {\n  handle /__mesh_health {\n    respond "ok" 200\n  }\n' "$$P" >> /etc/caddy/Caddyfile
            echo "$${AI_CHAT_MESH_INGRESS_ROUTES}" | tr ';' '\n' | while IFS='|' read -r RP RH RT; do
              [ "$$RP" = "$$P" ] || continue
              M=$$(echo "$$RH" | cut -d, -f1 | cut -d. -f1 | tr '-' '_')
              HOSTS=$$(echo "$$RH" | tr ',' ' ')
              printf '  @%s host %s\n  handle @%s {\n    reverse_proxy http://%s\n  }\n' "$$M" "$$HOSTS" "$$M" "$$RT" >> /etc/caddy/Caddyfile
            done
            printf '  handle {\n    respond "mesh-ingress: Host nepatri na tento port" 421\n  }\n}\n' >> /etc/caddy/Caddyfile
          done
          echo "[mesh-ingress] tabulka: $$(echo "$${AI_CHAT_MESH_INGRESS_ROUTES}" | tr ';' '\n' | wc -l) tras na $$(echo "$$PORTS" | wc -w) portech"
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3011/__mesh_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  netbird-ai-chat-data-v3:
    name: ${APP_NAME_PREFIX:?}_netbird-ai-chat-data
  pki-certs:
    name: ${APP_NAME_PREFIX:?}_ai-chat-pki-certs
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}