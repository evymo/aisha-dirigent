    <<: *bridge-common
    profiles: ["bridge-telegram"]
    image: ${IMAGE_MAUTRIX_TELEGRAM}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-bridge-telegram
    volumes:
      - bridge-telegram:/data
      - bridge-registrations:/data/registration

