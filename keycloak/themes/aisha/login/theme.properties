# Přihlašovací stránka — GENERICKÁ, pro každou instanci AISHA stacku.
#
# parent=base, NE keycloak.v2. Dědit PatternFly znamená zdědit i každé jeho
# rozhodnutí, které jsme nenašli: rámy polí kreslené pseudoprvkem ::before
# (přebít `border` na elementu je naprázdno), 98px boční padding kontejneru,
# modrá tlačítka. Naměřeno 2026-08-02 — tři projevy JEDNÉ volby na tomhle
# řádku. `base` posílá holé sémantické HTML bez cizího stylu, takže designový
# jazyk nepřebíjíme, ale definujeme.
parent=base

# Vrstvy, v pořadí, v jakém musí přijít:
#   1. design-language.css — páteř jazyka: škála, typografie, funkční barvy
#                            a sémantická témata (daylight/den, carbon/noc)
#   2. esdk/styles.css     — primitivy .es-card/.es-inp/.es-btn v @layer esdk
#                            (nulová specificita). Sám si přitáhne
#                            esdk/tokens.css relativním @import.
#   3. esdk/adapter.css    — mapuje krátká jména SDK (--s4) na jména jazyka
#                            (--space-4). ⛔ NAMĚŘENO 2026-08-18: tenhle řádek
#                            tu CHYBĚL. Soubor se do obrazu kopíroval, ale
#                            nebyl v `styles=` a nikdo ho neimportoval — tedy
#                            se NIKDY nenačetl a mapování krátkých jmen se
#                            nedělo. Komentář o řádek výš přitom tvrdil, že
#                            přichází s esdk.css; prosa říkala jedno, soubor
#                            druhé a nic to neporovnávalo.
#   4. login.css           — rozvržení přihlašovací stránky. Žádná barva.
#   5. brand.css           — HODNOTY INSTANCE. Tady je to prázdný soubor;
#                            instanční overlay ho přepíše svým.
# Vrstvy 2 a 3 vezou balíky přes Dockerfile.keycloak — nejsou to kopie. Leží
# v podadresáři `css/esdk/`, aby se jejich `tokens.css` nesrazil s tím, který
# si jako svůj nárokuje instance (viz brand.css).
styles=css/design-language.css css/esdk/styles.css css/esdk/adapter.css css/login.css css/brand.css

scripts=js/status.js

locales=en,cs

# ── Háčky Keycloaku → primitivy ESDK ─────────────────────────────────────────
# `base` renderuje formuláře sám a třídy si bere odsud. Namapováním na ESDK se
# přihlášení obleče do jazyka BEZ přepisování login.ftl — a upgrade Keycloaku
# tím nemá co rozbít.
kcInputClass=es-inp
kcButtonClass=es-btn
kcButtonPrimaryClass=es-btn
kcButtonDefaultClass=es-btn sec
kcButtonBlockClass=login-block
kcButtonLargeClass=
kcFormCardClass=es-card login-card
kcFormGroupClass=login-field
kcLabelClass=login-label
kcInputErrorMessageClass=login-error
kcFormOptionsClass=login-options
kcFormButtonsClass=login-buttons
kcFormSettingClass=login-setting
kcFormSocialAccountListClass=login-social
kcFormSocialAccountListButtonClass=es-btn sec login-social__btn
kcFormSocialAccountNameClass=login-social__name
kcAlertClass=login-alert
kcAlertTitleClass=login-alert__title
kcSignUpClass=login-signup
kcHtmlClass=login-html
kcBodyClass=login-body
kcLoginClass=login-shell
kcHeaderClass=login-header
kcHeaderWrapperClass=login-header__text
kcFormHeaderClass=login-card__header
kcLocaleMainClass=login-locale
kcLocaleDropDownClass=login-locale__dd
kcLocaleListClass=login-locale__list
kcLocaleItemClass=login-locale__item
kcInputGroup=login-inputgroup
kcFormPasswordVisibilityButtonClass=login-eye
# base vykresluje UVNITŘ tlačítka <i class="${kcFormPasswordVisibilityIcon...}">.
# Bez namapování je ta třída PRÁZDNÁ, ikona nemá co nakreslit a z tlačítka je
# prázdné místo vedle hesla (naměřeno na nasazené stránce 2026-08-02).
# Glyf kreslí login.css maskou — téma nemá ikonový font a mít ho nemá proč.
kcFormPasswordVisibilityIconShow=login-eye__ico login-eye__ico--show
kcFormPasswordVisibilityIconHide=login-eye__ico login-eye__ico--hide
