    <<: *bridge-common
    profiles: ["bridge-whatsapp"]
    image: ${IMAGE_MAUTRIX_WHATSAPP}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-bridge-whatsapp
    volumes:
