# .tbls.yml — AISHA schema documentation config (tbls, https://github.com/k1LoW/tbls)
#
# The "DB architect" VISUALIZATION layer. Generated docs live in docs/db/ and are
# committed, so the ER diagram diffs in PRs (a new/removed relationship shows up as a
# diff). Companion to the FK-relationship-gap GATE (scripts/db/check-fk-relationship-gaps.mjs):
#   • the gate ENFORCES — fails cold-start on a NEW unenforced *_id relationship;
#   • this config VISUALIZES — the ER shows only real (enforced) FKs, so a missing
#     "vazba" is a visibly absent line.
#
# Run:  AISHA_DB_URL=postgres://… npm run db:schema:docs
#   Point AISHA_DB_URL at a throwaway / cold-start DB that has the full schema applied
#   (e.g. `AISHA_TYPEGEN_KEEP=1 npm run db:types:refresh:throwaway` leaves one up).
#   The generator runs tbls via the k1low/tbls Docker image, sourced through your
#   registry mirror (REGISTRY_PROXY, same as the infra/* Dockerfiles) — never Docker
#   Hub directly when REGISTRY_PROXY is set; override fully with AISHA_TBLS_IMAGE.

dsn: ${AISHA_DB_URL}
docPath: docs/db/tbls   # full per-table site (gitignored); committed ER is docs/db/RELATIONSHIPS.md

er:
  format: mermaid   # text → diffable, GitHub-rendered, no graphviz/dot dependency
  comment: true

format:
  adjust: true
  sortTablesByName: true

# Relationship / doc-hygiene lint. The unenforced-FK class is owned by the GATE
# (check-fk-relationship-gaps.mjs) with its own allowlist, so we deliberately DON'T
# double-report it here (unrelatedColumns: off). tbls lint covers the complementary
# hygiene rules only.
lint:
  duplicateRelations:
    enabled: true
  unrelatedColumns:
    enabled: false   # owned by the FK-gap gate
  requireTableComment:
    enabled: false   # 338 auto-extracted tables; comments not yet curated
  requireColumnComment:
    enabled: false
  columnCount:
    enabled: false

