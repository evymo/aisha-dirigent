# Prose lives in docs/compose-notes/docker-compose.coolify-prebuilt.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
services:
  web:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_AISHA_BACKEND_URL: ${VITE_AISHA_BACKEND_URL:-}
        VITE_AISHA_BACKEND_ANON_KEY: ${VITE_AISHA_BACKEND_ANON_KEY:-}
        VITE_AISHA_BACKEND_PUBLISHABLE_KEY: ${VITE_AISHA_BACKEND_PUBLISHABLE_KEY:-}
        VITE_AISHA_GATEWAY_URL: ${VITE_AISHA_GATEWAY_URL:-}
        VITE_AISHA_GATEWAY_KEY: ${VITE_AISHA_GATEWAY_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_WEB_PUSH_VAPID_PUBLIC_KEY: ${VITE_WEB_PUSH_VAPID_PUBLIC_KEY:-}
        VITE_REQUIRE_AISHA_BACKEND_ENV: ${VITE_REQUIRE_AISHA_BACKEND_ENV:-false}
        VITE_KC_URL: ${VITE_KC_URL:-}
        VITE_KC_AUTHORITY: ${VITE_KC_AUTHORITY:-}
        VITE_KC_CLIENT_ID: ${VITE_KC_CLIENT_ID:-}
        VITE_AUTH_REDIRECT_URI: ${VITE_AUTH_REDIRECT_URI:-}
        VITE_AUTH_POST_LOGOUT_URI: ${VITE_AUTH_POST_LOGOUT_URI:-}
        SENTRY_URL: ${SENTRY_URL:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        GIT_SHA: ${GIT_SHA:-}
        KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM must be delivered by cold-start env — the realm constant lives in keycloak/aisha-realm.json}
        # Prázdno = instance bez matrixu (Dockerfile.web: ARG MATRIX_DOMAIN=""). Výklad: compose-notes.
        MATRIX_DOMAIN: ${MATRIX_DOMAIN:-}
        DIRIGENT_DOMAIN: ${DIRIGENT_DOMAIN:?DIRIGENT_DOMAIN must be generated by topology resolver}
        GATEWAY_DOMAIN_PUBLIC: ${GATEWAY_DOMAIN_PUBLIC:-}
        VITE_PUBLIC_BRAND_LANG: ${VITE_PUBLIC_BRAND_LANG:-}
        VITE_PUBLIC_BRAND_TITLE: ${VITE_PUBLIC_BRAND_TITLE:-}
        VITE_PUBLIC_BRAND_DESCRIPTION: ${VITE_PUBLIC_BRAND_DESCRIPTION:-}
        VITE_PUBLIC_BRAND_AUTHOR: ${VITE_PUBLIC_BRAND_AUTHOR:-}
        VITE_PUBLIC_BRAND_PRIMARY: ${VITE_PUBLIC_BRAND_PRIMARY:-}
        VITE_PUBLIC_BRAND_THEME_COLOR: ${VITE_PUBLIC_BRAND_THEME_COLOR:-}
        VITE_PUBLIC_BRAND_OG_LOCALE: ${VITE_PUBLIC_BRAND_OG_LOCALE:-}
        VITE_PUBLIC_BRAND_OG_SITE_NAME: ${VITE_PUBLIC_BRAND_OG_SITE_NAME:-}
        VITE_PUBLIC_BRAND_OG_DESCRIPTION: ${VITE_PUBLIC_BRAND_OG_DESCRIPTION:-}
        VITE_PUBLIC_BRAND_OG_IMAGE: ${VITE_PUBLIC_BRAND_OG_IMAGE:-}
      secrets:
        - sentry_auth_token
    healthcheck:
      # Lokální soubor, ne `/`: kořen jde přes předrender (web-render) a zdraví webu
      # nesmí záviset na tom, jestli web-render zrovna odpovídá.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/index.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    expose:
      - "80"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      MESH_ENABLED: ${MESH_ENABLED:?vydává topologický resolver}
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?vydává generate-secrets — rozsah peerů pro routu}
      NETBIRD_DNS_IP: ${NETBIRD_DNS_IP:?vydává generate-secrets z MESH_DNS_RESOLVER_IP}
      WEB_RENDER_UPSTREAM_MESH: ${WEB_RENDER_UPSTREAM_MESH:-}
      WEB_RENDER_SHELL_TOKEN: ${WEB_RENDER_SHELL_TOKEN}
    volumes:
      - mesh-diag:/usr/share/nginx/html/__mesh_diag:ro
    networks:
      - internal
      - coolify
      - mesh-dns
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"

  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-edge-pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      PKI_BUNDLE_REQUIRED: "false"
      PKI_BUNDLE_WAIT_S: ${PKI_BUNDLE_WAIT_S:-600}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  svc-knock-netns:
    image: ${REGISTRY_PROXY}library/caddy:2.8.4-alpine
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-knock-netns
    profiles: ["knock"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    cap_add:
      - NET_ADMIN
    security_opt: ["no-new-privileges:true"]
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    ports:
      - "${SPA_KNOCK_PUBLIC_PORT?ruční deklarace operátora (záloha instance) — veřejný UDP port dveří, prázdná jen bez profilu knock}:18181/udp"
    expose: ["3017"]
    environment:
      MESH_ENABLED: ${MESH_ENABLED:?MESH_ENABLED must be generated by topology resolver}
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?vydává generate-secrets (derive-subnets); rozsah peerů pro routu do mesh}
      NETBIRD_DNS_IP: ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP}
      SPA_KNOCK_PUBLIC_PORT: ${SPA_KNOCK_PUBLIC_PORT?ruční deklarace operátora (záloha instance) — veřejný UDP port dveří}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        case "$${SPA_KNOCK_PUBLIC_PORT:-}" in
          ""|*[!0-9]*)
            echo "[knock-netns] FATAL: SPA_KNOCK_PUBLIC_PORT není port — ruční deklarace operátora chybí; bez ní by Docker publikoval náhodný port." >&2
            exit 64
            ;;
        esac
        _mesh="$$(echo "$${MESH_ENABLED}" | tr '[:upper:]' '[:lower:]')"
        case "$$_mesh" in
          true|1|yes|on)
            if [ -z "$${NETBIRD_PEER_CIDR:-}" ] || [ -z "$${NETBIRD_DNS_IP:-}" ]; then
              echo "[mesh-route] FATAL: mesh je vyhlášená, ale chybí NETBIRD_PEER_CIDR nebo NETBIRD_DNS_IP." >&2
              exit 64
            fi
            if ip route replace "$${NETBIRD_PEER_CIDR}" via "$${NETBIRD_DNS_IP}" 2>&1; then
              echo "[mesh-route] routa $${NETBIRD_PEER_CIDR} → $${NETBIRD_DNS_IP} (mesh-router) postavena"
            else
              echo "[mesh-route] FATAL: routu do mesh nelze postavit — chybí NET_ADMIN, nebo služba není na síti mesh-dns." >&2
              echo "[mesh-route] NEDĚLEJ: nepokračuj bez routy — vnitřní jméno by se přeložilo wildcardem VEN." >&2
              exit 64
            fi
            ;;
          *)
            echo "[mesh-route] MESH_ENABLED=$${MESH_ENABLED} — routa do mesh se nestaví (veřejná lane)."
            ;;
        esac
        echo "[knock-netns] netns drží; svc-knock v něm naslouchá na UDP 18181 (veřejně $${SPA_KNOCK_PUBLIC_PORT})"
        trap 'echo "[knock-netns] TERM — konec"; exit 0' TERM INT
        while :; do sleep 3600 & wait "$$!" || true; done
    healthcheck:
      test: ["CMD-SHELL", "case \"$$MESH_ENABLED\" in true|1|yes|on) ip route | grep -qF \"$$NETBIRD_PEER_CIDR via $$NETBIRD_DNS_IP\" ;; *) true ;; esac"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-knock
      mesh-dns: {}

  svc-knock:
    network_mode: "service:svc-knock-netns"
    restart: on-failure:5
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=8m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      pki-init:
        condition: service_completed_successfully
      svc-knock-netns:
        condition: service_started
        restart: true
    volumes:
      - pki-certs:/certs/pki:ro
    build:
      context: .
      dockerfile: services/svc-knock/Dockerfile
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-knock
    profiles: ["knock"]
    environment:
      CORS_ALLOWLIST: ${CORS_ALLOWLIST:-}
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_EXTRA_CA_CERTS: /certs/pki/aisha-ca-bundle.pem
      SPA_HEALTH_PORT: "3017"
      SPA_KNOCK_PORT: "18181"
      AISHA_SHARED_REDIS_URL: redis://core:${REDIS_PASSWORD_CORE}@${SHARED_REDIS_HOST}:6379
      SPA_REDIS_DB: ${SPA_REDIS_DB:-4}
      SPA_OPERATORS_B64: ${SPA_OPERATORS_B64:-}
      # Roster schválených tabletů z brány — k základu se PŘIDÁVÁ (roster.ts).
      SPA_OPERATORS_URL: ${SPA_OPERATORS_URL:-}
      SPA_OPERATORS_VERSION_URL: ${SPA_OPERATORS_VERSION_URL:-}
      SPA_OPERATORS_TOKEN: ${KNOCK_ROSTER_TOKEN}
      SPA_DIAGNOSE: ${SPA_DIAGNOSE:-0}
      SPA_PINHOLE_TTL: ${SPA_PINHOLE_TTL:-120}
      SPA_WINDOW_SEC: ${SPA_WINDOW_SEC:-30}
      SPA_OTP_SKEW: ${SPA_OTP_SKEW:-1}
      SPA_STATIC_ALLOW: ${SPA_STATIC_ALLOW:-}
      SPA_BLACKLIST: ${SPA_BLACKLIST:-}
      SPA_MAX_INVALID: ${SPA_MAX_INVALID:-10}
      SPA_RATE_WINDOW_SEC: ${SPA_RATE_WINDOW_SEC:-60}
      SPA_COOLDOWN_SEC: ${SPA_COOLDOWN_SEC:-300}
      SPA_ALERT_WEBHOOK: ${SPA_ALERT_WEBHOOK:-}
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      test: ["CMD-SHELL", "node -e \"const os=require('os');if(!Object.keys(os.networkInterfaces()).some(i=>i!=='lo'))process.exit(1);require('http').get('http://127.0.0.1:3017/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\" || exit 1"]

  mesh-router:
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-mesh-router
    restart: unless-stopped
    init: true
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.forwarding: "1"
    volumes:
      - edge-proxy-data:/etc/netbird
      - edge-proxy-data:/var/lib/netbird
      - pki-certs:/certs/pki:ro
      - mesh-diag:/diag
    depends_on:
      pki-init:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-mesh-router
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-mesh-router
        ipv4_address: ${MESH_DNS_RESOLVER_IP:?required — generate-secrets emits the resolver pin; coolify-sync-envs delivers it}
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
      - "${NETBIRD_DOMAIN}:host-gateway"
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_FRONTEND}
      NB_HOSTNAME: edge
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
      CORE_MESH_IP: ${CORE_MESH_IP:-}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
    entrypoint:
      - /bin/sh
      - -c
      - |
        set +e   # NEVER crash — we want this container to stay alive even
                 # if individual setup steps fail. Logs WARN and continues.
        echo "[mesh-router] starting up"
        echo "[mesh-router] CORE_MESH_IP=$${CORE_MESH_IP}"
        # CORE_MESH_IP už NENÍ cíl DNATu (ten je pryč, viz níže) — je to
        # MĚŘIDLO, jestli peer discovery vůbec proběhla. Prázdná hodnota
        # znamená, že management nikdo neoslovil, takže ani mesh DNS nemá
        # záznamy a vnitřní jména propadnou wildcardem na cizí stroj. Hlásit
        # to je levné; hádat, proč api padá, stálo hodiny (07-29: mesh-sync měl
        # jméno apky natvrdo jako `aisha-edge`, na forku tedy NIKDY nevyplnil).
        case "$${CORE_MESH_IP}" in
          ""|":"*)
            echo "[mesh-router] !!! CORE_MESH_IP je PRÁZDNÉ — peer discovery neproběhla."
            echo "[mesh-router] !!! Mesh DNS pak nemá záznamy a vnitřní jména se přeloží MIMO instanci."
            echo "[mesh-router] !!! Náprava: node scripts/coolify-mesh-sync.mjs --apply"
            echo "[mesh-router] !!! (vyžaduje běžící netbird-management; doplní CORE_MESH_IP z peer discovery)"
            ;;
        esac
        echo "[mesh-router] NB_HOSTNAME=$${NB_HOSTNAME}"

        # ─── Kernel forwarding (sysctl block above already sets these,
        # but we re-apply at runtime in case the container runtime ignored
        # the compose-level sysctls)
        sysctl -w net.ipv4.ip_forward=1 2>&1 || echo "[mesh-router] WARN sysctl ip_forward failed"

        # ─── iptables: ACCEPT FORWARD (NetBird's ufw may default-deny)
        iptables -P FORWARD ACCEPT 2>&1 || echo "[mesh-router] WARN policy FORWARD failed"
        iptables -I FORWARD -j ACCEPT 2>&1 || echo "[mesh-router] WARN insert FORWARD ACCEPT failed"

        # ─── MSS clamping — wt0 has MTU 1280 (WireGuard), eth0 has 1500.
        # Without this, large TCP packets get silently dropped on the boundary.
        iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN \
          -j TCPMSS --clamp-mss-to-pmtu 2>&1 \
          || echo "[mesh-router] WARN MSS clamp failed"

        # ─── MASQUERADE outgoing wt0 traffic so reply packets route back
        # via conntrack (forward path was DNAT, reverse path needs SNAT).
        iptables -t nat -A POSTROUTING -o wt0 -j MASQUERADE 2>&1 \
          || echo "[mesh-router] WARN MASQUERADE failed"

        # ⛔ ŽÁDNÝ DNAT. Do 2026-08-21 tu stála dvě pravidla
        #   PREROUTING --dport 3001 → CORE_MESH_IP:3001
        #   PREROUTING --dport 8080 → CORE_MESH_IP:8080
        # a byla to vada, která rostla s počtem stacků v mesh: DNAT klíčuje
        # POUZE PORTEM, takže port 8080 (imgproxy jádra i n8n) poslal veřejný
        # provoz mcp/dirigent do jádra, kde ho přísný mesh-ingress odmítl 421.
        # Port není adresa. Klienti edge stacku mají od té doby ROUTU do
        # rozsahu peerů (infra/mesh/mesh-client-route.sh) a míří JMÉNEM;
        # mesh-router je hop, ne cíl. Pravidlo se sem nesmí vrátit: PREROUTING
        # by přepsalo i provoz, který jen prochází, a jméno by přestalo platit.

        echo "[mesh-router] iptables NAT rules:"
        iptables -t nat -L PREROUTING -n --line-numbers 2>&1 | sed 's/^/  /'

        # ─── DIAG: write status to /diag/status.txt every 5s (TEMP)
        # web nginx (RO mount of same volume) serves at:
        #   ${APP_DOMAIN}/__mesh_diag/status.txt
        mkdir -p /diag 2>/dev/null
        (
          while true; do
            {
              echo "=== mesh-router diag $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
              echo
              echo "## env"
              echo "NB_HOSTNAME=$${NB_HOSTNAME:-(unset)}"
              echo "CORE_MESH_IP=$${CORE_MESH_IP:-(unset)}"
              echo "NB_SETUP_KEY length=$${#NB_SETUP_KEY}"
              echo "NB_MANAGEMENT_URL=$${NB_MANAGEMENT_URL:-(unset)}"
              echo
              echo "## /var/lib/netbird (NetBird 0.70+ config persistence)"
              ls -la /var/lib/netbird/ 2>&1 | head -10
              echo "default.json size: $$(stat -c %s /var/lib/netbird/default.json 2>/dev/null || echo missing)"
              echo "## /etc/netbird (legacy path)"
              ls -la /etc/netbird/ 2>&1 | head -5
              echo "config.json size: $$(stat -c %s /etc/netbird/config.json 2>/dev/null || echo missing)"
              echo
              echo "## interfaces"
              ip -br addr 2>&1
              echo
              echo "## ip routes"
              ip route 2>&1
              echo
              echo "## iptables NAT PREROUTING (counters show traffic flow)"
              iptables -t nat -L PREROUTING -n -v 2>&1
              echo
              echo "## iptables NAT POSTROUTING"
              iptables -t nat -L POSTROUTING -n -v 2>&1
              echo
              echo "## /etc/hosts content (extra_hosts mappings active?)"
              cat /etc/hosts 2>&1 | head -10
              echo
              _nb_host=$$(echo "$${NB_MANAGEMENT_URL}" | sed -E 's|^https?://||;s|[:/].*||')
              echo "## DNS: $${_nb_host} (mgmt — should resolve to public, extracted from NB_MANAGEMENT_URL)"
              getent hosts "$${_nb_host}" 2>&1 | head -2
              echo "## DNS: netbird-internal-tls (Signal target — Docker DNS cross-stack)"
              getent hosts netbird-internal-tls 2>&1 | head -2 || echo "  (not resolvable via Docker DNS — cross-stack alias missing)"
              echo "## DNS: netbird-signal (alternate target)"
              getent hosts netbird-signal 2>&1 | head -2 || echo "  (not resolvable)"
              echo "## DNS: netbird-management (alternate target)"
              getent hosts netbird-management 2>&1 | head -2 || echo "  (not resolvable)"
              echo "## DNS: aisha-pki-bridge (used by pki-init script — test cross-stack)"
              getent hosts ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-pki-bridge 2>&1 | head -2 || echo "  (not resolvable)"
              echo
              echo "## host-gateway IP (default route)"
              ip route | awk '/default/ {print "  gateway: " $$3}' | head -1
              echo
              echo "## TCP test: extra_hosts target for netbird.mesh.aisha.internal:33073"
              # Resolve via /etc/hosts (extra_hosts entry) — what agent actually targets
              mesh_ip=$$(getent hosts netbird.mesh.aisha.internal 2>/dev/null | awk '{print $$1}' | head -1)
              echo "  extra_hosts resolved → $$mesh_ip"
              if [ -n "$$mesh_ip" ]; then
                if timeout 5 nc -z -w 3 "$$mesh_ip" 33073 2>&1; then
                  echo "  TCP $$mesh_ip:33073 REACHABLE ✓"
                else
                  echo "  TCP $$mesh_ip:33073 unreachable ✗"
                fi
              fi
              # Also test default route (different network may carry traffic)
              host_gw=$$(ip route | awk '/default/ {print $$3; exit}')
              echo "  default route (10.0.x.x) gateway: $$host_gw"
              if [ -n "$$host_gw" ] && [ "$$host_gw" != "$$mesh_ip" ]; then
                if timeout 5 nc -z -w 3 "$$host_gw" 33073 2>&1; then
                  echo "  TCP $$host_gw:33073 REACHABLE ✓"
                else
                  echo "  TCP $$host_gw:33073 unreachable ✗"
                fi
              fi
              echo
              echo "## TLS connect: netbird.mesh.aisha.internal:33073 (Signal cert — should be AISHA PKI)"
              timeout 5 sh -c 'echo | openssl s_client -connect netbird.mesh.aisha.internal:33073 -servername netbird.mesh.aisha.internal 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1' | head -5 || echo "(connect failed — internal-tls not reachable from container)"
              echo
              echo "## netbird process"
              pgrep -af netbird 2>&1 | head -5
              echo
              echo "## wg show (WireGuard peer table — true mesh state)"
              wg show 2>&1 | head -40 || echo "(wg show failed)"
              echo
              echo "## ping test: edge → CORE_MESH_IP (via wt0)"
              if [ -n "$${CORE_MESH_IP}" ]; then timeout 5 ping -c 2 -W 2 "$${CORE_MESH_IP}" 2>&1 | tail -5 || echo "(ping failed)"; else echo "(ping přeskočen — CORE_MESH_IP prázdné; diagnostika nesmí hádat adresu)"; fi
              echo
              echo "## ping test: edge → known peer hostnames (NetBird auto-DNS)"
              for peer in frontend-core frontend-core.netbird.cloud core.netbird.cloud core; do
                addr=$$(timeout 2 getent hosts "$$peer" 2>/dev/null | awk '{print $$1}' | head -1)
                if [ -n "$$addr" ]; then
                  echo "  $$peer → $$addr"
                else
                  echo "  $$peer → (not resolvable)"
                fi
              done
              echo
              echo "## /etc/resolv.conf (NetBird DNS injection)"
              cat /etc/resolv.conf 2>&1 | head -5
              echo
              echo "## netbird agent log (last 30 lines)"
              tail -30 /diag/netbird.log 2>&1
            } > /diag/status.txt.new 2>&1
            mv /diag/status.txt.new /diag/status.txt
            sleep 5
          done
        ) &

        # ─── DNS forwarder: once wt0 is up, redirect DNS arriving on the
        # coolify/internal side to THIS agent's own NetBird resolver (wt0:53).
        # Bridge containers then use mesh-router as their mesh DNS resolver with
        # NO host-netns dependency — netbird's DNS already serves the custom mesh
        # zone (netbird-dns-provision.mjs) and forwards public via its nameserver
        # group. This is why a single container on the coolify network is enough:
        # the two host-netns agents (cosmos/integration) fighting over the host
        # wt0 are no longer on the DNS path at all. Additive + best-effort
        # (set +e): a failure here never touches the mesh-routing DNAT above.
        (
          _wt0=""
          while [ -z "$${_wt0}" ]; do
            _wt0=$$(ip -4 -o addr show wt0 2>/dev/null | awk '{print $$4}' | cut -d/ -f1 | head -1)
            [ -z "$${_wt0}" ] && sleep 2
          done
          echo "[mesh-router] DNS forwarder: coolify:53 -> $${_wt0}:53"
          for _p in udp tcp; do
            iptables -t nat -C PREROUTING ! -i wt0 -p $${_p} --dport 53 \
              -j DNAT --to-destination "$${_wt0}":53 2>/dev/null \
            || iptables -t nat -A PREROUTING ! -i wt0 -p $${_p} --dport 53 \
              -j DNAT --to-destination "$${_wt0}":53 2>&1 \
            || echo "[mesh-router] WARN DNS DNAT $${_p} failed"
          done
        ) &

        # ─── Force re-enroll if asked (debug flag)
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[mesh-router] NB_FORCE_REENROLL=1 — wiping local NetBird state"
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi

        # ─── Start NetBird agent with stderr captured to /diag/netbird.log.
        # RETRY FOREVER with backoff: on a cold boot the netbird management plane
        # can come up AFTER this container (Coolify starts stacks concurrently).
        # A single attempt then fails with "context deadline exceeded" and the
        # resolver never comes up until a manual restart — the exact incident that
        # left the mesh dark after a docker daemon restart. Looping self-heals
        # enrollment once management is reachable; the container stays alive
        # throughout (the loop IS the stay-alive), so the iptables DNAT rules and
        # diag persist across attempts.
        if [ -n "$${NB_SETUP_KEY:-}" ]; then
          _attempt=0
          while true; do
            _attempt=$$((_attempt+1))
            if [ -s /etc/netbird/config.json ]; then
              echo "[mesh-router] reconnecting (existing config in volume, attempt $${_attempt})"
              netbird up --foreground-mode \
                --management-url "$${NB_MANAGEMENT_URL}" \
                --hostname "$${NB_HOSTNAME}" > /diag/netbird.log 2>&1 &
            else
              echo "[mesh-router] enrolling fresh as $${NB_HOSTNAME} (attempt $${_attempt})"
              netbird up --foreground-mode \
                --management-url "$${NB_MANAGEMENT_URL}" \
                --setup-key "$${NB_SETUP_KEY}" \
                --hostname "$${NB_HOSTNAME}" > /diag/netbird.log 2>&1 &
            fi
            NB_PID=$!
            echo "[mesh-router] netbird PID=$${NB_PID} (attempt $${_attempt})"
            wait $${NB_PID}
            echo "[mesh-router] netbird exited (rc=$?) — retrying in 10s (attempt $${_attempt})"
            sleep 10
          done
        else
          echo "[mesh-router] WARN: NB_SETUP_KEY empty — running idle (no mesh)"
          exec sleep infinity
        fi
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x netbird >/dev/null || pgrep -f 'sleep infinity' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=false"
      - "traefik.docker.network=coolify"

  extranet-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1-alpine
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-extranet-auth
    restart: unless-stopped
    profiles: ["extranet-gate"]
    cap_add:
      - NET_ADMIN
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    networks:
      - internal
      - mesh-dns
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # ⛔ VLOŽENO DOSLOVA z infra/mesh/mesh-client-route.sh — NEUPRAVUJ TADY.
        # Bind mount z repa TU NEFUNGUJE: Coolify staví edge na build serveru a na
        # cílovém uzlu repo NEMÁ, takže zdroj mountu neexistoval a Docker místo
        # souboru vytvořil ADRESÁŘ → `exit 126: Permission denied` → restart smyčka
        # (naměřeno 2026-08-21, veřejná plocha byla kvůli tomu 4 minuty dole).
        # Shodu obou kopií s kanonickým souborem hlídá brána
        # `mesh-lane-miri-jmenem-ne-hopem` (porovnává po de-escapování $$ → $).
        _mesh="$$(echo "$${MESH_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
        case "$$_mesh" in
          true|1|yes|on)
            if [ -z "$${NETBIRD_PEER_CIDR:-}" ] || [ -z "$${NETBIRD_DNS_IP:-}" ]; then
              echo "[mesh-route] FATAL: mesh je vyhlášená, ale chybí NETBIRD_PEER_CIDR nebo NETBIRD_DNS_IP." >&2
              exit 64
            fi
            if ip route replace "$${NETBIRD_PEER_CIDR}" via "$${NETBIRD_DNS_IP}" 2>&1; then
              echo "[mesh-route] routa $${NETBIRD_PEER_CIDR} → $${NETBIRD_DNS_IP} (mesh-router) postavena"
            else
              echo "[mesh-route] FATAL: routu do mesh nelze postavit — chybí NET_ADMIN, nebo služba není na síti mesh-dns." >&2
              echo "[mesh-route] NEDĚLEJ: nepokračuj bez routy — vnitřní jméno by se přeložilo wildcardem VEN." >&2
              exit 64
            fi
            ;;
          *)
            echo "[mesh-route] MESH_ENABLED=$${MESH_ENABLED:-<unset>} — routa do mesh se nestaví (veřejná lane)."
            ;;
        esac
        # ⛔ UPSTREAM VYBÍRÁ MESH SWITCH, ne pevná proměnná (naměřeno 2026-08-22).
        # Do teď tu stálo natvrdo `OAUTH2_PROXY_UPSTREAMS: ${EXTRANET_UPSTREAM_PUBLIC}`,
        # tedy `https://<jméno>` BEZ PORTU — i při zapnuté mesh. Jenže mesh-ingress
        # TLS neterminuje a na 443 nikdo neposlouchá, takže KAŽDÉ přihlášení do
        # extranetu skončilo `502 Bad Gateway` od oauth2-proxy. Zákeřné na tom bylo,
        # že ruční sonda zevnitř kontejneru na `http://<jméno>:8080` prošla — měřila
        # jinou cestu než ta, kterou jde brána. Táž třída jako `*_UPSTREAM_MESH`
        # u edge-proxy: jméno bez portu a přes TLS NENÍ cesta.
        case "$$(echo "$${MESH_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')" in
          true|1|yes|on)
            if [ -z "$${EXTRANET_UPSTREAM_MESH:-}" ]; then
              echo "[extranet-auth] FATAL: mesh je vyhlášená, ale EXTRANET_UPSTREAM_MESH je prázdné." >&2
              echo "[extranet-auth] Vydává ho derive-domains; bez něj by brána mířila na neexistující cestu." >&2
              exit 64
            fi
            export OAUTH2_PROXY_UPSTREAMS="$${EXTRANET_UPSTREAM_MESH}"
            ;;
          *)
            export OAUTH2_PROXY_UPSTREAMS="$${EXTRANET_UPSTREAM_PUBLIC}"
            ;;
        esac
        echo "[extranet-auth] upstream = $${OAUTH2_PROXY_UPSTREAMS} (MESH_ENABLED=$${MESH_ENABLED})"
        exec /bin/oauth2-proxy
    expose:
      - "4180"
    environment:
      MESH_ENABLED: ${MESH_ENABLED:?MESH_ENABLED must be generated by topology resolver}
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?vydává generate-secrets (derive-subnets); rozsah peerů pro routu do mesh}
      NETBIRD_DNS_IP: ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP}
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_PREFIX:-}extranet-proxy
      OAUTH2_PROXY_CLIENT_SECRET: ${EXTRANET_OIDC_SECRET:?generuje generate-secrets — prázdné znamená selhaný push env, ne že brána není chtěná}
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      OAUTH2_PROXY_PROFILE_URL: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      EXTRANET_UPSTREAM_PUBLIC: ${EXTRANET_UPSTREAM_PUBLIC:?vydává derive-domains; instance bez extranetu dostane .invalid sentinel}
      EXTRANET_UPSTREAM_MESH: ${EXTRANET_UPSTREAM_MESH:-}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECRET: ${EXTRANET_COOKIE_SECRET:?generuje generate-secrets (hex 16) — prázdné znamená selhaný push env}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_NAME: _aisha_extranet_proxy
      OAUTH2_PROXY_COOKIE_DOMAINS: ${OAUTH2_COOKIE_DOMAINS}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_REDIRECT_URL: https://${EXTRANET_DOMAIN_PUBLIC:?vydává derive-domains; instance bez extranetu dostane .invalid sentinel}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${OAUTH2_WHITELIST_DOMAINS}
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: roles
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4180/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  edge-proxy:
    image: ${REGISTRY_PROXY}library/caddy:2.8.4-alpine
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-edge-proxy
    restart: unless-stopped
    # Sklízí zombie `timeout` z healthchecku (úklid evidence); Caddy jako PID 1 je nesbírá.
    init: true
    cap_add:
      - NET_ADMIN
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    networks:
      - internal
      - coolify
      - mesh-dns
    expose:
      - "80"
    volumes:
      # Evidence adres má VLASTNÍ úložiště. Nepatří do edge-proxy-data: tam žije
      # stav netbirdu (klíče, konfigurace) a osobní údaje musí jít zahodit
      # samostatně, aniž se sáhne na kryptografický stav.
      - edge-pristupy:/var/log/edge
    depends_on:
      mesh-router:
        condition: service_started
    environment:
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      EDGE_DOOR_MODE: ${EDGE_DOOR_MODE:-off}
      # Doba uchování evidence adres (dní). Uplatní se jen v režimu observe.
      EDGE_ACCESS_RETENTION_DAYS: ${EDGE_ACCESS_RETENTION_DAYS:?lhůta evidence adres ve dnech — vydává env-doktor (kontrakt static 30)}
      KNOCK_UPSTREAM: ${KNOCK_UPSTREAM:-}
      MCP_DOMAIN: ${MCP_DOMAIN:?MCP_DOMAIN must be generated by topology resolver}
      API_DOMAIN_PUBLIC: ${API_DOMAIN_PUBLIC:?API_DOMAIN_PUBLIC must be generated by topology resolver}
      DIRIGENT_DOMAIN: ${DIRIGENT_DOMAIN:?DIRIGENT_DOMAIN must be generated by topology resolver}
      AUTH_DOMAIN_PUBLIC: ${AUTH_DOMAIN_PUBLIC:?AUTH_DOMAIN_PUBLIC must be generated by topology resolver}
      PUBLIC_TLD: ${PUBLIC_TLD:-}
      APP_DOMAIN: ${APP_DOMAIN:-}
      AISHA_WEB_APEX_MODE: ${AISHA_WEB_APEX_MODE:-redirect}
      MESH_ENABLED: ${MESH_ENABLED:?MESH_ENABLED must be generated by topology resolver}
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?vydává generate-secrets (derive-subnets); rozsah peerů pro routu do mesh}
      NETBIRD_DNS_IP: ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP}
      MCP_UPSTREAM: ${MCP_UPSTREAM:-}
      API_UPSTREAM: ${API_UPSTREAM:-}
      DIRIGENT_UPSTREAM: ${DIRIGENT_UPSTREAM:-}
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-}
      MCP_UPSTREAM_MESH: ${MCP_UPSTREAM_MESH:?MCP_UPSTREAM_MESH must be generated by topology resolver}
      API_UPSTREAM_MESH: ${API_UPSTREAM_MESH:?API_UPSTREAM_MESH must be generated by topology resolver}
      API_MESH_HOST: ${API_MESH_HOST:-}
      DIRIGENT_UPSTREAM_MESH: ${DIRIGENT_UPSTREAM_MESH:?DIRIGENT_UPSTREAM_MESH must be generated by topology resolver}
      AUTH_UPSTREAM_MESH: ${AUTH_UPSTREAM_MESH:?AUTH_UPSTREAM_MESH must be generated by topology resolver}
      MCP_UPSTREAM_PUBLIC: ${MCP_UPSTREAM_PUBLIC:?MCP_UPSTREAM_PUBLIC must be generated by topology resolver}
      API_UPSTREAM_PUBLIC: ${API_UPSTREAM_PUBLIC:?API_UPSTREAM_PUBLIC must be generated by topology resolver}
      DIRIGENT_UPSTREAM_PUBLIC: ${DIRIGENT_UPSTREAM_PUBLIC:?DIRIGENT_UPSTREAM_PUBLIC must be generated by topology resolver}
      AUTH_UPSTREAM_PUBLIC: ${AUTH_UPSTREAM_PUBLIC:?AUTH_UPSTREAM_PUBLIC must be generated by topology resolver}
      LIVE_DOMAIN_PUBLIC: ${LIVE_DOMAIN_PUBLIC:-}
      LIVE_UPSTREAM: ${LIVE_UPSTREAM:-}
      LIVE_UPSTREAM_MESH: ${LIVE_UPSTREAM_MESH:-}
      LIVE_UPSTREAM_PUBLIC: ${LIVE_UPSTREAM_PUBLIC:-}
      EXTRANET_DOMAIN_PUBLIC: ${EXTRANET_DOMAIN_PUBLIC:-}
      EXTRANET_AUTH_GATE: ${EXTRANET_AUTH_GATE:-0}
      EXTRANET_UPSTREAM: ${EXTRANET_UPSTREAM:-}
      EXTRANET_UPSTREAM_MESH: ${EXTRANET_UPSTREAM_MESH:-}
      EXTRANET_UPSTREAM_PUBLIC: ${EXTRANET_UPSTREAM_PUBLIC:-}
      GATEWAY_DOMAIN_PUBLIC: ${GATEWAY_DOMAIN_PUBLIC:-}
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-}
      GATEWAY_UPSTREAM_MESH: ${GATEWAY_UPSTREAM_MESH:-}
      GATEWAY_UPSTREAM_PUBLIC: ${GATEWAY_UPSTREAM_PUBLIC:-}
      COMPANION_DOMAIN_PUBLIC: ${COMPANION_DOMAIN_PUBLIC:-}
      COMPANION_UPSTREAM: ${COMPANION_UPSTREAM:-}
      COMPANION_UPSTREAM_MESH: ${COMPANION_UPSTREAM_MESH:-}
      COMPANION_UPSTREAM_PUBLIC: ${COMPANION_UPSTREAM_PUBLIC:-}
      INGEST_DOMAIN_PUBLIC: ${INGEST_DOMAIN_PUBLIC:-}
      INGEST_UPSTREAM: ${INGEST_UPSTREAM:-}
      INGEST_UPSTREAM_MESH: ${INGEST_UPSTREAM_MESH:-}
      INGEST_UPSTREAM_PUBLIC: ${INGEST_UPSTREAM_PUBLIC:-}
      POTOK_DOMAIN_PUBLIC: ${POTOK_DOMAIN_PUBLIC:-}
      POTOK_UPSTREAM: ${POTOK_UPSTREAM:-}
      POTOK_UPSTREAM_MESH: ${POTOK_UPSTREAM_MESH:-}
      POTOK_UPSTREAM_PUBLIC: ${POTOK_UPSTREAM_PUBLIC:-}
      # Řídicí rovina meshe — veřejná tvář NetBirdu (viz netbird_block níž).
      NETBIRD_DOMAIN: ${NETBIRD_DOMAIN:-}
      NETBIRD_DOMAIN_DIRECT: ${NETBIRD_DOMAIN_DIRECT:-}
      # Řídicí rovina MODELOVÉHO meshe forku (varianta C) — viz netbird_model_block níž.
      NETBIRD_MODEL_DOMAIN: ${NETBIRD_MODEL_DOMAIN:-}
      NETBIRD_MODEL_DOMAIN_DIRECT: ${NETBIRD_MODEL_DOMAIN_DIRECT:-}
      # Cizí aplikace přes mesh (EXTERNAL_FACES) — viz external_faces_block.
      EDGE_EXTERNAL_FACES: ${EDGE_EXTERNAL_FACES:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Routa do mesh JAKO PRVNÍ a bez ústupu. Až za ní `set +e`: dál platí,
        # že jednotlivý krok stavby Caddyfile edge neshodí, ale BEZ CESTY
        # DOVNITŘ nemá edge co dělat.
        set -eu
        # ⛔ VLOŽENO DOSLOVA z infra/mesh/mesh-client-route.sh — NEUPRAVUJ TADY.
        # Bind mount z repa TU NEFUNGUJE: Coolify staví edge na build serveru a na
        # cílovém uzlu repo NEMÁ, takže zdroj mountu neexistoval a Docker místo
        # souboru vytvořil ADRESÁŘ → `exit 126: Permission denied` → restart smyčka
        # (naměřeno 2026-08-21, veřejná plocha byla kvůli tomu 4 minuty dole).
        # Shodu obou kopií s kanonickým souborem hlídá brána
        # `mesh-lane-miri-jmenem-ne-hopem` (porovnává po de-escapování $$ → $).
        _mesh="$$(echo "$${MESH_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
        case "$$_mesh" in
          true|1|yes|on)
            if [ -z "$${NETBIRD_PEER_CIDR:-}" ] || [ -z "$${NETBIRD_DNS_IP:-}" ]; then
              echo "[mesh-route] FATAL: mesh je vyhlášená, ale chybí NETBIRD_PEER_CIDR nebo NETBIRD_DNS_IP." >&2
              exit 64
            fi
            if ip route replace "$${NETBIRD_PEER_CIDR}" via "$${NETBIRD_DNS_IP}" 2>&1; then
              echo "[mesh-route] routa $${NETBIRD_PEER_CIDR} → $${NETBIRD_DNS_IP} (mesh-router) postavena"
            else
              echo "[mesh-route] FATAL: routu do mesh nelze postavit — chybí NET_ADMIN, nebo služba není na síti mesh-dns." >&2
              echo "[mesh-route] NEDĚLEJ: nepokračuj bez routy — vnitřní jméno by se přeložilo wildcardem VEN." >&2
              exit 64
            fi
            ;;
          *)
            echo "[mesh-route] MESH_ENABLED=$${MESH_ENABLED:-<unset>} — routa do mesh se nestaví (veřejná lane)."
            ;;
        esac
        set +u

        set +e   # never crash on individual command failure

        # ─── Resolve upstream URLs based on MESH_ENABLED switch ────────
        # If a per-service override is set, it wins (escape hatch for
        # debugging or partial-mesh scenarios). Otherwise derive from
        # MESH_ENABLED + the *_MESH/*_PUBLIC defaults.
        case "$$(echo "$${MESH_ENABLED}" | tr '[:upper:]' '[:lower:]')" in
          true|1|yes|on)
            MESH_MODE=mesh
            MCP_UPSTREAM="$${MCP_UPSTREAM:-$${MCP_UPSTREAM_MESH}}"
            API_UPSTREAM="$${API_UPSTREAM:-$${API_UPSTREAM_MESH}}"
            DIRIGENT_UPSTREAM="$${DIRIGENT_UPSTREAM:-$${DIRIGENT_UPSTREAM_MESH}}"
            # Auth always public (mesh depends on KC, see env block comment)
            AUTH_UPSTREAM="$${AUTH_UPSTREAM:-$${AUTH_UPSTREAM_MESH}}"
            # live/gateway/companion: no mesh-router ports → mesh == public
            LIVE_UPSTREAM="$${LIVE_UPSTREAM:-$${LIVE_UPSTREAM_MESH}}"
            # ⛔ 2026-08-26: EXTRANET_UPSTREAM tu CHYBĚL — byl jen ve větvi `public`.
            # V mesh režimu tedy zůstal prázdný, blok se nevygeneroval a extranet
            # vracel 404, ačkoli kontejner běžel a doména byla zaregistrovaná.
            EXTRANET_UPSTREAM="$${EXTRANET_UPSTREAM:-$${EXTRANET_UPSTREAM_MESH}}"
            GATEWAY_UPSTREAM="$${GATEWAY_UPSTREAM:-$${GATEWAY_UPSTREAM_MESH}}"
            COMPANION_UPSTREAM="$${COMPANION_UPSTREAM:-$${COMPANION_UPSTREAM_MESH}}"
            INGEST_UPSTREAM="$${INGEST_UPSTREAM:-$${INGEST_UPSTREAM_MESH}}"
            POTOK_UPSTREAM="$${POTOK_UPSTREAM:-$${POTOK_UPSTREAM_MESH}}"
            ;;
          *)
            MESH_MODE=public
            MCP_UPSTREAM="$${MCP_UPSTREAM:-$${MCP_UPSTREAM_PUBLIC}}"
            API_UPSTREAM="$${API_UPSTREAM:-$${API_UPSTREAM_PUBLIC}}"
            DIRIGENT_UPSTREAM="$${DIRIGENT_UPSTREAM:-$${DIRIGENT_UPSTREAM_PUBLIC}}"
            AUTH_UPSTREAM="$${AUTH_UPSTREAM:-$${AUTH_UPSTREAM_PUBLIC}}"
            LIVE_UPSTREAM="$${LIVE_UPSTREAM:-$${LIVE_UPSTREAM_PUBLIC}}"
            EXTRANET_UPSTREAM="$${EXTRANET_UPSTREAM:-$${EXTRANET_UPSTREAM_PUBLIC}}"
            GATEWAY_UPSTREAM="$${GATEWAY_UPSTREAM:-$${GATEWAY_UPSTREAM_PUBLIC}}"
            COMPANION_UPSTREAM="$${COMPANION_UPSTREAM:-$${COMPANION_UPSTREAM_PUBLIC}}"
            INGEST_UPSTREAM="$${INGEST_UPSTREAM:-$${INGEST_UPSTREAM_PUBLIC}}"
            POTOK_UPSTREAM="$${POTOK_UPSTREAM:-$${POTOK_UPSTREAM_PUBLIC}}"
            ;;
        esac

        case "$${NETBIRD_DNS_IP}" in
          ""|*[!0-9.]*|.*|*.|*..*)
            echo "[edge-proxy] FATAL: NETBIRD_DNS_IP '$${NETBIRD_DNS_IP}' není IPv4 — mesh jména by neměl kdo bezpečně přeložit" >&2
            exit 64 ;;
        esac
        mesh_dns=$$(printf '(mesh_dns) {\n  transport http {\n    resolvers %s\n  }\n}' "$${NETBIRD_DNS_IP}")

        for required_var in MCP_DOMAIN API_DOMAIN_PUBLIC DIRIGENT_DOMAIN AUTH_DOMAIN_PUBLIC MCP_UPSTREAM API_UPSTREAM DIRIGENT_UPSTREAM AUTH_UPSTREAM; do
          required_value="$$(printenv "$${required_var}" 2>/dev/null || true)"
          if [ -z "$${required_value}" ]; then
            echo "[edge-proxy] FATAL: $${required_var} is empty after topology resolution" >&2
            exit 64
          fi
        done

        echo "[edge-proxy] generating Caddyfile (MESH_MODE=$${MESH_MODE}, MESH_ENABLED=$${MESH_ENABLED})"
        echo "[edge-proxy] MCP_DOMAIN=$${MCP_DOMAIN}    → $${MCP_UPSTREAM}"
        echo "[edge-proxy] API_DOMAIN_PUBLIC=$${API_DOMAIN_PUBLIC} → $${API_UPSTREAM}"
        echo "[edge-proxy] DIRIGENT_DOMAIN=$${DIRIGENT_DOMAIN}  → $${DIRIGENT_UPSTREAM}"
        echo "[edge-proxy] AUTH_DOMAIN_PUBLIC=$${AUTH_DOMAIN_PUBLIC} → $${AUTH_UPSTREAM}"

        # ─── Apex redirect block (env-derived, conditional) ─────────────
        # PUBLIC_TLD set + different from APP_DOMAIN + AISHA_WEB_APEX_MODE
        # not "serve" → serve the bare apex host with HTTP 308 to
        # https://$${APP_DOMAIN}{uri} (Caddy {uri} carries path AND query).
        # In serve mode, Coolify routes the apex to the web SPA container and
        # this edge-proxy router is disabled via EDGE_APEX_DOMAIN sentinel.
        apex_block=""
        apex_mode="$$(echo "$${AISHA_WEB_APEX_MODE:-redirect}" | tr '[:upper:]' '[:lower:]')"
        if [ -n "$${PUBLIC_TLD:-}" ] && [ -n "$${APP_DOMAIN:-}" ] && [ "$${PUBLIC_TLD}" != "$${APP_DOMAIN}" ] && [ "$${apex_mode}" != "serve" ]; then
          echo "[edge-proxy] apex redirect ENABLED: $${PUBLIC_TLD} → https://$${APP_DOMAIN}{uri} (308)"
          apex_block=$$(printf '@apex host %s\n  handle @apex {\n    redir https://%s{uri} 308\n  }' "$${PUBLIC_TLD}" "$${APP_DOMAIN}")
        else
          echo "[edge-proxy] apex redirect disabled (PUBLIC_TLD unset, equal to APP_DOMAIN, or AISHA_WEB_APEX_MODE=serve)"
        fi

        # Strip protocol from upstream URL to extract host for Host header.
        # Caddy needs the UPSTREAM hostname (${API_DOMAIN}) sent as Host
        # so backend's Traefik (which routes by Host) finds the gateway.
        #
        # EXCEPTION — mcp/dirigent (the oauth2-proxied n8n aliases): those
        # routes forward the BROWSER Host instead. Verified 2026-07-03 in
        # prod: backend Traefik treats the X-Forwarded-Host set here as
        # untrusted and rewrites it to the Host it received, so oauth2-proxy
        # (REVERSE_PROXY=true) derived cookie Domain + redirect_uri from the
        # INTERNAL host (Set-Cookie Domain=<internal zone> on mcp.<public
        # zone> → browser drops it → login loop; Keycloak was unaffected only
        # because KC_HOSTNAME pins its public issuer). Forwarding the browser
        # Host works because the orchestration app registers the public
        # aliases in docker_compose_domains (backend Traefik routes them to
        # n8n-auth — see coolify-domain-doctor.mjs aisha-orchestration).
        # Upstream TLS/SNI still targets the internal URL host, so the
        # backend wildcard cert stays valid.
        # API lane: SPOJENÍ jde přes netbird hop (mesh-router:<port>), ale
        # přísný mesh-ingress na core uzlu routuje podle Host = <endpoint>.<zóna>
        # a všechno ostatní odmítá 421. Derivace proto vydává API_MESH_HOST
        # (core-gateway.<interní zóna>); bez něj se drží host z upstream URL —
        # starý ingress na Host nekoukal, takže fallback nikoho nerozbije.
        # ⛔ NAMĚŘENO 2026-08-26. Tohle brávalo `API_MESH_HOST` BEZPODMÍNEČNĚ,
        # tedy i když edge běží v režimu `public`. Do hlavičky Host pak šlo
        # MESHOVÉ jméno, jenže na veřejné cestě ho Traefik na cílovém uzlu nezná:
        #   Host: <prefix>-core-gateway.backend.<tld>  → 404
        #   Host: <prefix>-api.backend.<tld>           → 200
        # Upstream se přitom trefil správně — chyboval jen NÁZEV, kterým jsme se
        # mu představili. Projevilo se to jako 404 na api, tedy jako by routa
        # chyběla, ačkoli existovala a cíl odpovídal.
        # Host proto musí následovat REŽIM, ne existenci proměnné.
        if [ "$${MESH_MODE}" = "mesh" ] && [ -n "$${API_MESH_HOST:-}" ]; then
          api_host="$${API_MESH_HOST}"
        else
          api_host=$$(echo "$${API_UPSTREAM}" | sed -E 's,^https?://,,;s,/.*,,')
        fi
        auth_host=$$(echo "$${AUTH_UPSTREAM}" | sed -E 's,^https?://,,;s,/.*,,')

        # Internal-zone upstream TLS trust: see compose-notes (api_tls/auth_tls).
        api_tls=$$(printf '\n              import mesh_dns')
        auth_tls=$$(printf '\n              import mesh_dns')
        case "$${API_UPSTREAM}" in
          https://*) api_tls=$$(printf '\n              transport http {\n                resolvers %s\n                tls_insecure_skip_verify\n                tls_server_name %s\n              }' "$${NETBIRD_DNS_IP}" "$${api_host}") ;;
        esac
        case "$${AUTH_UPSTREAM}" in
          https://*) auth_tls=$$(printf '\n              transport http {\n                resolvers %s\n                tls_insecure_skip_verify\n                tls_server_name %s\n              }' "$${NETBIRD_DNS_IP}" "$${auth_host}") ;;
        esac

        # live.${PUBLIC_TLD} (ws-gateway) — OPTIONAL route, built only when
        # realtime is enabled (LIVE_UPSTREAM resolved + LIVE_DOMAIN_PUBLIC not the
        # .invalid sentinel). Caddy reverse_proxy upgrades WebSocket natively.
        # Conditional injection mirrors apex_block so disabled profiles emit
        # nothing (an empty reverse_proxy would crash Caddy).
        live_block=""
        if [ -n "$${LIVE_UPSTREAM}" ] && [ -n "$${LIVE_DOMAIN_PUBLIC}" ] && [ "$${LIVE_DOMAIN_PUBLIC}" != "live-disabled.invalid" ]; then
          live_host=$$(echo "$${LIVE_UPSTREAM}" | sed -E 's,^https?://,,;s,/.*,,')
          echo "[edge-proxy] LIVE_DOMAIN_PUBLIC=$${LIVE_DOMAIN_PUBLIC} → $${LIVE_UPSTREAM} (ws)"
          live_block=$$(printf '@live host %s\n  handle @live {\n    reverse_proxy %s {\n      header_up Host %s\n      header_up X-Forwarded-Host {http.request.host}\n      header_up X-Forwarded-Proto https\n      import mesh_dns\n    }\n  }' "$${LIVE_DOMAIN_PUBLIC}" "$${LIVE_UPSTREAM}" "$${live_host}")
        else
          echo "[edge-proxy] live route disabled (realtime not in profile / LIVE_UPSTREAM empty)"
        fi

        # extra.${PUBLIC_TLD} (customer extranet surface) — OPTIONAL route, same
        # conditional-injection contract as live_block. The extranet is its own
        # container/compose; edge only ROUTES the public host. Until 2026-07-29
        # the extranet carried the public domain itself and bypassed edge.
        extranet_block=""
        # BRÁNA: je-li zapnutá, veřejný provoz jde na oauth2-proxy, ne na
        # povrch. Nepřihlášený tak nedostane ani bundle.
        #
        # FAIL-CLOSED, a to je celý smysl: když je brána vyhlášená
        # (EXTRANET_AUTH_GATE=1), ale nedá se použít, extranet se NEZVEŘEJNÍ
        # vůbec. Opačné pořadí — „nejde brána, tak pusť provoz přímo" — je
        # přesně ta tichá degradace, kvůli které tohle celé vzniklo: povrch by
        # běžel dál, jen by byl otevřený, a nikdo by si toho nevšiml.
        if [ "$${EXTRANET_AUTH_GATE:-0}" = "1" ]; then
          if [ -z "$${EXTRANET_DOMAIN_PUBLIC}" ]; then
            echo "[edge-proxy] extranet: brána vyhlášená, ale EXTRANET_DOMAIN_PUBLIC prázdné — route VYPNUTA"
          elif ! wget -q -O /dev/null --timeout=3 http://extranet-auth:4180/ping 2>/dev/null; then
            echo "[edge-proxy] extranet: brána vyhlášená, ale extranet-auth NEODPOVÍDÁ — route VYPNUTA (radši nedostupné než otevřené)"
          else
            echo "[edge-proxy] EXTRANET_DOMAIN_PUBLIC=$${EXTRANET_DOMAIN_PUBLIC} → extranet-auth:4180 (brána zapnutá)"
            extranet_block=$$(printf '@extranet host %s\n  handle @extranet {\n    reverse_proxy http://extranet-auth:4180 {\n      header_up X-Forwarded-Host {http.request.host}\n      header_up X-Forwarded-Proto https\n    }\n  }' "$${EXTRANET_DOMAIN_PUBLIC}")
          fi
        elif [ -n "$${EXTRANET_UPSTREAM}" ] && [ -n "$${EXTRANET_DOMAIN_PUBLIC}" ]; then
          extranet_host=$$(echo "$${EXTRANET_UPSTREAM}" | sed -E 's,^https?://,,;s,/.*,,')
          echo "[edge-proxy] EXTRANET_DOMAIN_PUBLIC=$${EXTRANET_DOMAIN_PUBLIC} → $${EXTRANET_UPSTREAM} (BEZ brány)"
          extranet_block=$$(printf '@extranet host %s\n  handle @extranet {\n    reverse_proxy %s {\n      header_up Host %s\n      header_up X-Forwarded-Host {http.request.host}\n      header_up X-Forwarded-Proto https\n      import mesh_dns\n    }\n  }' "$${EXTRANET_DOMAIN_PUBLIC}" "$${EXTRANET_UPSTREAM}" "$${extranet_host}")
        else
          echo "[edge-proxy] extranet route disabled (not in profile / EXTRANET_UPSTREAM empty)"
        fi

        # gateway.${PUBLIC_TLD} (LLM gateway — IDE proxy surface) — OPTIONAL
        # route, same conditional-injection contract as live_block.
        gateway_block=""
        if [ -n "$${GATEWAY_UPSTREAM}" ] && [ -n "$${GATEWAY_DOMAIN_PUBLIC}" ] && [ "$${GATEWAY_DOMAIN_PUBLIC}" != "gateway-disabled.invalid" ]; then
          gateway_host=$$(echo "$${GATEWAY_UPSTREAM}" | sed -E 's,^https?://,,;s,/.*,,')
          echo "[edge-proxy] GATEWAY_DOMAIN_PUBLIC=$${GATEWAY_DOMAIN_PUBLIC} → $${GATEWAY_UPSTREAM}"
          gateway_block=$$(printf '@gateway host %s\n  handle @gateway {\n    reverse_proxy %s {\n      header_up Host %s\n      header_up X-Forwarded-Host {http.request.host}\n      header_up X-Forwarded-Proto https\n      import mesh_dns\n    }\n  }' "$${GATEWAY_DOMAIN_PUBLIC}" "$${GATEWAY_UPSTREAM}" "$${gateway_host}")
        else
          echo "[edge-proxy] gateway route disabled (llm-gateway not in profile / GATEWAY_UPSTREAM empty)"
        fi

        # companion.${PUBLIC_TLD} (OpenClaw advisory companion) — OPTIONAL
        # route, same conditional-injection contract as live_block.
        companion_block=""
        if [ -n "$${COMPANION_UPSTREAM}" ] && [ -n "$${COMPANION_DOMAIN_PUBLIC}" ] && [ "$${COMPANION_DOMAIN_PUBLIC}" != "companion-disabled.invalid" ]; then
          companion_host=$$(echo "$${COMPANION_UPSTREAM}" | sed -E 's,^https?://,,;s,/.*,,')
          echo "[edge-proxy] COMPANION_DOMAIN_PUBLIC=$${COMPANION_DOMAIN_PUBLIC} → $${COMPANION_UPSTREAM}"
          companion_block=$$(printf '@companion host %s\n  handle @companion {\n    reverse_proxy %s {\n      header_up Host %s\n      header_up X-Forwarded-Host {http.request.host}\n      header_up X-Forwarded-Proto https\n      import mesh_dns\n    }\n  }' "$${COMPANION_DOMAIN_PUBLIC}" "$${COMPANION_UPSTREAM}" "$${companion_host}")
        else
          echo "[edge-proxy] companion route disabled (openclaw not in profile / COMPANION_UPSTREAM empty)"
        fi

        # ingest.${PUBLIC_TLD} (svc-local-ingest verified-document cockpit) —
        # OPTIONAL admin-UI route, same conditional-injection contract as
        # companion_block. Auth-required: the app's own fail-closed bearer token
        # (INGEST_TOKEN) gates every request behind this edge face.
        ingest_block=""
        if [ -n "$${INGEST_UPSTREAM}" ] && [ -n "$${INGEST_DOMAIN_PUBLIC}" ] && [ "$${INGEST_DOMAIN_PUBLIC}" != "ingest-disabled.invalid" ]; then
          echo "[edge-proxy] INGEST_DOMAIN_PUBLIC=$${INGEST_DOMAIN_PUBLIC} → $${INGEST_UPSTREAM}"
          ingest_block=$$(printf '@ingest host %s\n  handle @ingest {\n    reverse_proxy %s {\n      header_up Host {http.request.host}\n      header_up X-Forwarded-Host {http.request.host}\n      header_up X-Forwarded-Proto https\n      import mesh_dns\n    }\n  }' "$${INGEST_DOMAIN_PUBLIC}" "$${INGEST_UPSTREAM}")
        else
          echo "[edge-proxy] ingest route disabled (local-ingest not in profile / INGEST_UPSTREAM empty)"
        fi

        # potok.${PUBLIC_TLD} (svc-potok flow-runtime cockpit) — OPTIONAL admin-UI
        # route, same conditional-injection contract as companion_block.
        # Auth-required: the app's own fail-closed bearer token (POTOK_TOKEN, W2).
        potok_block=""
        if [ -n "$${POTOK_UPSTREAM}" ] && [ -n "$${POTOK_DOMAIN_PUBLIC}" ] && [ "$${POTOK_DOMAIN_PUBLIC}" != "potok-disabled.invalid" ]; then
          echo "[edge-proxy] POTOK_DOMAIN_PUBLIC=$${POTOK_DOMAIN_PUBLIC} → $${POTOK_UPSTREAM}"
          potok_block=$$(printf '@potok host %s\n  handle @potok {\n    reverse_proxy %s {\n      header_up Host {http.request.host}\n      header_up X-Forwarded-Host {http.request.host}\n      header_up X-Forwarded-Proto https\n      import mesh_dns\n    }\n  }' "$${POTOK_DOMAIN_PUBLIC}" "$${POTOK_UPSTREAM}")
        else
          echo "[edge-proxy] potok route disabled (potok not in profile / POTOK_UPSTREAM empty)"
        fi

        # netbird.${PUBLIC_TLD} — řídicí rovina meshe. VÝJIMKA z „veřejné jde přes
        # edge DO MESHE" (majitel 2026-09-16): mesh staví, v ní být nemůže, takže
        # edge jde na PŘÍMOU tvář. Ta nese veřejný certifikát → ověřuje se.
        # `flush_interval -1`: gRPC streamy a relay WebSocket přes h1 skok.
        # Rozbor a měření: docs/compose-notes/docker-compose.coolify-prebuilt.yml.md
        netbird_block=""
        if [ -n "$${NETBIRD_DOMAIN}" ] && [ -n "$${NETBIRD_DOMAIN_DIRECT}" ] \
          && [ "$${NETBIRD_DOMAIN%.invalid}" = "$${NETBIRD_DOMAIN}" ] \
          && [ "$${NETBIRD_DOMAIN_DIRECT%.invalid}" = "$${NETBIRD_DOMAIN_DIRECT}" ] \
          && [ "$${NETBIRD_DOMAIN}" != "$${NETBIRD_DOMAIN_DIRECT}" ]; then
          echo "[edge-proxy] NETBIRD_DOMAIN=$${NETBIRD_DOMAIN} → https://$${NETBIRD_DOMAIN_DIRECT} (přímá tvář — řídicí rovina meshe, mimo mesh)"
          netbird_block=$$(printf '@netbird host %s\n  handle @netbird {\n    reverse_proxy https://%s {\n      header_up Host %s\n      header_up X-Forwarded-Host {http.request.host}\n      header_up X-Forwarded-Proto https\n      flush_interval -1\n    }\n  }' "$${NETBIRD_DOMAIN}" "$${NETBIRD_DOMAIN_DIRECT}" "$${NETBIRD_DOMAIN_DIRECT}")
        else
          # Jedno jméno pro obě tváře (jednouzlová topologie, instanční profil):
          # jméno patří netbird-proxy, edge by jinak proxoval sám na sebe.
          echo "[edge-proxy] netbird route disabled (netbird not in profile / NETBIRD_DOMAIN_DIRECT empty / same name as NETBIRD_DOMAIN)"
        fi
        # mesh-model.${PUBLIC_TLD} — řídicí rovina MODELOVÉHO meshe forku (varianta C):
        # jediný vstup uzlu na GPU slotu (Signal/Relay/management pod týmž jménem, TCP 443).
        # Týž tvar jako netbird_block: přímá tvář, ověřený certifikát, flush_interval -1.
        netbird_model_block=""
        if [ -n "$${NETBIRD_MODEL_DOMAIN}" ] && [ -n "$${NETBIRD_MODEL_DOMAIN_DIRECT}" ] \
          && [ "$${NETBIRD_MODEL_DOMAIN%.invalid}" = "$${NETBIRD_MODEL_DOMAIN}" ] \
          && [ "$${NETBIRD_MODEL_DOMAIN_DIRECT%.invalid}" = "$${NETBIRD_MODEL_DOMAIN_DIRECT}" ] \
          && [ "$${NETBIRD_MODEL_DOMAIN}" != "$${NETBIRD_MODEL_DOMAIN_DIRECT}" ]; then
          echo "[edge-proxy] NETBIRD_MODEL_DOMAIN=$${NETBIRD_MODEL_DOMAIN} → https://$${NETBIRD_MODEL_DOMAIN_DIRECT} (přímá tvář — řídicí rovina modelového meshe)"
          netbird_model_block=$$(printf '@modelovymesh host %s\n  handle @modelovymesh {\n    reverse_proxy https://%s {\n      header_up Host %s\n      header_up X-Forwarded-Host {http.request.host}\n      header_up X-Forwarded-Proto https\n      flush_interval -1\n    }\n  }' "$${NETBIRD_MODEL_DOMAIN}" "$${NETBIRD_MODEL_DOMAIN_DIRECT}" "$${NETBIRD_MODEL_DOMAIN_DIRECT}")
        else
          echo "[edge-proxy] netbird-model route disabled (instance nemá modelový mesh / NETBIRD_MODEL_DOMAIN_DIRECT prázdná / totéž jméno)"
        fi
        # Cizí aplikace (EXTERNAL_FACES) — `<veřejné>|<mesh upstream>;…`
        # z derivace. Host se NEPŘEPISUJE: aplikace mimo platformu mesh jméno
        # nezná a skládá z Hostu vlastní absolutní adresy. Rozbor: compose-notes.
        external_faces_block=""
        _ef_n=0
        _ef_nl='
        '
        _ef_zbytek="$${EDGE_EXTERNAL_FACES:-}"
        while [ -n "$$_ef_zbytek" ]; do
          _ef="$${_ef_zbytek%%;*}"
          case "$$_ef_zbytek" in *";"*) _ef_zbytek="$${_ef_zbytek#*;}" ;; *) _ef_zbytek="" ;; esac
          _ef_host="$${_ef%%|*}"
          _ef_up="$${_ef#*|}"
          if [ -z "$$_ef_host" ] || [ -z "$$_ef_up" ] || [ "$$_ef_up" = "$$_ef" ]; then
            echo "[edge-proxy] EDGE_EXTERNAL_FACES: vadná položka '$$_ef' — přeskočena"
            continue
          fi
          # Obsah jde do Caddyfile doslova: mezera, `{`, `}` nebo druhé `|` by ho
          # rozbily a nenaběhla by ŽÁDNÁ veřejná tvář, ne jen tahle.
          case "$$_ef_host$$_ef_up" in
            *[!A-Za-z0-9.:/_-]*)
              echo "[edge-proxy] EDGE_EXTERNAL_FACES: položka '$$_ef' má nepovolený znak — přeskočena"
              continue ;;
          esac
          _ef_n=$$((_ef_n + 1))
          echo "[edge-proxy] external face $$_ef_host → $$_ef_up"
          external_faces_block="$${external_faces_block}$${_ef_nl}$$(printf '@external_face_%s host %s\n  handle @external_face_%s {\n    reverse_proxy %s {\n      header_up X-Forwarded-Host {http.request.host}\n      header_up X-Forwarded-Proto https\n      import mesh_dns\n    }\n  }' "$$_ef_n" "$$_ef_host" "$$_ef_n" "$$_ef_up")"
        done
        [ "$$_ef_n" -gt 0 ] || echo "[edge-proxy] external faces: none (EDGE_EXTERNAL_FACES empty)"

        mkdir -p /etc/caddy
        # ⛔ NAMĚŘENO 2026-08-31/09-01: edge je PRVNÍ náš skok a bez `trusted_proxies`
        # Caddy příchozímu `x-forwarded-for` NEDŮVĚŘUJE a přepíše ho adresou souseda.
        # HAProxy na pfSense přitom hlavičku nastavuje autoritativně
        # (`del-header` + `set-header X-Forwarded-For %[src]`), takže klientská
        # adresa DORAZÍ až sem — a tady se zahodila. Brána pak viděla jediný prvek
        # (mesh skok) a `enforce` by zamkl i majitele.
        #
        # Podvržení tím nevzniká: pfSense hlavičku MAŽE a přepisuje, takže co si
        # klient napíše sám, se k nám vůbec nedostane. Ověřeno POKUSEM —
        # `X-Real-IP: 1.2.3.4` i `X-Forwarded-For: 9.9.9.9` byly zahozeny.
        #
        # PODMÍNĚNĚ: prázdná hodnota by dala `trusted_proxies static` bez argumentů
        # a Caddy by NENABĚHL — edge je veřejná plocha, tady se nehádá ani nekrachuje
        # potichu. Nedoručený seznam se řekne NAHLAS a řetěz zůstane jak byl.
        global_block=""
        if [ -n "$${GATEWAY_TRUSTED_PROXIES:-}" ]; then
          global_block=$$(printf '{\n  servers {\n    trusted_proxies static %s\n  }\n}\n' \
            "$$(echo "$${GATEWAY_TRUSTED_PROXIES}" | tr ',' ' ')")
          echo "[edge-proxy] trusted_proxies: $${GATEWAY_TRUSTED_PROXIES}"
        else
          echo "[edge-proxy] GATEWAY_TRUSTED_PROXIES NEDORUČEN — x-forwarded-for bude PŘEPSÁN a klientská adresa se ztratí"
        fi

        # ── DVEŘE NA EDGE ────────────────────────────────────────────────
        # Zadání majitele 2026-09-01: „celý edge zavřít, na všech úrovních —
        # nezaklepeš, dveře se neotevřou, a teprve pak se můžeš přihlásit."
        #
        # Zavřeno je VŠECHNO, bez výčtu ploch. Seznam „co je zavřené" by byl
        # druhý domov téže pravdy: musel by se udržovat, rozešel by se s
        # katalogem a nová plocha by se do něj zapomněla doplnit. Jedna věta
        # bez výčtu se nemá s čím rozejít.
        #
        # Nezamkneme se: klepání chodí po UDP $${SPA_KNOCK_PUBLIC_PORT}, tedy
        # ÚPLNĚ MIMO Caddy. Cesta dovnitř zůstává otevřená z principu, ne z
        # výjimky.
        #
        # ⛔ `client_ip`, NE `remote_ip`. Jsou to dva RŮZNÉ matchery:
        # `remote_ip` bere adresu TCP spojení — u nás mesh skok — a zamkl by
        # všechny včetně majitele. `client_ip` počítá klienta chůzí přes
        # `trusted_proxies`, tedy tu adresu, kterou nastavil HAProxy na pfSense
        # (`del-header` + `set-header %[src]`, ověřeno pokusem o podvržení).
        # Proto ten globální blok výš NENÍ příprava, ale PODMÍNKA.
        #
        # Nasazení samo NIC NEZAVŘE: dokud `EDGE_DOOR_MODE` není `enforce`,
        # Caddyfile vzniká přesně jako dosud. Zapnutí je JEDNA proměnná a dělá
        # se vědomě, ne jako vedlejší účinek deploye.
        # ⛔ NE statický seznam adres: Caddyfile vzniká při STARTU kontejneru,
        # takže pozdější zaťukání by se do něj nedostalo bez restartu edge —
        # a to už nejsou dveře, ale pravidlo ve zdi. Rozhoduje se ZA BĚHU,
        # dotazem na `svc-knock`, tedy na toho, kdo mapu zaťukaných PÍŠE.
        # Jeden vlastník zápisu i verdiktu; druhé spojení by byla druhá mapa.
        #
        # `copy_headers` není potřeba — Caddy posílá `forward_auth` původní
        # hlavičky včetně `x-forwarded-for`, a `svc-knock` z nich odvodí klienta
        # TOUŽ chůzí jako gateway (tentýž `GATEWAY_TRUSTED_PROXIES`).
        door_open=""; door_close=""; access_log=""
        # ── HODNOTA DVEŘÍ MÁ JEDEN DOMOV ─────────────────────────────────
        # Do 2026-09-19 se `EDGE_DOOR_MODE` četl syrový na třech místech. `Observe`,
        # `ENFORCE` i `enforce ` proto tiše spadly na `off` — tedy na OTEVŘENO, a to
        # u hodnoty, jejímž jediným smyslem je zavírat. Překlep neměl být rozdíl mezi
        # zavřeno a otevřeno. Normalizuje se JEDNOU (vzor `_mesh` výš) a neznámá
        # hodnota se OZVE místo tichého dosazení.
        _door="$$(printf '%s' "$${EDGE_DOOR_MODE:-off}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
        # ⛔ NEZNÁMÁ HODNOTA = EDGE NENASTARTUJE (fail-closed). Dřívější verze tohoto
        # bloku hlásila vadu a pokračovala s otevřenými dveřmi — jenže varování v logu
        # nikoho nezastaví a operátor, který napsal `enfroce`, se právě spolehl na
        # zavřeno. Tiché otevření je přesně to, co má dveřní mechanismus vylučovat.
        # Doktrína je tu jednotná s extranetem výš („radši nedostupné než otevřené")
        # i s gatewayí (services/gateway/src/config.ts — se zapnutými dveřmi a bez
        # GATEWAY_TRUSTED_PROXIES odmítne start).
        case "$$_door" in
          off|observe|enforce) ;;
          *) echo "[edge-proxy] ⛔ EDGE_DOOR_MODE='$${EDGE_DOOR_MODE}' NENÍ známá hodnota."
             echo "[edge-proxy]    Platné: off | observe | enforce"
             echo "[edge-proxy]    NESPOUŠTÍM SE. Překlep v bezpečnostním přepínači nesmí skončit"
             echo "[edge-proxy]    otevřenými dveřmi — kdo napsal jinou hodnotu, spoléhal na zavřeno."
             exit 1 ;;
        esac
        # ── SLEDOVACÍ REŽIM ──────────────────────────────────────────────
        # `observe` je třetí stav mezi `off` a `enforce`: nezavírá NIKOMU, jen zapíše,
        # kdo chodí. Smysl je změřit to PŘED zavřením, aby seznam povolených adres
        # nevznikal až z reklamací.
        #
        # ⛔ ZÁMĚRNĚ NE PŘES `forward_auth`. Pustit provoz na svc-knock a verdikt
        # zahodit by knock dostalo do kritické cesty KAŽDÉHO požadavku: jeho výpadek
        # pak není "dveře nehlídají", ale 502 na celou veřejnou plochu. Sledování
        # nesmí být rizikovější než stav, který nahrazuje. Caddy log spadnout nemůže.
        #
        # Pravdivost adresy stojí na `trusted_proxies` výš. Bez něj se do logu zapíše
        # adresa skoku; nástroj `scripts/dvernik-evidence.mjs` proto z takové evidence
        # ODMÍTNE navrhovat (touž zásadou jako gateway, services/gateway/src/config.ts).
        # ── ÚKLID EVIDENCE ADRES — VE VŠECH REŽIMECH ─────────────────────
        # Evidence z dřívějšího `observe` musí vypršet i po přepnutí na off/enforce.
        # Lhůta je deklarace s právním dosahem: neznámou nehádat (`0` = v Caddy „navždy").
        _keep="$$(printf '%s' "$${EDGE_ACCESS_RETENTION_DAYS}" | tr -d '[:space:]')"
        case "$$_keep" in
          ''|0*|*[!0-9]*)
            echo "[edge-proxy] ⛔ EDGE_ACCESS_RETENTION_DAYS='$${EDGE_ACCESS_RETENTION_DAYS}' není kladný počet dní."
            echo "[edge-proxy]    NESPOUŠTÍM SE. Evidence adres by se uchovávala jinak, než je deklarováno."
            exit 1 ;;
        esac
        # Vykonavatelem je HEALTHCHECK (níž), ne smyčka: smyčka umře potichu,
        # healthcheck Docker spouští, dokud kontejner běží. Proč, pořadí řezu
        # a mez N+1 dní: compose-notes, „Úklid evidence adres". NEPŘESOUVAT do smyčky.
        printf '#!/bin/sh\nN=%s\n' "$$_keep" > /tmp/edge-uklid.sh
        cat >> /tmp/edge-uklid.sh <<'UKLID'
        D=/var/log/edge; A=$$D/pristupy.log; Z=/tmp/edge-uklid.zamek
        [ -d "$$D" ] || exit 0
        # Zámek nese čas. Healthcheck zabitý timeoutem ho nechá ležet — po 10 min se převezme.
        if ! mkdir "$$Z" 2>/dev/null; then
          [ -n "$$(find "$$Z" -maxdepth 0 -mmin +10)" ] || exit 0
          rm -f "$$Z/od"; rmdir "$$Z" 2>/dev/null; mkdir "$$Z" 2>/dev/null || exit 0
        fi
        date -u +%FT%TZ > "$$Z/od"
        # Řez 1× za 24 h. Pořadí přežije zabití: kopie do dočasného → mv na archiv (UTC datum)
        # → zkrácení aktivního → .rez. Zkracuje se i po selhání kopie: lhůta má přednost.
        # Kopie přes `tr`, ne `cp`: Caddy nemá O_APPEND, po zkrácení píše na starý posun → díra z nul.
        if [ -s "$$A" ] && [ -z "$$(find "$$D/.rez" -mmin -1440 2>/dev/null)" ]; then
          tr -d '\000' < "$$A" > "$$D/.rez-rozpracovano" && mv -f "$$D/.rez-rozpracovano" "$$A.$$(date -u +%F)"
          : > "$$A"; touch "$$D/.rez"
        fi
        find "$$D" -maxdepth 1 -type f -name 'pristupy*' ! -name pristupy.log -mmin +$$((N * 1440)) -delete
        find "$$D" -maxdepth 1 -type f -name .rez-rozpracovano -mmin +10 -delete
        rm -f "$$Z/od"; rmdir "$$Z"
        UKLID
        chmod +x /tmp/edge-uklid.sh
        if [ "$$_door" = "observe" ]; then
          access_log=$$(printf 'log {\n    output file /var/log/edge/pristupy.log {\n      roll_size 10MiB\n      roll_keep 5\n      roll_keep_days %s\n    }\n    format filter {\n      wrap json\n      fields {\n        request>headers delete\n        request>uri delete\n        request>tls delete\n        request>remote_port delete\n        request>proto delete\n        resp_headers delete\n        user_id delete\n        bytes_read delete\n        duration delete\n        size delete\n      }\n    }\n  }\n' "$$_keep")
          echo "[edge-proxy] dveře: observe — NEZAVÍRÁ SE NIC. Eviduji adresy do /var/log/edge/pristupy.log (uchování $$_keep dní)."
          if [ -z "$${GATEWAY_TRUSTED_PROXIES:-}" ]; then
            echo "[edge-proxy] ⚠ observe BEZ GATEWAY_TRUSTED_PROXIES — v evidenci bude adresa skoku, ne klienta. Návrh allowlistu z ní bude odmítnut."
          fi
        fi
        if [ "$$_door" = "enforce" ]; then
          if [ -z "$${KNOCK_UPSTREAM:-}" ]; then
            echo "[edge-proxy] ⛔ EDGE_DOOR_MODE=enforce, ale KNOCK_UPSTREAM je PRÁZDNÝ — dveře by neměl kdo hlídat. NEZAVÍRÁ SE."
          else
            # ⛔ NAMĚŘENO 2026-09-01 V PROVOZU: `handle /__edge_health` stálo v
            # souboru VÝŠ, a přesto ho dveře zavřely — Caddy neřadí direktivy
            # podle pořadí v textu, ale podle vlastního pořadníku, a
            # `forward_auth` v něm běží PŘED `handle`. Kontejner si tím zabil
            # vlastní healthcheck: `unhealthy` → Traefik „no available server"
            # → 503 na celou veřejnou plochu → Coolify restart → a znovu.
            #
            # Komentář o tom, že health zůstává před dveřmi, jsem měl napsaný
            # SPRÁVNĚ; nesplnila ho implementace. Pořadí se proto nespoléhá na
            # text — cesta se vyjímá MATCHEREM, který na pořadníku nezávisí.
            # ⭐ BEZ MATCHERE: health se přestěhoval na neveřejnou `:8081`, takže
            # na `:80` není co vyjímat a dveře platí na všechno. Dřív tu musel
            # být `@mimo_dvere not path /__edge_health` — a byl to jediný důvod,
            # proč veřejný povrch vůbec něco prozrazoval.
            door_open=$$(printf 'forward_auth %s {\n    uri /dvere\n  }\n' "$${KNOCK_UPSTREAM}")
            echo "[edge-proxy] dveře ZAVŘENY — verdikt dává $${KNOCK_UPSTREAM}/dvere"
          fi
        else
          echo "[edge-proxy] dveře: $${EDGE_DOOR_MODE:-off} — nezavírá se nic"
        fi

        cat > /etc/caddy/Caddyfile <<CADDY
        $${global_block}
        $${mesh_dns}
        # ⛔ HEALTH NESMÍ ODPOVÍDAT SVĚTU. Do 2026-09-02 stál `handle /__edge_health`
        # na VEŘEJNÉ `:80` a dveře ho musely vyjímat matcherem. Odpověď „ok 200"
        # komukoli je ale prozrazení: scanner se dozví, že tu něco běží a je to
        # živé — a to je přesně to, co má tichý edge upřít. Zavřené dveře se
        # nemají dát odlišit od zavřeného portu.
        #
        # ⭐ SPRÁVNÁ OTÁZKA NEBYLA „jak pustit health skrz dveře", ale „proč vede
        # health přes veřejný vstup". Sonda je vnitřní věc kontejneru: healthcheck
        # chodí po LOOPBACKU. Nemá tedy důvod sdílet listener se světem.
        #
        # Port 8081 se NEPUBLIKUJE ani nevystavuje (`expose` nese jen 80), takže
        # Traefik na něj nesměruje a zvenčí neexistuje. Tím padá i potřeba výjimky
        # v matcheru: veřejná `:80` žádnou health cestu NEMÁ, není co vyjímat.
        :8081 {
          handle /__edge_health {
            respond "ok" 200
          }
          # Cokoli jiného na téhle sondě je omyl, ne cesta.
          handle {
            respond 404
          }
        }
        :80 {
          # Přístupový log. Prázdný, dokud EDGE_DOOR_MODE != observe.
          $${access_log}

          # Dveře. Prázdné, dokud EDGE_DOOR_MODE != enforce.
          # Platí na VŠECHNO — health už tu není, takže žádná výjimka.
          $${door_open}

          # Per-host routing. Each public *.${PUBLIC_TLD} maps to ONE
          # upstream *.${INTERNAL_TLD} endpoint over public TLS.
          # NEVER catch-all — misroutes hit 404.
          #
          # Host header strategy (transitional bypass mode):
          #   header_up Host = upstream host (${API_DOMAIN})
          #     → backend's Traefik routes correctly to gateway
          #   header_up X-Forwarded-Host = browser's original Host (${API_DOMAIN_PUBLIC})
          #     → OAuth2 Proxy can scope cookies correctly (with multi-zone
          #       COOKIE_DOMAINS configured)
          #
          # When mesh routing is restored (post-OpenXPKI), this can switch back
          # to forwarding the browser Host directly.

          # MCP JSON-RPC clients use the public MCP domain, but the
          # implementation currently lives behind the API gateway function
          # route. Keep n8n editor/webhooks on the same host for now, and
          # split only the MCP function path before the generic n8n proxy.
          @mcpRpc {
            host $${MCP_DOMAIN}
            path /functions/v1/mcp-knowledge-server*
          }
          handle @mcpRpc {
            reverse_proxy $${API_UPSTREAM} {
              header_up Host $${api_host}
              header_up X-Forwarded-Host {http.request.host}
              header_up X-Forwarded-Proto https$${api_tls}
            }
          }

          @mcp host $${MCP_DOMAIN}
          handle @mcp {
            reverse_proxy $${MCP_UPSTREAM} {
              header_up Host {http.request.host}
              header_up X-Forwarded-Host {http.request.host}
              header_up X-Forwarded-Proto https
              import mesh_dns
            }
          }

          @api host $${API_DOMAIN_PUBLIC}
          handle @api {
            # Komprese JSON odpovědí API. Změřeno 2026-07-31: NIC na api cestě
            # nekomprimovalo (PostgREST ani gateway neposílají content-encoding),
            # takže tabulkové bloky letěly nekomprimované — wb_obligations 450 kB,
            # sm_invoices 4,9 MB, wf_timeline 3,6 MB; JSON se přitom komprimuje
            # 8–15×. Match jen na application/json: SSE stream (text/event-stream,
            # /chat) se komprimovat NESMÍ kvůli flushům, a statika extranetu jde
            # jiným handle a komprimovaná už je. POZOR: jen zstd+gzip — image
            # caddy:2.8.4 nemá brotli modul (ověřeno caddy list-modules; `br` by
            # shodil celý edge při načtení Caddyfile).
            encode zstd gzip {
              match {
                header Content-Type application/json*
              }
            }
            reverse_proxy $${API_UPSTREAM} {
              header_up Host $${api_host}
              header_up X-Forwarded-Host {http.request.host}
              header_up X-Forwarded-Proto https$${api_tls}
            }
          }

          @dirigent host $${DIRIGENT_DOMAIN}
          handle @dirigent {
            reverse_proxy $${DIRIGENT_UPSTREAM} {
              header_up Host {http.request.host}
              header_up X-Forwarded-Host {http.request.host}
              header_up X-Forwarded-Proto https
              import mesh_dns
            }
          }

          # ${KEYCLOAK_DOMAIN_PUBLIC} — public alias to Keycloak (${KEYCLOAK_DOMAIN}).
          # KC has KC_PROXY_HEADERS=xforwarded so it generates iss/redirect
          # URLs using X-Forwarded-Host (= ${KEYCLOAK_DOMAIN_PUBLIC}). The Host header
          # forwarded upstream stays as ${KEYCLOAK_DOMAIN} so KC_HOSTNAME's
          # canonical check passes.
          @auth host $${AUTH_DOMAIN_PUBLIC}
          handle @auth {
            reverse_proxy $${AUTH_UPSTREAM} {
              header_up Host $${auth_host}
              header_up X-Forwarded-Host {http.request.host}
              header_up X-Forwarded-Proto https$${auth_tls}
            }
          }

          # live.${PUBLIC_TLD} (ws-gateway WebSocket) — conditional; empty when
          # realtime is not in the profile (see live_block derivation above).
          $${live_block}

          # extra.${PUBLIC_TLD} (customer extranet surface) — conditional; empty
          # when the profile ships no extranet (see extranet_block above).
          $${extranet_block}

          # gateway.${PUBLIC_TLD} (LLM gateway IDE proxy) — conditional.
          $${gateway_block}

          # companion.${PUBLIC_TLD} (OpenClaw) — conditional.
          $${companion_block}

          # ingest.${PUBLIC_TLD} (svc-local-ingest cockpit) — conditional.
          $${ingest_block}

          # potok.${PUBLIC_TLD} (svc-potok cockpit) — conditional.
          $${potok_block}

          # netbird.${PUBLIC_TLD} (řídicí rovina meshe → přímá tvář) — conditional.
          $${netbird_block}
          $${netbird_model_block}
          # Cizí aplikace přes mesh (EXTERNAL_FACES) — conditional.
          $${external_faces_block}

          # Apex (bare $${PUBLIC_TLD}) → 308 https://$${APP_DOMAIN}{uri}.
          # Conditional: empty when PUBLIC_TLD is unset or == APP_DOMAIN
          # (see apex_block derivation above).
          $${apex_block}

          # Unknown host → fail loud (never accidentally proxy elsewhere).
          handle {
            respond "edge-proxy: unknown host (no rule matched)" 404
          }
        }
        CADDY

        echo "[edge-proxy] Caddy upstream routes:"
        echo "  - $${MCP_DOMAIN}        → $${MCP_UPSTREAM}"
        echo "  - $${API_DOMAIN_PUBLIC} → $${API_UPSTREAM}"
        echo "  - $${DIRIGENT_DOMAIN}   → $${DIRIGENT_UPSTREAM}"
        echo "  - $${AUTH_DOMAIN_PUBLIC} → $${AUTH_UPSTREAM}"
        if [ -n "$${apex_block}" ]; then
          echo "  - $${PUBLIC_TLD} → 308 https://$${APP_DOMAIN}{uri} (apex redirect)"
        fi

        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      # Zdraví = wget. Úklid evidence (viz command) jede ZA ním a jeho výsledek verdikt NEOVLIVNÍ.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/__edge_health; r=$$?; [ ! -x /tmp/edge-uklid.sh ] || timeout 2 /tmp/edge-uklid.sh >/dev/null 2>&1; [ $$r -eq 0 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "coolify.managed=true"

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

volumes:
  edge-proxy-data:
    name: ${APP_NAME_PREFIX:?}_edge-proxy-data
  edge-pristupy:
    name: ${APP_NAME_PREFIX:?}_edge-pristupy
  pki-certs:
    name: ${APP_NAME_PREFIX:?}_pki-certs
  mesh-diag:
    name: ${APP_NAME_PREFIX:?}_mesh-diag
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  coolify:
    external: true
    name: coolify
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}
