# Prose lives in docs/compose-notes/docker-compose.coolify-potok.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
services:
  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-potok--pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:-true}
      PKI_BUNDLE_WAIT_S: ${PKI_BUNDLE_WAIT_S:-600}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  svc-potok:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    build:
      context: .
      dockerfile: Dockerfile.potok
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-potok
    restart: unless-stopped
    depends_on:
      pki-init:
        condition: service_completed_successfully
    environment:
      - POTOK_TOKEN=${POTOK_TOKEN}
      - POTOK_ALLOWED_HOSTS=${POTOK_ALLOWED_HOSTS}
      - POTOK_GEN_BACKEND=${POTOK_GEN_BACKEND:-}
      - REQUESTS_CA_BUNDLE=/certs/pki/aisha-ca-bundle.pem
      - SSL_CERT_FILE=/certs/pki/aisha-ca-bundle.pem
    volumes:
      - potok-data:/app/data
      - potok-out:/app/out
      - pki-certs:/certs/pki:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys,urllib.request; r=urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=4); sys.exit(0 if r.status==200 else 1)' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      internal:
        aliases: ["${APP_NAME_PREFIX:?identita instance}-svc-potok", "svc-potok"]
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-svc-potok
    labels:
      - "coolify.managed=true"

  netbird-agent:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-potok--netbird
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        echo "[netbird-agent] Bridge mode — own netns, no host daemon conflict."
        echo "[netbird-agent] DNS proxy disabled — potok receives inbound mesh only."
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        # Retry loop, NOT exec: a mesh/PKI outage must not kill PID 1 (would climb
        # RestartCount → Coolify restart-limit StopApplication kills the whole app).
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited — retry in 15s; container stays UP (never trips Coolify restart-limit)."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    volumes:
      - netbird-potok-data-v3:/etc/netbird
      - netbird-potok-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_BACKEND}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: backend-potok
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-potok

  potok-mesh-ingress:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_CADDY}
    environment:
      # TÝŽ seznam, jaký dostává gateway — jeden zdroj (`lib/derive-subnets.mjs`).
      # Bez něj Caddy `x-forwarded-for` PŘEPÍŠE a klientská adresa se ztratí.
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-potok--mesh-ingress
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
    command:
      - sh
      - -c
      - |
        # ⛔ NAMĚŘENO 2026-09-01: Caddy bez `trusted_proxies` příchozímu
        # `x-forwarded-for` NEDŮVĚŘUJE a přepíše ho adresou souseda. HAProxy na
        # pfSense hlavičku nastavuje autoritativně (`del-header` + `set-header
        # X-Forwarded-For %[src]`), takže klientská adresa k nám dorazí — a náš
        # skok ji zahodil. Seznam je TÝŽ, jaký dostává gateway; nedoručený se
        # hlásí NAHLAS a Caddyfile se staví bez něj (prázdný `static` by Caddy
        # neustartoval).
        : > /etc/caddy/Caddyfile
        if [ -n "$${GATEWAY_TRUSTED_PROXIES:-}" ]; then
          printf '{\n  servers {\n    trusted_proxies static %s\n  }\n}\n\n' \
            "$$(echo "$${GATEWAY_TRUSTED_PROXIES}" | tr ',' ' ')" > /etc/caddy/Caddyfile
        else
          echo "[caddy] GATEWAY_TRUSTED_PROXIES NEDORUČEN — x-forwarded-for bude PŘEPSÁN"
        fi
        cat >> /etc/caddy/Caddyfile <<'CADDY'
        :8080 {
          handle /__mesh_health {
            respond "ok" 200
          }
          handle {
            reverse_proxy http://${APP_NAME_PREFIX:?identita instance}-svc-potok:8080
          }
        }
        CADDY
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__mesh_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  potok-data:
    name: ${APP_NAME_PREFIX:?}_potok-data
  potok-out:
    name: ${APP_NAME_PREFIX:?}_potok-out
  pki-certs:
    name: ${APP_NAME_PREFIX:?}_potok-pki-certs
  netbird-potok-data-v3:
    name: ${APP_NAME_PREFIX:?}_netbird-potok-data
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  coolify:
    external: true
    name: coolify
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}