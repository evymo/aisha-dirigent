        echo "[mesh-route] $${NETBIRD_PEER_CIDR} via $${NETBIRD_DNS_IP}"
        exec node dist/server.js
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /run/money:mode=0700,size=1m
    environment:
      <<: *svc-env
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?mesh}
      SVC_MONEY_PORT: "3016"
      SVC_MONEY_API_TOKEN: ${SVC_MONEY_API_TOKEN:-}
      VPN_ENABLED: ${VPN_ENABLED:-true}
      VPN_PROFILE_B64: ${VPN_PROFILE_B64:-}
      VPN_AUTH_USER: ${VPN_AUTH_USER:-}
      VPN_AUTH_PASS: ${VPN_AUTH_PASS:-}
      VPN_KEY_PASSPHRASE: ${VPN_KEY_PASSPHRASE:-}
      VPN_CONNECT_RETRY_MAX: ${VPN_CONNECT_RETRY_MAX:-3}
      # ⛔ NAMĚŘENO 2026-08-29: prázdný default sem doručil PRÁZDNOU hodnotu a
      # `parseInt('')` dal NaN → tunel se zavíral IHNED po každém dotazu (další
      # dotaz pak trefil openvpn uprostřed vypínání). Default musí být hodnota,
      # ne prázdno — prázdno není „výchozí", je to NEPLATNÝ vstup.
      VPN_IDLE_MS: ${VPN_IDLE_MS:-300000}
      MONEY_HOST: ${MONEY_HOST:-}
      MONEY_AGENDAS: ${MONEY_AGENDAS:-}
      MONEY_PAGE_SIZE: ${MONEY_PAGE_SIZE:-500}
      MONEY_REQUEST_TIMEOUT_MS: ${MONEY_REQUEST_TIMEOUT_MS:-60000}
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3016/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\" || exit 1"]
    networks:
      internal:
        aliases: ["svc-money", "${APP_NAME_PREFIX:?identita instance}-svc-money"]
      mesh-dns: {}

