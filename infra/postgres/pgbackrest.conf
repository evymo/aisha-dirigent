# pgBackRest configuration — AISHA PostgreSQL (DB-03 continuous WAL archiving / PITR).
#
# Baked into the platform Postgres image (infra/postgres) (bake-not-bind). Two consumers read this one file:
#   - the `db` container:  archive_command = 'pgbackrest --stanza=aisha archive-push %p'
#   - the `pgbackrest` sidecar (docker-compose.coolify.yml): stanza-create +
#     scheduled base backups (via pgbackrest-backup.sh) + expire.
#
# The sidecar reuses this same image, so it shares the postgres UID; it connects
# to the primary over the shared unix socket (pg1-socket-path, the `pg-run`
# volume) — no TLS/SSH — and reads the data files directly through the shared
# PGDATA volume (pg1-path, read-only). The repo lives on its own `pgbackrest-repo`
# volume, OFF the PGDATA volume, so a data-dir loss still leaves a restorable
# base backup + WAL stream.
#
# Repo backend defaults to a local volume. To ship backups OFF-host (recommended
# for production durability, since a local repo shares the host's fate) point
# repo1 at the in-cluster MinIO over S3 WITHOUT rebuilding the image: set
# PGBACKREST_REPO1_TYPE=s3, PGBACKREST_REPO1_S3_ENDPOINT=minio:9000,
# PGBACKREST_REPO1_S3_BUCKET / _KEY / _SECRET as env on both the db service and
# the pgbackrest sidecar (pgBackRest reads PGBACKREST_* env, which overrides this
# file).

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=4
compress-type=zst
compress-level=3
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
start-fast=y

[aisha]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
