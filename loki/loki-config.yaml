# Phase 12 WP 0.2 — Loki config with MinIO S3 backend (per §-1.12 R3).
#
# Single-binary mode: ingester + distributor + querier + ruler all in one
# process. Suitable for AISHA scale (~24 services × ~100 req/sec at peak).
# Storage: MinIO at minio:9000 (existing in coolify-langfuse stack).
# WAL: local volume `loki-wal` for crash-recovery between writes to S3.
#
# Bootstrap MinIO buckets ONCE before first deploy:
#   docker exec aisha-minio-init mc mb aisha/aisha-loki-chunks --ignore-existing
#   docker exec aisha-minio-init mc mb aisha/aisha-loki-ruler  --ignore-existing
# (these create the buckets idempotently; safe to re-run)
#
# Log shipping: Loki Docker driver per host (R5 — no promtail). Installed
# on Frontend via `docker plugin install grafana/loki-docker-driver:3.0 \
#     --alias loki --grant-all-permissions`
# Then per service: `logging: { driver: loki, options: ... }` in compose.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  ring:
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki

memberlist:
  join_members: []  # single-node

ingester:
  lifecycler:
    address: 0.0.0.0
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  aws:
    endpoint: ${MINIO_ENDPOINT}
    bucketnames: aisha-loki-chunks
    region: us-east-1
    access_key_id: ${MINIO_ACCESS_KEY}
    secret_access_key: ${MINIO_SECRET_KEY}
    s3forcepathstyle: true
    insecure: true
    http_config:
      insecure_skip_verify: true
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  retention_period: 336h  # 14 days
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  max_query_series: 5000
  max_query_parallelism: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: s3

ruler:
  storage:
    type: s3
    s3:
      endpoint: ${MINIO_ENDPOINT}
      bucketnames: aisha-loki-ruler
      region: us-east-1
      access_key_id: ${MINIO_ACCESS_KEY}
      secret_access_key: ${MINIO_SECRET_KEY}
      s3forcepathstyle: true
      insecure: true
  rule_path: /loki/rules
  alertmanager_url: ""
  ring:
    kvstore:
      store: inmemory

analytics:
  reporting_enabled: false
