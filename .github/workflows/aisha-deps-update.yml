# =============================================================================
# AISHA dependency update sweep (self-hosted Dependabot replacement)
# =============================================================================
# The hand-maintained Dependabot directory list drifted (11 packages,
# 6 services, the dirigent extension and images/plugin-exec/shim were never
# covered). scripts/aisha-deps-update.mjs discovers targets from
# package-lock.json files instead, computes a minor+patch-only plan (majors stay
# bespoke PRs), gives npm-audit findings a priority "security" group, and opens
# idempotent `deps/*` PRs through the GitHub REST API (repository =
# GITHUB_REPOSITORY of this run — no forge or repository is baked in).
#
# Internal @aisha/* packages are NEVER bumped here — they flow through
# aisha-packages-publish (the script reports registry version drift so the
# operator merges the package bump first, publishes, then re-runs this sweep).
#
# Phases (docs/security/DEPS_UPDATE_RUNBOOK.md):
#   1. cron runs are DRY-RUN — the plan lands in the job log
#   2. operator dispatches with apply=true for dev/patch groups
#   3. apply becomes the cron default once trusted (edit APPLY below)
#   4. flip npm-audit CI jobs to gating
#
# OPT-IN: the weekly cron only runs in a repository that sets the variable
# DEPS_UPDATE_SCHEDULED=true; without it the scheduled wake-up is skipped (the
# job shows as skipped, not green). workflow_dispatch always runs.
#
# Tokens:
#   GITHUB_TOKEN        default — pushes the deps/* branch and opens the PR.
#                       GitHub does NOT start workflows for events created by
#                       GITHUB_TOKEN, so such a PR gets no CI run on its own.
#   DEPS_UPDATE_TOKEN   optional secret (fine-grained PAT or GitHub App token
#                       with contents + pull-requests write). When set it is used
#                       for both push and PR, so the PR triggers CI like any other.
# Optional:
#   AISHA_GATEWAY_URL + POSTGREST_SERVICE_TOKEN  audit beacon
#
# Locally (no CI at all): `node scripts/aisha-deps-update.mjs` prints the same
# plan; APPLY=1 additionally needs GITHUB_REPOSITORY + GITHUB_TOKEN.
# =============================================================================

name: AISHA Deps Update

on:
  schedule:
    # Monday 02:00 UTC = 04:00 Europe/Prague (matches the dependabot cadence)
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply (open PRs) — default is dry-run plan only"
        required: false
        type: boolean
        default: false
      target_filter:
        description: "Substring filter on target paths (e.g. mobile-app, root)"
        required: false
        type: string
        default: ""

concurrency:
  # One sweep at a time; a queued second run just recomputes the plan.
  group: aisha-deps-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: "22"

jobs:
  sweep:
    name: Dependency update sweep
    if: github.event_name == 'workflow_dispatch' || vars.DEPS_UPDATE_SCHEDULED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is NOT needed; branches are created from origin/main
          # fetched explicitly by the script.
          fetch-depth: 1
          # The push of the deps/* branch uses the same token as the PR, so a
          # configured DEPS_UPDATE_TOKEN makes the whole PR CI-visible.
          token: ${{ secrets.DEPS_UPDATE_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install root dependencies
        # --ignore-scripts blocks install-script supply-chain execution;
        # packages come from the default npm registry (package-lock.json integrity).
        run: |
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run sweep
        env:
          GITHUB_TOKEN: ${{ secrets.DEPS_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          AISHA_GATEWAY_URL: ${{ secrets.AISHA_GATEWAY_URL }}
          POSTGREST_SERVICE_TOKEN: ${{ secrets.POSTGREST_SERVICE_TOKEN }}
          APPLY: ${{ inputs.apply == true && '1' || '' }}
          TARGET_FILTER: ${{ inputs.target_filter }}
        run: |
          node scripts/aisha-deps-update.mjs
