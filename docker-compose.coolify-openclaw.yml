# Prose lives in docs/compose-notes/docker-compose.coolify-openclaw.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
services:
  openclaw-db-init:
    image: ${REGISTRY_PROXY}library/postgres:17-alpine
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-openclaw-db-init
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      OPENCLAW_DB_PASSWORD: ${OPENCLAW_DB_PASSWORD}
    command:
      - sh
      - -c
      - |
        set -e
        # Pojistka u spotřeby — proč tady a ne v compose: docs/compose-notes/.
        [ -n "$${OPENCLAW_DB_PASSWORD}" ] || { echo "FATAL: OPENCLAW_DB_PASSWORD je prazdne — ucet by vznikl bez pouzitelneho hesla." >&2; exit 1; }
        # Wait for aisha-db — cross-stack dependency (core stack) that may be mid-restart
        # during cold-start (entrypoint-wrapper.sh re-applies role passwords ~60s after
        # boot; the wave-4 core gate is SOFT). Bounded so a genuinely-dead DB fails loudly
        # instead of hanging the wave. Same resilient wait pattern as n8n-config-init.
        i=0; until pg_isready -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -q 2>/dev/null; do
          i=$$((i+1)); [ "$$i" -ge 150 ] && { echo "[openclaw-db-init] ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db not ready after 300s — aborting"; exit 1; }
          echo "[openclaw-db-init] waiting for ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db ($$i)"; sleep 2
        done
        psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -tc \
          "SELECT 1 FROM pg_roles WHERE rolname='openclaw_app'" \
          | grep -q 1 || \
          psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -c \
          "CREATE USER openclaw_app WITH PASSWORD '$${OPENCLAW_DB_PASSWORD}';"

        psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -c \
          "CREATE SCHEMA IF NOT EXISTS openclaw AUTHORIZATION openclaw_app;"
        psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -c \
          "GRANT CONNECT ON DATABASE postgres TO openclaw_app;"
        psql -h ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db -U aisha_admin -d postgres -c \
          "GRANT USAGE, CREATE ON SCHEMA openclaw TO openclaw_app;"

        echo "[openclaw-db-init] openclaw_app + schema ready"
    healthcheck:
      disable: true
    networks:
      - internal

  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-openclaw-pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      # Odvozuje cold-start z manifestu (pki nasazeno ⇒ true); bez PKI se vypíná
      # POŽADAVEK, ne jen adresa — výklad: docs/compose-notes/docker-compose.coolify.yml.md
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:?odvozuje cold-start z manifestu; bez něj pki-init trvá na bundlu i bez PKI}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  openclaw:
    cap_add: [NET_ADMIN]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ip route replace "$${NETBIRD_PEER_CIDR:?}" via "$${NETBIRD_DNS_IP:?}"
        echo "[mesh-route] $${NETBIRD_PEER_CIDR} via $${NETBIRD_DNS_IP}"
        exec su-exec node node dist/server.js
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    build:
      context: .
      dockerfile: services/svc-openclaw/Dockerfile
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-openclaw
    restart: unless-stopped
    extra_hosts:
      - "${KEYCLOAK_DOMAIN_PUBLIC}:host-gateway"
      # Druhé jméno MUSÍ být různé (extra_hosts je mapa, duplicita = „must be a
      # mapping“); resolver vydá přímou doménu, nebo .invalid sentinel — výklad:
      # docs/compose-notes/docker-compose.coolify-pki.yml.md
      - "${KEYCLOAK_EXTRA_HOST_ALIAS:?vydává derive-domains; bez něj by extra_hosts nesl duplicitu nebo prázdné jméno}:host-gateway"
    environment:
      - NETBIRD_PEER_CIDR=${NETBIRD_PEER_CIDR:?mesh}
      - NODE_ENV=production
      - DATABASE_URL=postgresql://openclaw_app:${OPENCLAW_DB_PASSWORD}@${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-db:5432/postgres?schema=openclaw
      - OPENCLAW_API_KEY=${OPENCLAW_API_KEY}
      - OPENCLAW_SECRET=${OPENCLAW_SECRET}
      - OPENCLAW_DOMAIN=${OPENCLAW_DOMAIN}
      - OPENCLAW_PUBLIC_URL=https://${OPENCLAW_DOMAIN}
      - AISHA_MCP_URL=https://${API_DOMAIN}/mcp
      - AISHA_LLM_GATEWAY_URL=${AISHA_LLM_GATEWAY_URL:-}
      - AISHA_LLM_GATEWAY_KEY=${AISHA_LLM_GATEWAY_KEY:?Set AISHA_LLM_GATEWAY_KEY in Coolify env (generated by cold-start)}
      - POSTGREST_URL=${POSTGREST_URL:?POSTGREST_URL must be generated by topology resolver}
      - POSTGREST_SERVICE_JWT=${POSTGREST_SERVICE_JWT:-}
      - AUTH_OIDC_CLIENT_ID=${OPENCLAW_OIDC_CLIENT_ID:-openclaw}
      - AUTH_OIDC_CLIENT_SECRET=${OPENCLAW_OIDC_SECRET:?OPENCLAW_OIDC_SECRET is required — generated by scripts/generate-secrets.mjs and bulk-pushed per-app by scripts/coolify-sync-envs.sh (mandatory cold-start step)}
      - AUTH_OIDC_ISSUER=https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}
      - OPENCLAW_TELEGRAM_TOKEN=${OPENCLAW_TELEGRAM_TOKEN:-}
      - OPENCLAW_SLACK_TOKEN=${OPENCLAW_SLACK_TOKEN:-}
      - OPENCLAW_MATRIX_HOMESERVER=${OPENCLAW_MATRIX_HOMESERVER:-}
      - OPENCLAW_MATRIX_TOKEN=${OPENCLAW_MATRIX_TOKEN:-}
      - OPENCLAW_DISCORD_TOKEN=${OPENCLAW_DISCORD_TOKEN:-}
      - OPENCLAW_MAX_PARALLEL_AGENTS=${OPENCLAW_MAX_PARALLEL_AGENTS:-3}
      - OPENCLAW_SANDBOX_CPU_LIMIT=${OPENCLAW_SANDBOX_CPU_LIMIT:-2}
      - OPENCLAW_SANDBOX_MEM_LIMIT=${OPENCLAW_SANDBOX_MEM_LIMIT:-4G}
      - NODE_EXTRA_CA_CERTS=/certs/pki/aisha-ca-bundle.pem
    volumes:
      - openclaw-data:/app/data
      - pki-certs:/certs/pki:ro
    depends_on:
      openclaw-db-init:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
    expose:
      - "5210"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5210/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-openclaw
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-openclaw
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"

  openclaw-auth:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1-alpine
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-openclaw-auth
    restart: unless-stopped
    extra_hosts:
      - "${KEYCLOAK_DOMAIN_PUBLIC}:host-gateway"
      - "${KEYCLOAK_EXTRA_HOST_ALIAS:?vydává derive-domains; bez něj by extra_hosts nesl duplicitu nebo prázdné jméno}:host-gateway"
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_PREFIX:-}openclaw-proxy
      OAUTH2_PROXY_CLIENT_SECRET: ${OPENCLAW_OIDC_SECRET}
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: https://${KEYCLOAK_DOMAIN_PUBLIC}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      OAUTH2_PROXY_PROFILE_URL: https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://${APP_NAME_PREFIX:?identita instance — jméno na sdílené síti ji MUSÍ nést}-openclaw:5210
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECRET: ${OPENCLAW_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_NAME: _aisha_openclaw_proxy
      OAUTH2_PROXY_COOKIE_DOMAINS: ${OAUTH2_COOKIE_DOMAINS}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${OAUTH2_WHITELIST_DOMAINS}
      OAUTH2_PROXY_ALLOWED_GROUPS: openclaw_access
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: roles
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/health,^/\\.well-known/.*"
    expose:
      - "4180"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4180/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      openclaw:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-openclaw-auth
      coolify:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-openclaw-auth
      mesh-dns:
        aliases:
          - ${APP_NAME_PREFIX:?identita instance}-openclaw-auth
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"
      - "caddy_0.handle_path.0_reverse_proxy=aisha-openclaw-auth:4180"
      - "traefik.enable=true"

  netbird-agent:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-openclaw--netbird
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        echo "[netbird-agent] Bridge mode — own netns, no host daemon conflict."
        echo "[netbird-agent] DNS proxy disabled — openclaw receives inbound mesh only."
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited — retry in 15s; container stays UP (never trips Coolify restart-limit)."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    volumes:
      - netbird-openclaw-data-v3:/etc/netbird
      - netbird-openclaw-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_BACKEND}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: backend-openclaw
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    expose:
      - "5210"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
    networks:
      - internal
      - mesh-dns

  openclaw-mesh-ingress:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_CADDY}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-model--mesh-ingress
    restart: unless-stopped
    network_mode: "service:netbird-agent"
    depends_on:
      netbird-agent:
        condition: service_started
    environment:
      OPENCLAW_MESH_INGRESS_ROUTES: ${OPENCLAW_MESH_INGRESS_ROUTES:-}
      # TÝŽ seznam, jaký dostává gateway — jeden zdroj (`lib/derive-subnets.mjs`).
      # Bez něj Caddy `x-forwarded-for` přepíše a klientská adresa se ztratí.
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$${OPENCLAW_MESH_INGRESS_ROUTES:-}" ]; then
          echo "[mesh-ingress] OPENCLAW_MESH_INGRESS_ROUTES prázdné — derivace nic nevydala nebo se nedoručila."
          echo "[mesh-ingress] Naslouchám jen na health, aby bylo VIDĚT, že tabulka chybí."
          # ⛔ STAV BEZ TABULKY MUSÍ BÝT VIDĚT SONDĚ (naměřeno 2026-09-03).
          # Záložní Caddyfile poslouchal na :8000, ale healthcheck sonduje :5210 —
          # port této služby. Sonda tedy dostala „connection refused" místo
          # navrženého 503 „bez směrovací tabulky", a diagnóza vedla k „zavřený
          # port" místo ke skutečné příčině. Neshoda byla v 15 z 16 stacků;
          # jediný, kde porty seděly, byl `model`, jehož vlastní port JE 8000 —
          # vzor se trefil sám sebou a vada byla ze zdroje neviditelná.
          printf ':5210 {\n  handle /__mesh_health {\n    respond "no-routes" 503\n  }\n  handle {\n    respond "mesh-ingress bez směrovací tabulky" 503\n  }\n}\n' > /etc/caddy/Caddyfile
        else
          : > /etc/caddy/Caddyfile
          # ⛔ NAMĚŘENO 2026-08-31: brána viděla `x-forwarded-for` s JEDINÝM
          # prvkem — adresou svého souseda (mesh-router edge). To je podpis
          # NAHRAZENÍ, ne řetězu: Caddy bez `trusted_proxies` příchozí hlavičce
          # nedůvěřuje a přepíše ji tím, kdo se právě připojil. Každý náš skok
          # tak řetěz zahodil a klientská adresa se ke dveřím NEDOSTALA —
          # `enforce` by zamkl i majitele.
          #
          # Hodnota se NEOPISUJE: je to TÝŽ seznam, jaký dostává gateway
          # (`lib/derive-subnets.mjs` → GATEWAY_TRUSTED_PROXIES). Dva tvary
          # (čárky pro env, mezery pro Caddy), jeden zdroj — kdyby si je každý
          # skládal sám, chůze zprava by v každém prvku končila jinde.
          if [ -n "$${GATEWAY_TRUSTED_PROXIES:-}" ]; then
            printf '{\n  servers {\n    trusted_proxies static %s\n  }\n}\n\n' \
              "$$(echo "$${GATEWAY_TRUSTED_PROXIES}" | tr ',' ' ')" >> /etc/caddy/Caddyfile
          else
            # Nedoručený seznam se NEDOSAZUJE. Bez něj Caddy řetěz přepíše —
            # to je vada, ale TICHÁ; tady se aspoň řekne nahlas.
            echo "[mesh-ingress] GATEWAY_TRUSTED_PROXIES nedoručen — x-forwarded-for bude PŘEPSÁN, klientská adresa se ztratí"
          fi
          PORTS=$$(echo "$${OPENCLAW_MESH_INGRESS_ROUTES}" | tr ';' '\n' | cut -d'|' -f1 | sort -un)
          for P in $$PORTS; do
            printf ':%s {\n  handle /__mesh_health {\n    respond "ok" 200\n  }\n' "$$P" >> /etc/caddy/Caddyfile
            echo "$${OPENCLAW_MESH_INGRESS_ROUTES}" | tr ';' '\n' | while IFS='|' read -r RP RH RT; do
              [ "$$RP" = "$$P" ] || continue
              M=$$(echo "$$RH" | cut -d, -f1 | cut -d. -f1 | tr '-' '_')
              HOSTS=$$(echo "$$RH" | tr ',' ' ')
              printf '  @%s host %s\n  handle @%s {\n    reverse_proxy http://%s\n  }\n' "$$M" "$$HOSTS" "$$M" "$$RT" >> /etc/caddy/Caddyfile
            done
            printf '  handle {\n    respond "mesh-ingress: Host nepatri na tento port" 421\n  }\n}\n' >> /etc/caddy/Caddyfile
          done
          echo "[mesh-ingress] tabulka: $$(echo "$${OPENCLAW_MESH_INGRESS_ROUTES}" | tr ';' '\n' | wc -l) tras na $$(echo "$$PORTS" | wc -w) portech"
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5210/__mesh_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  netbird-openclaw-data-v3:
    name: ${APP_NAME_PREFIX:?}_netbird-openclaw-data
  pki-certs:
    name: ${APP_NAME_PREFIX:?}_openclaw-pki-certs
  openclaw-data:
    name: ${APP_NAME_PREFIX:?}_openclaw-data
networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  coolify:
    external: true
    name: coolify
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}