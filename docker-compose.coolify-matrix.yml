    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    <<: *bridge-common
    profiles: ["bridge-signal"]
    image: ${IMAGE_MAUTRIX_SIGNAL}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-bridge-signal
    volumes:
