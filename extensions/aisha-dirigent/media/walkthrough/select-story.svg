<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <rect width="480" height="320" rx="16" fill="#0E0E10"/>

  <!-- Story cards illustration -->
  <g transform="translate(60, 25)">
    <!-- Card 1 (back, tilted) -->
    <g transform="rotate(-5, 100, 90)">
      <rect x="40" y="20" width="160" height="110" rx="10" fill="#16161A" stroke="#2A2A30" stroke-width="1"/>
      <rect x="52" y="32" width="80" height="6" rx="3" fill="#2A2A30"/>
      <rect x="52" y="44" width="130" height="4" rx="2" fill="#1F1F24"/>
      <rect x="52" y="52" width="100" height="4" rx="2" fill="#1F1F24"/>
    </g>

    <!-- Card 2 (middle) -->
    <g transform="translate(50, 10)">
      <rect x="40" y="20" width="160" height="110" rx="10" fill="#16161A" stroke="#2A2A30" stroke-width="1"/>
      <rect x="52" y="32" width="90" height="6" rx="3" fill="#E55A10" opacity="0.7"/>
      <rect x="52" y="44" width="130" height="4" rx="2" fill="#1F1F24"/>
      <rect x="52" y="52" width="100" height="4" rx="2" fill="#1F1F24"/>
      <rect x="52" y="64" width="60" height="18" rx="4" fill="#E55A10" fill-opacity="0.15" stroke="#E55A10" stroke-width="0.8"/>
      <text x="82" y="77" text-anchor="middle" fill="#E55A10" font-family="system-ui" font-size="9">In Progress</text>
    </g>

    <!-- Card 3 (front, main) -->
    <g transform="translate(100, 0)">
      <rect x="40" y="20" width="160" height="110" rx="10" fill="#16161A" stroke="#FF6A1A" stroke-width="1.5"/>
      <rect x="52" y="32" width="100" height="7" rx="3" fill="#FF6A1A" opacity="0.8"/>
      <rect x="52" y="46" width="135" height="4" rx="2" fill="#2A2A30"/>
      <rect x="52" y="54" width="110" height="4" rx="2" fill="#2A2A30"/>
      <rect x="52" y="62" width="80" height="4" rx="2" fill="#2A2A30"/>

      <!-- Mini avatar bubbles -->
      <circle cx="56" cy="82" r="8" fill="#FF6A1A" opacity="0.3"/>
      <circle cx="56" cy="82" r="5" fill="#FF6A1A"/>
      <text x="56" y="85" text-anchor="middle" fill="#fff" font-size="6" font-weight="bold">A</text>

      <circle cx="72" cy="82" r="8" fill="#FBBE3C" opacity="0.3"/>
      <circle cx="72" cy="82" r="5" fill="#FBBE3C"/>
      <text x="72" y="85" text-anchor="middle" fill="#fff" font-size="6" font-weight="bold">Z</text>

      <!-- Status badge -->
      <rect x="52" y="98" width="50" height="18" rx="4" fill="#FF6A1A" fill-opacity="0.15" stroke="#FF6A1A" stroke-width="0.8"/>
      <text x="77" y="111" text-anchor="middle" fill="#FF6A1A" font-family="system-ui" font-size="9">Active</text>

      <!-- Star -->
      <path transform="translate(185, 36)" fill="#E55A10"
        d="M0 -6 L1.76 -1.85 L6 -1.5 L2.8 1.4 L3.7 5.7 L0 3.4 L-3.7 5.7 L-2.8 1.4 L-6 -1.5 L-1.76 -1.85 Z"/>
    </g>
  </g>

  <!-- Title -->
  <text x="240" y="265" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="600">
    Vyberte story
  </text>
  <text x="240" y="288" text-anchor="middle" fill="#9A9A9E" font-family="system-ui, sans-serif" font-size="12">
    Každý projekt má svůj příběh — vyberte na čem dnes pracujete
  </text>
</svg>
