# Prose lives in docs/compose-notes/docker-compose.coolify-playwright.yml.md — this file is shipped to the
# server as a command-line argument and competes with ARG_MAX, so it carries
# configuration only. Add explanations there, anchored to the line they explain.
x-pw-healthcheck: &pw-healthcheck
  interval: 15s
  timeout: 5s
  start_period: 15s
  retries: 5

services:
  svc-playwright-runner:
    dns:
      - ${NETBIRD_DNS_IP:?required — generate-secrets derives it from MESH_DNS_RESOLVER_IP; coolify-sync-envs delivers it}
    dns_search:
      - ${MESH_TLD:?MESH_TLD required — generate-secrets emits the mesh TLD}
    # ⛔ DŘÍV `image: mcr.microsoft.com/playwright` + bind mount zdrojáku z repa.
    # Nemohlo to nastartovat: v repu je `worker.ts`, `tsc` nikdo nespouštěl,
    # `outDir` je `dist/` (ne `src/`) a mount jde z klonu BEZ `node_modules`.
    # Obraz si teď kód i závislosti nese sám — viz Dockerfile.svc-playwright-runner.
    build:
      context: .
      dockerfile: Dockerfile.svc-playwright-runner
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-svc-playwright-runner
    restart: unless-stopped
    working_dir: /app
    environment:
      NETBIRD_PEER_CIDR: ${NETBIRD_PEER_CIDR:?mesh}
      NODE_ENV: production
      AISHA_GATEWAY_URL: ${AISHA_GATEWAY_URL:?vydává derive-domains z config/services.json (internal_url služby gateway) — nehádat hostname}
      POSTGREST_SERVICE_TOKEN: ${POSTGREST_SERVICE_TOKEN:?POSTGREST_SERVICE_TOKEN is required — generated by scripts/generate-secrets.mjs (cold-start step 2)}
      AISHA_PLAYWRIGHT_POLL_S: ${AISHA_PLAYWRIGHT_POLL_S:-30}
      AISHA_PLAYWRIGHT_TIMEOUT_S: ${AISHA_PLAYWRIGHT_TIMEOUT_S:-1800}
      AISHA_PLAYWRIGHT_SPECS_DIR: /app/e2e
      NODE_EXTRA_CA_CERTS: /certs/pki/aisha-ca-bundle.pem
    volumes:
      - pki-certs:/certs/pki:ro
      # Kód služby už NENÍ mountovaný — je v obrazu. Zůstávají jen DATA testů,
      # která v gitu jsou (115 souborů v e2e/), takže je klon na uzlu má.
      - ./e2e:/app/e2e:ro
      - ./playwright.config.ts:/app/playwright.config.ts:ro
    # ABSOLUTNÍ cesta ZÁMĚRNĚ: `working_dir: /app` výš by přebil WORKDIR
    # z Dockerfilu a relativní `dist/worker.js` by mířil na /app/dist/worker.js.
    cap_add: [NET_ADMIN]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ip route replace "$${NETBIRD_PEER_CIDR:?}" via "$${NETBIRD_DNS_IP:?}"
        echo "[mesh-route] $${NETBIRD_PEER_CIDR} via $${NETBIRD_DNS_IP}"
        exec node /app/services/svc-playwright-runner/dist/worker.js
    healthcheck:
      <<: *pw-healthcheck
      test:
        - "CMD-SHELL"
        - "test $(($(date +%s) - $(stat -c %Y /tmp/.aisha-pw-heartbeat 2>/dev/null || echo 0))) -lt 120"
    networks:
      - internal
      - mesh-dns
    labels:
      - "coolify.managed=true"

  pki-init:
    build:
      context: .
      dockerfile: Dockerfile.pki-init
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-playwright--pki-init
    restart: "no"
    environment:
      PKI_BRIDGE_URL: ${PKI_BRIDGE_URL:-}
      # Odvozuje cold-start z manifestu (pki nasazeno ⇒ true); bez PKI se vypíná
      # POŽADAVEK, ne jen adresa — výklad: docs/compose-notes/docker-compose.coolify.yml.md
      PKI_BUNDLE_REQUIRED: ${PKI_BUNDLE_REQUIRED:?odvozuje cold-start z manifestu; bez něj pki-init trvá na bundlu i bez PKI}
    command: ["/usr/local/bin/assemble-ca-bundle.sh"]
    volumes:
      - pki-certs:/certs/pki
    healthcheck:
      disable: true
    networks:
      - internal

  netbird-agent:
    # Mesh komponenta — bez meshe nemá co dělat. Profil "mesh" zapíná
    # coolify-deploy-init.sh podle MESH_ENABLED; hlídá brána mesh-profil-drzi.
    profiles: ["mesh"]
    image: ${IMAGE_NETBIRD}
    container_name: ${APP_NAME_PREFIX:?identita instance — jméno na sdíleném hostiteli ji MUSÍ nést}-playwright--netbird
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pki-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$${NB_SETUP_KEY:-}" ]; then
          echo "[netbird-agent] NB_SETUP_KEY empty for hostname=$${NB_HOSTNAME:-<unset>}"
          echo "[netbird-agent] State: PENDING_BOOTSTRAP — awaiting netbird-bootstrap.sh + redeploy."
          trap 'echo "[netbird-agent] received TERM — exiting idle"; exit 0' TERM INT
          while :; do sleep 3600 & wait "$$!" || true; done
        fi
        if ! command -v netbird >/dev/null 2>&1; then
          echo "[netbird-agent] FATAL: netbird binary not in PATH" >&2
          exit 127
        fi
        echo "[netbird-agent] Bridge mode — own netns, no host daemon conflict."
        echo "[netbird-agent] DNS proxy disabled — playwright receives inbound mesh only."
        # ⛔ NETBIRD 0.70 NEPÍŠE config.json (naměřeno 2026-09-06). Stav drží
        # `default.json` + `active_profile.json`; podmínka na legacy cestu proto
        # neplatila NIKDE — změřeno na 6 z 6 agentů včetně cizího nájemníka.
        # Následek: agent se při KAŽDÉM startu zapsal jako NOVÝ peer, dostal
        # novou mesh IP, a DNS záznam osiřel. Edge pak volal na starou adresu
        # („dial 100.112.246.17:3002: no route to host") → live.<tld> 502.
        # Je to ta příčina, proč se „mesh DNS se neprovisionuje samo" vracelo
        # dokola: nešlo o provisioning, ale o ztrátu identity při restartu.
        # Legacy cesta zůstává kvůli starším agentům — stačí KTERÝKOLI stavový
        # soubor; teprve když není žádný, je zápis do meshe opravdu první.
        CONFIG_FILE="$${NB_CONFIG_FILE:-/etc/netbird/config.json}"
        if [ "$${NB_FORCE_REENROLL:-0}" = "1" ]; then
          echo "[netbird-agent] NB_FORCE_REENROLL=1 — wiping local NetBird state before enrollment."
          rm -rf /etc/netbird/* 2>/dev/null || true
        fi
        for _nb_stav in "$$CONFIG_FILE" /etc/netbird/default.json /var/lib/netbird/default.json; do
          if [ -s "$$_nb_stav" ]; then CONFIG_FILE="$$_nb_stav"; break; fi
        done
        if [ -s "$$CONFIG_FILE" ]; then
          echo "[netbird-agent] Existing config found at $$CONFIG_FILE — reconnecting without setup key."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --hostname "$${NB_HOSTNAME}"
        else
          echo "[netbird-agent] No existing config — enrolling as $${NB_HOSTNAME} via $${NB_MANAGEMENT_URL}."
          set -- --foreground-mode --disable-dns --management-url "$${NB_MANAGEMENT_URL}" --setup-key "$${NB_SETUP_KEY}" --hostname "$${NB_HOSTNAME}"
        fi
        trap 'echo "[netbird-agent] received TERM — exiting"; exit 0' TERM INT
        while :; do
          netbird up "$$@" || true
          echo "[netbird-agent] netbird up exited — retry in 15s; container stays UP (never trips Coolify restart-limit)."
          sleep 15 & wait "$$!" || true
        done
    extra_hosts:
      - "${NETBIRD_MESH_HOST}:${NETBIRD_MGMT_HOST:-host-gateway}"
    volumes:
      - netbird-playwright-data-v3:/etc/netbird
      - netbird-playwright-data-v3:/var/lib/netbird
      - pki-certs:/certs/pki:ro
    environment:
      NB_SETUP_KEY: ${NETBIRD_STACK_KEY_BACKEND}
      NB_MANAGEMENT_URL: https://${NETBIRD_MESH_HOST}:${NETBIRD_MESH_PORT:-33073}
      NB_SSL_TRUST_BUNDLE: /certs/pki/aisha-ca-bundle.pem
      SSL_CERT_FILE: /certs/pki/aisha-ca-bundle.pem
      NB_HOSTNAME: backend-playwright
      NB_FORCE_REENROLL: ${NB_FORCE_REENROLL:-0}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$NB_SETUP_KEY\" ]; then exit 0; fi; ip -o addr show wt0 2>/dev/null | grep -qE 'inet 100\\.'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
    networks:
      - internal

  # ⛔ `playwright-mesh-ingress` ODSTRANĚN 2026-08-25. Runner nemá HTTP
  # rozhraní, takže mu katalog nemá co dát: derivace `PLAYWRIGHT_MESH_INGRESS_ROUTES`
  # vůbec NEVYDÁVÁ. Caddy pak nastartoval do záložní větve, poslouchal na :8000
  # a servíroval 503 — jenže zdravotní sonda ťukala na :8080, takže kontejner byl
  # TRVALE nezdravý. Zdraví aplikace v Coolify je konjunkce VŠECH kontejnerů,
  # takže `<prefix>-playwright` nemohl být zdravý nikdy, ať runner běžel jakkoli.
  #
  # Stack je na meshi kvůli ODCHOZÍMU provozu (testy chodí na mesh jména), ne
  # kvůli příchozímu — na to stačí sám agent. Až runner dostane HTTP rozhraní,
  # zapíše se do katalogu jako `internal_url`, derivace tabulku vydá a ingress
  # se vrátí i s ní. Do té doby by tu stál kontejner, který nemá co směrovat.

volumes:
  netbird-playwright-data-v3:
    name: ${APP_NAME_PREFIX:?}_netbird-playwright-data
  pki-certs:
    external: true

networks:
  internal:
    external: true
    name: ${APP_NAME_PREFIX:?identita instance}-shared-net
  mesh-dns:
    external: true
    name: ${MESH_DNS_NETWORK:?vydává generate-secrets}