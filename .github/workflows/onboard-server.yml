# =============================================================================
# Server Onboarding — Coolify Multi-Server Infrastructure (GitHub Actions)
# =============================================================================
# Manually onboard a new server into the instance's Coolify cluster.
# Registers SSH key, creates server in Coolify, validates Docker.
# (CI runners are not installed from here — the pipeline runs on GitHub-hosted
# runners; a self-hosted runner is registered per GitHub's own docs.)
#
# OPT-IN: runs only in a repository that declares its instance (repository
# variable APP_NAME_PREFIX) and holds COOLIFY_URL + COOLIFY_API_TOKEN.
#
# Usage: GitHub → Actions → Onboard Server → Run workflow
# =============================================================================

name: Onboard Server

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: "Server name (e.g., backend, experimental)"
        required: true
        type: string
      server_ip:
        description: "Server IP (internal network)"
        required: true
        type: string
      server_role:
        description: "Server role"
        required: true
        type: choice
        options:
          - backend
          - build
          - staging
      ssh_user:
        description: "SSH user"
        required: false
        type: string
        default: "root"

concurrency:
  group: onboard-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Bez deklarované instance se nic nenasazuje — a ruční spuštění to řekne
  # nahlas (souhrn běhu), místo aby skončilo prázdným přeskočením.
  nenakonfigurovano:
    name: "Nasazení není nakonfigurované"
    if: vars.APP_NAME_PREFIX == ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Opt-in vysvětlení
        run: |
          echo "::notice title=nasazení je opt-in::Tohle repo nedeklaruje instanci (proměnná APP_NAME_PREFIX), takže se nic nenasazuje."
          {
            echo "### Nasazení je opt-in"
            echo
            echo "Nastav v **Settings → Secrets and variables → Actions**:"
            echo "- proměnnou \`APP_NAME_PREFIX\` (identita instance — prefix jmen Coolify aplikací),"
            echo "- secrety \`COOLIFY_URL\` a \`COOLIFY_API_TOKEN\` (+ volitelně \`GIT_TOKEN\` pro privátní overlaye)."
          } >> "$GITHUB_STEP_SUMMARY"

  onboard:
    name: "Onboard: ${{ github.event.inputs.server_name }}"
    if: vars.APP_NAME_PREFIX != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run onboarding script
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          # Vstupy jdou do skriptu přes env, ne interpolací do shellu
          # (workflow-injection — semgrep-sast).
          SERVER_NAME: ${{ github.event.inputs.server_name }}
          SERVER_IP: ${{ github.event.inputs.server_ip }}
          SERVER_ROLE: ${{ github.event.inputs.server_role }}
          SSH_USER: ${{ github.event.inputs.ssh_user }}
        run: |
          set -euo pipefail
          : "${COOLIFY_URL:?COOLIFY_URL must be set via repository secret}"
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN must be set via repository secret}"
          bash scripts/coolify-server-onboard.sh \
            --name "$SERVER_NAME" \
            --ip "$SERVER_IP" \
            --role "$SERVER_ROLE" \
            --ssh-user "$SSH_USER"
